# Setup every bazel job in this repo needs, in one place: point bazel at the
# BuildBuddy cache. Both `test.yml` jobs use it; `release.yml`'s matrix legs
# do their own thing because they run on bare runners rather than in the
# devcontainer.
#
# Callers must run `actions/checkout` first — a local composite action is
# loaded from the checked-out workspace, so it cannot check itself out.
name: Prepare bazel environment
description: Configure the BuildBuddy remote cache.

inputs:
  buildbuddy-api-key:
    description: >
      BuildBuddy API key. Optional: when empty (a PR from a fork, or a local
      `act` run without secrets) the remote cache is simply not configured and
      bazel runs everything locally. Which key decides which cache — see
      `.bazelrc`'s BuildBuddy block: the release group's key on `main`
      pushes, the contributor group's on everything else.
    required: false
    default: ""
  buildbuddy-config:
    description: >
      The `.bazelrc` config the key belongs to: `buildbuddy` (the
      contributor org) or `buildbuddy-release` (the release org, its own
      host). A key only works against its own org's host, so the two
      inputs travel together.
    required: false
    default: buildbuddy

runs:
  using: composite
  steps:
    # The devcontainer image carries a pre-fetched output base at these
    # paths (`PREFETCH_OUTPUT_BASE` in `.devcontainer/Dockerfile`): every
    # external repository already downloaded and extracted. Pointing
    # bazel at them is what turns ~77 s of fetching before the first
    # action into a marker-file check. The user root matters as much as
    # the output base: Bazel 9's repository contents cache lives under
    # it, and `external/` is symlinks into that cache. A startup option
    # has to come from an rc file or the command line, and
    # `.bazelrc.user` is the one both jobs already write.
    - name: Use the image's pre-fetched output base
      shell: bash
      run: |
        {
          echo "startup --output_user_root=/opt/bazel/user-root"
          echo "startup --output_base=/opt/bazel/output-base"
        } >> .bazelrc.user

    # Drop the key into the workspace `.bazelrc.user` (gitignored) —
    # `.bazelrc`'s `try-import` at the bottom picks it up, and
    # `build --config=buildbuddy` activates the remote cache + BES endpoint.
    # `test` inherits from `build`, so a single `build --config=...` line
    # covers both; adding a separate `test --config=...` line on top
    # double-expands the config and trips bazel's "config expanded more than
    # once" warning.
    - name: Configure BuildBuddy remote cache
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.buildbuddy-api-key }}
        BUILDBUDDY_CONFIG: ${{ inputs.buildbuddy-config }}
      run: |
        set -euo pipefail
        if [[ -n "${BUILDBUDDY_API_KEY:-}" ]]; then
            cat >> .bazelrc.user <<EOF
        common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
        build --config=${BUILDBUDDY_CONFIG}
        EOF
            echo "BuildBuddy remote cache enabled for this job (--config=${BUILDBUDDY_CONFIG})."
        else
            echo "BUILD_BUDDY_API_KEY not available — running without remote cache."
        fi

    - name: Show toolchain versions
      shell: bash
      run: |
        bazel version
        rustc --version || true
