# Setup every bazel job in this repo needs, in one place: point bazel at the
# BuildBuddy cache. Both `test.yml` jobs use it; `release.yml`'s matrix legs
# do their own thing because they run on bare runners rather than in the
# devcontainer.
#
# Callers must run `actions/checkout` first — a local composite action is
# loaded from the checked-out workspace, so it cannot check itself out.
name: Prepare bazel environment
description: Configure the BuildBuddy remote cache and persist bazel's repository cache.

inputs:
  buildbuddy-api-key:
    description: >
      BuildBuddy API key. Optional: when empty (a PR from a fork, or a local
      `act` run without secrets) the remote cache is simply not configured and
      bazel runs everything locally.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Bazel's repository cache: every archive a repository rule downloads
    # (the Rust toolchain, rustfmt, Python, Node, ~300 crates, ~240 npm
    # tarballs, the three qmd GGUF models — ~2.5 GB), keyed by its own
    # sha256. Without this it is re-downloaded into the empty container
    # on every run: on a warm run of `main` that was ~320 thread-seconds
    # of `Fetching repository`, and most of the ~100 s that looked like
    # "analysis" (the same analysis takes ~10 s with the repositories
    # already fetched). BuildBuddy's remote downloader only changes
    # where the bytes come from, not that they are fetched.
    #
    # Safe to persist in a way the action/disk cache was not (see the
    # test.yml header): entries are content-addressed and bazel verifies
    # the sha256 on use, so a stale or partial cache costs a download,
    # never a wrong build. The key is the set of lockfiles that decide
    # what gets fetched; `restore-keys` makes any older entry a starting
    # point when one of them changes.
    #
    # One entry per job, not one shared: the two `test.yml` jobs fetch
    # different sets (the musl build takes no GGUFs and a different Rust
    # toolchain), and on a shared key whichever job finished first
    # would save its smaller set for both — measured: the musl job's
    # 1.3 GB won, and the next test run fetched the ~2 GB it lacked.
    - name: Restore the bazel repository cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/bazel-repository-cache
        key: bazel-repo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('MODULE.bazel.lock', '**/pnpm-lock.yaml', '**/Cargo.lock', 'requirements.txt') }}
        restore-keys: |
          bazel-repo-${{ runner.os }}-${{ github.job }}-

    - name: Point bazel at the repository cache
      shell: bash
      run: |
        echo "common --repository_cache=${RUNNER_TEMP}/bazel-repository-cache" >> .bazelrc.user

    # Drop the key into the workspace `.bazelrc.user` (gitignored) —
    # `.bazelrc`'s `try-import` at the bottom picks it up, and
    # `build --config=buildbuddy` activates the remote cache + BES endpoint.
    # `test` inherits from `build`, so a single `build --config=...` line
    # covers both; adding a separate `test --config=...` line on top
    # double-expands the config and trips bazel's "config expanded more than
    # once" warning.
    - name: Configure BuildBuddy remote cache
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.buildbuddy-api-key }}
      run: |
        set -euo pipefail
        if [[ -n "${BUILDBUDDY_API_KEY:-}" ]]; then
            cat >> .bazelrc.user <<EOF
        common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
        build --config=buildbuddy
        EOF
            echo "BuildBuddy remote cache enabled for this job."
        else
            echo "BUILD_BUDDY_API_KEY not available — running without remote cache."
        fi

    - name: Show toolchain versions
      shell: bash
      run: |
        bazel version
        rustc --version || true
