# Attaches the artifacts a release.yml build job left to the tag's GitHub
# Release. The job that calls this holds `contents: write` and runs no
# build: docs/dev/release_steps.md §"Who holds what". Callers run
# `actions/checkout` first, as for any local composite action.
#
# Plain `gh`, not softprops/action-gh-release (an individually-owned
# action). The publish jobs race to create the tag's release;
# create-if-missing with `|| true` lets the losers fall through to the
# upload, which targets the same release either way.
name: Publish release assets
description: Download the matching artifacts and upload them to the tag's release.
inputs:
  pattern:
    description: Glob of the artifact names to publish.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ inputs.pattern }}
        merge-multiple: true
        path: ${{ runner.temp }}/release-assets

    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
        ASSETS: ${{ runner.temp }}/release-assets
      run: |
        set -euo pipefail
        ls -la "$ASSETS"
        if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release create "$REF_NAME" --verify-tag --notes "" || true
        fi
        # Once more on failure. The dmg is 175 MB, and a slow upload that
        # succeeded server-side can still come back as a client error; the
        # retry's `--clobber` replaces what landed (v0.34.0: HTTP 422
        # "ReleaseAsset.name already exists", with the asset on the release).
        for attempt in 1 2; do
            if gh release upload "$REF_NAME" --clobber "$ASSETS"/*; then
                break
            fi
            [[ "$attempt" == 2 ]] && exit 1
            sleep 30
        done
