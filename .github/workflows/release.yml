# Builds the `//datalib/backend:dist` bins on every supported
# host platform — plus fully-static `*-unknown-linux-musl` variants
# cross-libc-compiled on the same gnu runners — and attaches a
# per-triple tarball to a GitHub Release.
# The `runtime` job publishes the Node runtime the binaries run `qmd`
# and `latchkey` from as its own asset per platform
# (`runtime-<triple>.tar.gz`), which the binaries fetch on first use
# from the `runtime.manifest` the `build` job writes beside them — see
# docs/dev/runtime_fetch.md.
# The `macos-app` job additionally builds, signs, and notarizes the
# Datalib desktop app and attaches its dmg to the same release.
# Triggered by pushing a `v*` tag (e.g. `git tag v0.1.0 && git push
# origin v0.1.0`). Each tarball is published with a stable,
# un-versioned filename so the install script's
# `releases/latest/download/<name>` URL stays valid.
#
# Bazel action cache is served by BuildBuddy (see the "Configure
# BuildBuddy remote cache" step below); there's no GHA-side bazel
# cache and no main-branch warmup run. Tag pushes read the RELEASE
# group's cache — populated only by `test.yml` runs of commits on
# main, never by contributor laptops or PR runs — and write nothing.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create the GitHub Release
  packages: write  # needed for the docker-publish job to push to ghcr.io

# Don't cancel in progress — tag runs publish a release and must
# complete. (No main-branch races to serialize anymore now that the
# warmup runs are gone.)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Node runtime — the pinned Node plus the lockfile-pinned `qmd`
  # and `latchkey` trees, only this platform's CPU binding of
  # node-llama-cpp — as `runtime-<triple>.tar.gz`, one per host
  # platform. Its own job rather than a step of `build` so that the
  # musl legs (whose glibc host runs the same runtime as their gnu
  # sibling) can name an asset that already exists, with its sha256:
  # the `build` legs read the `.sha256` sidecars published here when
  # they write `runtime.manifest`. The tarball no longer carries the
  # runtime, which is what took v0.34.1's x86_64 tarball to 507 MB.
  #
  # `stage_runtime.sh` is a `bazel build` of four fetch-and-extract
  # targets and an rsync: a few minutes, most of it runner setup.
  runtime:
    name: runtime (${{ matrix.triple }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # `cuda`: also publish `runtime-<triple>-cuda.tar.gz`, the two
        # CUDA packages the resolver overlays where an NVIDIA driver is
        # present. Only Linux x86_64 has prebuilt CUDA bindings.
        include:
          - triple: aarch64-apple-darwin
            runs-on: macos-14  # Apple Silicon
            cuda: false
          - triple: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            cuda: true
          - triple: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            cuda: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same cache layering as the build job below; see its comment.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: true
          external-cache: false

      # See the build job's identically-named step for the full story:
      # the release group's key, and no uploads.
      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_RELEASE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${BUILDBUDDY_API_KEY:-}" ]]; then
              cat > .bazelrc.user <<EOF
          common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
          build --config=buildbuddy-release-readonly
          EOF
              echo "BuildBuddy release cache enabled for this job (read-only)."
          else
              echo "BUILD_BUDDY_RELEASE_API_KEY not available — running without remote cache."
          fi

      # The step is a script so //tools:stage_runtime_test runs the same
      # lines before a tag does (docs/dev/release_steps.md). The trees
      # come out of Bazel; the script prunes the bindings this platform
      # cannot use, proves the one it keeps loads, and tars the tree
      # with its contents at the top (`node/`, `qmd/`, `latchkey/`),
      # which is how the resolver unpacks it into
      # `~/.cache/datalib/runtime/<sha12>/`.
      - name: Stage the runtime
        id: stage
        env:
          TRIPLE: ${{ matrix.triple }}
          CUDA: ${{ matrix.cuda }}
        run: |
          set -euo pipefail
          files="$(scripts/release/stage_runtime_asset.sh "${TRIPLE}" "${CUDA}" | tr '\n' ' ')"
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      # Plain `gh`, create-if-missing, retry once: see the build job's
      # publish step.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          FILES: ${{ steps.stage.outputs.files }}
        run: |
          set -euo pipefail
          if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
              gh release create "$REF_NAME" --verify-tag --notes "" || true
          fi
          # shellcheck disable=SC2086
          for attempt in 1 2; do
              if gh release upload "$REF_NAME" --clobber $FILES; then
                  break
              fi
              [[ "$attempt" == 2 ]] && exit 1
              sleep 30
          done

  build:
    name: build (${{ matrix.triple }})
    runs-on: ${{ matrix.runs-on }}
    # After the runtime assets, whose sha256s the manifest below
    # carries. `!cancelled()` rather than the default `success()`: a
    # runtime leg that failed costs the tarballs that name it (their
    # manifest step fails), not every tarball.
    needs: runtime
    if: ${{ !cancelled() }}
    strategy:
      # One platform failing shouldn't cancel the others: a successful
      # build's tarball can still be published to the release while we
      # investigate the broken one.
      fail-fast: false
      matrix:
        # `bazel-config`: extra config appended to the dist build only.
        # The musl legs run on the same gnu runners as their gnu
        # siblings (same arch, cross-libc): `--config=musl-*` selects
        # the `//platforms:linux_*_musl` target platform, under which
        # the hermetic musl toolchains (see MODULE.bazel) produce
        # fully-static binaries that run on any Linux regardless of
        # libc. Build scripts and proc macros still run under the
        # host gnu toolchain, so the apt setup below is identical for
        # gnu and musl legs. The
        # version-consistency bazel test keeps running in the host
        # config on every leg (it's a shell test; no point
        # cross-compiling it) — on musl legs that costs one extra
        # ~30s analysis pass versus the gnu legs' shared-config
        # optimization described above the build steps.
        #
        # No x86_64-apple-darwin leg: nothing installs the full toolchain
        # there (scripts/install.sh only maps Darwin/arm64), and the
        # curl shims an Intel mac needs ship from
        # github.com/imbue-ai/latchkey-curl-shims.
        include:
          - triple: aarch64-apple-darwin
            runs-on: macos-14  # Apple Silicon
            bazel-config: ""
          - triple: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            bazel-config: ""
          - triple: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm  # GitHub-hosted native ARM Linux
            bazel-config: ""
          - triple: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
            bazel-config: "--config=musl-x86_64"
          - triple: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
            bazel-config: "--config=musl-aarch64"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `tools/workspace_status.sh` runs `git describe --tags`; the
          # default shallow clone has no tag history, so describe would
          # always fall back to a bare sha.
          fetch-depth: 0

      # BuildBuddy serves the remote action cache (the big win — skips
      # the multi-minute tokio / sqlx / doltlite compiles), but
      # BuildBuddy is action-cache-only: it doesn't cover the
      # bazelisk binary download, the `http_archive` tarball downloads
      # (rules_rust source, protobuf, etc.), or crate_universe's
      # external-repo resolution. Those are local-to-runner concerns.
      #
      # We keep `repository-cache` on so the crate_universe + rules
      # tarballs persist across runs (saves the ~1–3 min network-bound
      # fetch on a cold runner). The other three layers stay off:
      #   * disk-cache duplicates BuildBuddy's action cache and
      #     previously caused "Lost inputs no longer available
      #     remotely" failures against rules_rust's
      #     ExtractCargoTomlEnvVars actions (see test.yml header).
      #   * external-cache caches the materialized `external/`
      #     workspaces — small win and historically the flakiest layer.
      #   * bazelisk-cache saves a ~20s binary download, not worth
      #     a slot in the 10 GB-per-repo actions/cache quota.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: true
          external-cache: false

      # Install the Linux-only build dependencies the macOS runner gets
      # for free via Xcode CLT / Homebrew:
      #   cmake        — protobuf-src's build script shells out to it.
      #
      # Skipped on macOS; that runner already has cmake via Homebrew
      # (`brew install bazel cmake` per README).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake

      # protobuf-src needs cmake. Guarded so an image that gains or
      # loses it doesn't fail on "already installed".
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if ! command -v cmake >/dev/null 2>&1; then
              brew install cmake
          fi
          cmake --version | head -1

      # cargo-about writes licenses/rust-crates.md for the tarball (the
      # copyright notice of every crate linked into the binaries; see
      # scripts/third_party_notices.sh). A prebuilt release binary,
      # pinned by version and sha256, the way test.yml takes cargo-deny.
      # It needs the network to fetch crate sources the first time.
      - name: Install cargo-about (pinned)
        env:
          VERSION: 0.9.2
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
              Linux-x86_64)  triple=x86_64-unknown-linux-musl;  sha=9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af ;;
              Linux-aarch64) triple=aarch64-unknown-linux-musl; sha=af5169282fb6f84e13471493f405437e43ac517744c9ae12fbe2cdf0a6f0e5a8 ;;
              Darwin-arm64)  triple=aarch64-apple-darwin;       sha=ae72f0df0c399a1e96336f696fa55b1b28679fd725632eba8cf8e4568467cc3e ;;
              *) echo "no pinned cargo-about for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          name="cargo-about-${VERSION}-${triple}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "${name}.tar.gz" \
              "https://github.com/EmbarkStudios/cargo-about/releases/download/${VERSION}/${name}.tar.gz"
          echo "${sha}  ${name}.tar.gz" | shasum -a 256 -c -
          tar -xzf "${name}.tar.gz"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "${name}/cargo-about" "$HOME/.cargo/bin/cargo-about"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo-about" --version

      - name: Show toolchain versions
        run: |
          bazel version
          rustc --version || true

      # Wire the BuildBuddy remote cache for this build. `.bazelrc.user`
      # is gitignored so we can drop the API key into it from a repo
      # secret without polluting the source tree; the `try-import` at
      # the bottom of `.bazelrc` picks it up automatically.
      #
      # SUPPLY CHAIN: a release build replays action-cache hits into
      # what it ships, and bazel verifies none of them. So this is the
      # RELEASE group's key — a cache only `test.yml` runs of commits on
      # `main` write to, which is what makes a hit here "what main just
      # built" — and `--config=buildbuddy-release-readonly`, which
      # reads and never writes. Never the contributor key: every laptop and every
      # PR run writes that cache. Without the secret this leg runs cold
      # (~20 min), which is the right failure mode.
      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_RELEASE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${BUILDBUDDY_API_KEY:-}" ]]; then
              cat > .bazelrc.user <<EOF
          common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
          build --config=buildbuddy-release-readonly
          EOF
              echo "BuildBuddy release cache enabled for this job (read-only)."
          else
              echo "BUILD_BUDDY_RELEASE_API_KEY not available — running without remote cache."
          fi

      # Defense in depth against "tagged the wrong version" or "forgot
      # to bump Cargo.toml before tagging". The bazel test below already
      # asserts Cargo.toml == BUILD.bazel; this asserts tag == Cargo.toml.
      - name: Assert tag matches Cargo.toml version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME#v}"
          cargo_version="$(grep -E '^version = "[^"]+"$' datalib/backend/Cargo.toml | head -n1 | sed -E 's/^version = "([^"]+)"$/\1/')"
          if [[ "$tag_version" != "$cargo_version" ]]; then
              echo "Tag ${REF_NAME} disagrees with Cargo.toml workspace version ${cargo_version}." >&2
              echo "Bump datalib/backend/Cargo.toml [workspace.package].version to ${tag_version} before re-tagging." >&2
              exit 1
          fi

      # Both bazel invocations pass `-c opt` so they share the same
      # analysis cache. Mixing fastbuild + opt across consecutive
      # invocations would discard the analysis cache between them
      # ("WARNING: Build option --compilation_mode has changed,
      # discarding analysis cache"), costing ~30s of re-analysis on
      # the second invocation despite the action cache being warm.
      - name: Run version-consistency test
        run: bazel test //datalib/backend:version_consistency_test -c opt --build_metadata=ROLE=CI

      # `--config=release` turns on `--stamp` so the binary's
      # `--version` reports the real `git describe` output (e.g.
      # `v0.8.0`) instead of falling back to the literal `"dev"` that
      # an unstamped build produces. The post-build version assertion
      # below catches any future regression where stamping gets
      # silently disabled.
      # `:bin` is `:dist` under the public names, the one list of what
      # ships; the stage step below copies it whole.
      - name: Build dist bins
        run: bazel build //datalib/backend:bin -c opt --config=release --build_metadata=ROLE=CI ${{ matrix.bazel-config }}

      # musl legs only: refuse to publish anything that isn't fully
      # static. A regression here (say, a new crate sneaking in a
      # dynamic system-library link) would otherwise ship a "musl"
      # tarball that still needs host libraries — exactly what these
      # builds exist to avoid. Fully static means no PT_INTERP program
      # header (nothing asks for a dynamic loader) and no DT_NEEDED
      # entries (no shared-library dependencies); a static-pie binary
      # keeps a DYNAMIC section for self-relocation, so `readelf -d`
      # being non-empty is fine — only NEEDED lines are disqualifying.
      - name: Assert musl binaries are fully static
        if: contains(matrix.triple, 'musl')
        run: |
          set -euo pipefail
          for bin in \
              bazel-bin/datalib/backend/dag/datalib_dag_bin \
              bazel-bin/datalib/backend/datalib_step/datalib_step \
              bazel-bin/datalib/backend/http/datalib_http_bin \
              bazel-bin/datalib/backend/migrate_config/datalib_migrate_config_bin \
              bazel-bin/third-party/latchkey-curl-shims/curl-impersonate \
              bazel-bin/third-party/latchkey-curl-shims/latchkey-curl-router \
              bazel-bin/third-party/doltlite/doltlite; do
              echo "--- ${bin}"
              file -L "${bin}"
              if readelf -l "${bin}" | grep -q 'INTERP'; then
                  echo "ERROR: ${bin} requests a dynamic loader (PT_INTERP) — not fully static." >&2
                  exit 1
              fi
              if readelf -d "${bin}" 2>/dev/null | grep -q 'NEEDED'; then
                  echo "ERROR: ${bin} has DT_NEEDED shared-library deps — not fully static." >&2
                  readelf -d "${bin}" | grep 'NEEDED' >&2
                  exit 1
              fi
          done

      # Defense against the v0.7.0 / v0.8.0 incident where the dist
      # build went out unstamped and the version smoke test
      # printed `dev` in the published tarball. Run
      # the freshly-built binary on the host (matrix runner is the
      # same triple as the artifact) and require it to report exactly
      # the tag name. Anything else — `dev`, `unknown`, a `-dirty`
      # suffix, or a mismatched tag — fails the release before any
      # tarball is staged.
      - name: Assert release binary reports tag version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          actual="$(./bazel-bin/datalib/backend/dag/datalib_dag_bin --version)"
          echo "datalib-dag --version => ${actual}"
          expected="datalib-dag ${REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
              echo "ERROR: release binary version mismatch." >&2
              echo "  expected: ${expected}" >&2
              echo "  actual:   ${actual}" >&2
              echo "Likely cause: build-stamping was off for the dist build" >&2
              echo "(see .bazelrc 'build:release --stamp' and the" >&2
              echo "'--config=release' on the Build dist bins step above)." >&2
              exit 1
          fi

      # The full `bazel test //...` suite is gated by `test.yml` on
      # PRs / main; this workflow only re-checks `version_consistency_test`
      # + the dist build to keep tag-time wall clock low.

      # The step is a script so //tools:stage_tarball_test runs the same
      # lines before a tag does (docs/dev/release_steps.md): the binaries
      # `:bin` laid out above, the `latchkey` launcher, the commit, the
      # manifest of the runtime asset the `runtime` job published (read
      # back through `gh`, with its sha256 and size), and the third-party
      # notices — then the tarball and its sha256.
      - name: Stage tarball
        id: stage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          tarball="$(scripts/release/stage_tarball.sh "${REF_NAME}" "${TRIPLE}")"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=${tarball}.sha256" >> "$GITHUB_OUTPUT"

      # Plain `gh` instead of softprops/action-gh-release (an
      # individually-owned action; see the macos-app job's SUPPLY CHAIN
      # note). The matrix legs — and the macos-app job — race to create
      # the tag's release; create-if-missing with `|| true` lets the
      # losers fall through to the upload, which targets the same
      # release either way. `gh release upload` fails on a missing file,
      # preserving the old fail_on_unmatched_files behavior.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          TARBALL: ${{ steps.stage.outputs.tarball }}
          SHA256: ${{ steps.stage.outputs.sha256 }}
        run: |
          set -euo pipefail
          if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
              gh release create "$REF_NAME" --verify-tag --notes "" || true
          fi
          files=("$TARBALL" "$SHA256")
          # Once more on failure — see the macos-app job's publish step.
          for attempt in 1 2; do
              if gh release upload "$REF_NAME" --clobber "${files[@]}"; then
                  break
              fi
              [[ "$attempt" == 2 ]] && exit 1
              sleep 30
          done

  # Build, sign, and notarize the Datalib desktop app (Tauri) and
  # attach the dmg to the GitHub Release. Deliberately NOT gated on the
  # `build` matrix job: the tauri crate is a standalone cargo workspace
  # (not owned by bazel — see datalib/tauri/README.md), so a dist
  # failure shouldn't block shipping the app, and vice versa.
  #
  # The signing certs + notarization key live under
  # restricted/datalib-release/* in Vault, read via the
  # `datalib_release_gh` role (vault repo: terraform/github_actions.tf).
  # The role binds on this repository plus a glob on the OIDC ref claim
  # (refs/tags/v*), so only tag-triggered runs can mint it — branch and
  # PR workflows are denied, and no GitHub Environment setup is needed.
  # The gate is therefore "who can push a v* tag"; see the vault repo's
  # module comment for the residual exposure and how to tighten further.
  #
  # All signing/notarization mechanics live in
  # datalib/tauri/build-signed-app.sh, which is the same script you
  # run locally — CI only differs in where the secrets come from.
  #
  # SUPPLY CHAIN: this job holds the org's Developer ID signing key, and
  # use-vault-secrets exports it via $GITHUB_ENV — meaning every later
  # step can read it. So the job uses no individually-owned third-party
  # actions (only GitHub/pnpm/bazel-contrib org actions + our own), and
  # every step after the secrets export is plain `run:` shell — no
  # third-party action code executes with the certs in scope. Keep it
  # that way: rustup replaces dtolnay/rust-toolchain, `gh release`
  # replaces softprops/action-gh-release, and there's deliberately no
  # cargo cache (Swatinem/rust-cache) — a cold compile only costs a few
  # minutes on a rare tag build and doesn't eat the 10 GB cache quota.
  #
  # The same rule for what the build FETCHES: everything that talks to
  # a registry or a cache — the pinned Tauri CLI from pnpm-lock.yaml,
  # the cargo crates, the Bazel actions the beforeBuildCommand and the
  # runtime staging run — is fetched or built in the steps BEFORE the
  # secrets export, so the signing step itself is a cache hit that
  # downloads nothing. The export is the last setup step, on purpose.
  macos-app:
    name: macos-app (signed + notarized)
    runs-on: macos-14  # Apple Silicon
    timeout-minutes: 90
    permissions:
      id-token: write  # OIDC token for Vault (signing certs + notary key)
      contents: write  # attach the dmg to the GitHub Release
    env:
      VAULT_AUTH_ROLE: datalib_release_gh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tauri beforeBuildCommand bazel-builds the bundled
      # datalib-http / datalib-dag / datalib-step binaries; same cache layering
      # rationale as the build job above (BuildBuddy serves actions,
      # repository-cache keeps the crate_universe / rules tarballs).
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: true
          external-cache: false

      # See the build job's identically-named step for the full story:
      # the release group's key, and no uploads.
      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_RELEASE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${BUILDBUDDY_API_KEY:-}" ]]; then
              cat > .bazelrc.user <<EOF
          common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
          build --config=buildbuddy-release-readonly
          EOF
              echo "BuildBuddy release cache enabled for this job (read-only)."
          else
              echo "BUILD_BUDDY_RELEASE_API_KEY not available — running without remote cache."
          fi

      # The tauri crate is built by cargo (not bazel's hermetic rust
      # toolchain), so make sure a current stable toolchain is default
      # instead of trusting whatever the runner image ships (Cargo.toml
      # says rust-version = "1.83"). Plain rustup, no third-party action;
      # the runner image carries rustup, with the official installer as
      # fallback in case a future image drops it.
      - name: Install Rust (1.98.0, the version Bazel builds with)
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal --default-toolchain none
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0
          rustc --version

      # scripts/ensure_pnpm.sh bootstraps pnpm via corepack, but corepack
      # is being removed from newer Node distributions — install the
      # pinned pnpm (packageManager in datalib/ui/package.json)
      # directly so the runner image's Node choices can't break us.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: datalib/ui/package.json

      # The Tauri CLI at the version pnpm-lock.yaml names, from the
      # tarballs it names, install scripts off. build-signed-app.sh runs
      # the same install (a no-op here) and then `pnpm exec tauri`, never
      # `pnpm dlx`, which resolved whatever 2.x was current at signing
      # time.
      - name: Install the pinned Tauri CLI
        run: |
          set -euo pipefail
          cd datalib/tauri
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tauri --version

      # stage-runtime.sh assembles the .app's Resources/licenses/ with
      # scripts/third_party_notices.sh, which runs cargo-about. Same
      # pinned binary as the build job's step.
      - name: Install cargo-about (pinned)
        env:
          VERSION: 0.9.2
          SHA256: ae72f0df0c399a1e96336f696fa55b1b28679fd725632eba8cf8e4568467cc3e
        run: |
          set -euo pipefail
          name="cargo-about-${VERSION}-aarch64-apple-darwin"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "${name}.tar.gz" \
              "https://github.com/EmbarkStudios/cargo-about/releases/download/${VERSION}/${name}.tar.gz"
          echo "${SHA256}  ${name}.tar.gz" | shasum -a 256 -c -
          tar -xzf "${name}.tar.gz"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "${name}/cargo-about" "$HOME/.cargo/bin/cargo-about"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo-about" --version

      # Every fetch the build will make, made now: the shell's crates
      # and the backend's (`cargo fetch` against the committed
      # Cargo.locks — cargo-about reads license files out of the
      # backend's crate sources), and the Bazel targets the
      # beforeBuildCommand copies out and stage-runtime.sh rsyncs — so
      # the signing step's bazel invocations are analysis + cache hits
      # with no network, and no crate lands after the certs are in
      # scope. The target list mirrors tauri.conf.json's
      # beforeBuildCommand plus those in scripts/stage_runtime.sh and
      # scripts/third_party_notices.sh.
      - name: Prebuild the bundled binaries and runtime
        run: |
          set -euo pipefail
          (cd datalib/tauri && cargo fetch --locked)
          (cd datalib/backend && cargo fetch --locked)
          bazel build --build_metadata=ROLE=CI \
              //datalib/backend/http:datalib_http_bin \
              //datalib/backend/dag:datalib_dag_bin \
              //datalib/backend/datalib_step:datalib_step \
              //datalib/backend/applets:datalib_applet \
              //datalib/backend/migrate_config:datalib_migrate_config_bin \
              //third-party/latchkey-curl-shims \
              //datalib/tauri:bundled_node \
              //datalib/ui:dist \
              //third-party:bundled_licenses \
              //third-party/qmd/runtime:qmd_tree \
              //third-party/latchkey/runtime:latchkey_tree

      - name: Export signing credentials
        # CERTS_TAR_GZ is the base64 certs tarball; APPLE_API_KEY_ID /
        # APPLE_API_ISSUER identify the notarization key inside it. The
        # action leaves all three in $GITHUB_ENV for the build step,
        # where build-signed-app.sh picks them up. LAST of the setup
        # steps — see the SUPPLY CHAIN note on the job.
        uses: imbue-ai/use-vault-secrets@38aac6d2f537009c6e58849f8fdd34ea16084103 # main, 2026-09-17
        with:
          role: ${{ env.VAULT_AUTH_ROLE }}
          secrets: |
            restricted/datalib-release/CERTS_TAR_GZ
            restricted/datalib-release/APPLE_API_KEY_ID
            restricted/datalib-release/APPLE_API_ISSUER

      - name: Build, sign, notarize
        # DATALIB_APP_VERSION stamps the tag's version into the
        # bundle (tauri.conf.json's checked-in version is not kept in
        # sync with the backend workspace version the tag asserts on).
        # The tag goes through env, never ${{ }}-interpolated into run:
        # (see verify-version in sculptor's build-desktop.yml for why).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export DATALIB_APP_VERSION="${REF_NAME#v}"
          ./datalib/tauri/build-signed-app.sh

      - name: Stage dmg
        env:
          REF_NAME: ${{ github.ref_name }}
        # Same stable, un-versioned filename convention as the tarballs
        # so `releases/latest/download/<name>` URLs stay valid.
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          dmg="datalib/tauri/target/release/bundle/dmg/Datalib_${version}_aarch64.dmg"
          out="Datalib-aarch64-apple-darwin.dmg"
          cp "$dmg" "$out"
          shasum -a 256 "$out" > "$out.sha256"

      # Plain `gh` instead of softprops/action-gh-release: no third-party
      # action code runs after the signing secrets land in $GITHUB_ENV
      # (see the SUPPLY CHAIN note in the job comment). Create-if-missing
      # tolerates the race with the build matrix's publish step — if the
      # create loses the race, the upload still targets the same release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
              gh release create "$REF_NAME" --verify-tag --notes "" || true
          fi
          # Once more on failure. The dmg is 175 MB, and a slow upload
          # that succeeded server-side can still come back as a client
          # error; the retry's `--clobber` replaces what landed
          # (v0.34.0: HTTP 422 "ReleaseAsset.name already exists", with
          # the asset sitting on the release).
          for attempt in 1 2; do
              if gh release upload "$REF_NAME" --clobber \
                  Datalib-aarch64-apple-darwin.dmg \
                  Datalib-aarch64-apple-darwin.dmg.sha256; then
                  break
              fi
              [[ "$attempt" == 2 ]] && exit 1
              sleep 30
          done

  # Build and push the multi-arch runtime image to ghcr.io. Runs after
  # the matrix `build` job has uploaded both Linux tarballs to the
  # GitHub Release so we can fetch them by their stable
  # `releases/download/<tag>/...` URLs from inside the docker build
  # context.
  #
  # This image is the user-facing way to run datalib on Linux
  # without trusting the bare binaries to your host shell — see
  # docs/dev/docker.md for the bind-mount + security model. The build is
  # NOT gated on the macOS matrix entry: a darwin-only build failure
  # shouldn't block publishing the Linux image.
  docker-publish:
    name: docker-publish (ghcr.io)
    needs: [runtime, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHA `ubuntu-latest` ships with ~14 GB free disk, which doesn't
      # fit a buildx run of our ~2.7 GB image × two architectures plus
      # the `type=gha,mode=max` cache export. v0.5.0 / v0.5.1 both
      # filled the runner's disk before docker-publish could finish.
      # Deleting the preinstalled Android SDK, .NET runtimes, Haskell
      # GHC, large apt packages we don't use, and swap reclaims ~30 GB —
      # from ~14 GB to ~44 GB free, comfortable headroom for the build.
      # PATH-installed tools (gh, docker, node, etc.) that the rest of
      # this job uses are left alone.
      #
      # Inlined shell doing what jlumbroso/free-disk-space@main used to
      # do here (an individually-owned action pinned to a mutable
      # branch; see the macos-app job's SUPPLY CHAIN note). Best-effort
      # `|| true` throughout: runner images shed packages over time, and
      # a missing one shouldn't fail a release — the docker build's own
      # disk usage is the real check.
      - name: Free up runner disk
        run: |
          set -euo pipefail
          echo "Free disk before:" && df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
              /opt/ghc /usr/local/.ghcup || true
          sudo apt-get remove -y --purge '^aspnetcore-.*' '^dotnet-.*' \
              '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli \
              google-chrome-stable firefox powershell mono-devel \
              libgl1-mesa-dri >/dev/null || true
          sudo apt-get autoremove -y >/dev/null || true
          sudo apt-get clean || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          echo "Free disk after:" && df -h /

      # Pull the just-published tarballs from the GitHub Release into
      # the build context at the layout datalib/docker/Dockerfile
      # expects (`dist/<arch>/<tarball>`), via `gh release download`
      # with the workflow's GITHUB_TOKEN: the binaries, and the CPU
      # runtime asset with its `.sha256` sidecar, which the Dockerfile
      # checks before unpacking it beside the binaries — an image is a
      # bundle, so it does not fetch at run time. The demo library's
      # inputs come from the checkout (datalib/docker/stage_demo.sh).
      - name: Stage tarballs and the demo into docker build context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ctx/dist/amd64 ctx/dist/arm64
          cp datalib/docker/Dockerfile ctx/Dockerfile
          cp datalib/docker/entrypoint.sh ctx/entrypoint.sh
          datalib/docker/stage_demo.sh ctx
          for pattern in 'datalib-x86_64-unknown-linux-gnu.tar.gz' \
                         'runtime-x86_64-unknown-linux-gnu.tar.gz*'; do
              gh release download "${REF_NAME}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${pattern}" \
                  --clobber --dir ctx/dist/amd64
          done
          for pattern in 'datalib-aarch64-unknown-linux-gnu.tar.gz' \
                         'runtime-aarch64-unknown-linux-gnu.tar.gz*'; do
              gh release download "${REF_NAME}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${pattern}" \
                  --clobber --dir ctx/dist/arm64
          done
          ls -la ctx/dist/amd64 ctx/dist/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Pin a recent BuildKit explicitly. The `buildx-stable-1` tag that
      # `setup-buildx-action` defaults to was on a BuildKit old enough to
      # still use the deprecated GHA Cache Service v1 API — which GitHub
      # turned off on 2025-06-30 — so `--cache-to type=gha` silently
      # no-op'd: tag pushes never imported a manifest and never exported
      # one (see runs 27184867988 / 27254340228 — no "importing cache
      # manifest" or "exporting cache layers" lines, and every layer
      # including the 2.25 GB `qmd pull` rebuilt from scratch). BuildKit
      # ≥ 0.18 speaks the v2 API; `moby/buildkit:latest` keeps us on
      # whatever's current.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the multi-arch image in one go. We previously had
      # a separate `--load` amd64 build that ran a latchkey
      # services-register / auth-set / auth-list roundtrip against the
      # loaded image before this step pushed; that doubled cold-cache
      # wall time (the amd64 build was effectively done twice — once
      # for smoke, once for publish, with the latter cache-hitting via
      # GHA but still re-exporting layers) and the only thing it
      # uniquely caught was a regression in the entrypoint's
      # `LATCHKEY_ENCRYPTION_KEY` bootstrap. The other smoke checks
      # (`datalib-dag --version`, `datalib-http --help`)
      # duplicate `qmd --version` + binary-presence checks the
      # Dockerfile already runs inline. If the latchkey bootstrap ever
      # regresses, ghcr.io will briefly have a broken `:latest` until
      # someone notices — acceptable while the user base is small;
      # revisit if we ever get pulls from real users.
      #
      # `type=gha` cache means consecutive tag pushes within ~7 days
      # cache-hit both arches (the eviction window) — only the first
      # tag in a long while pays a full cold build. `mode=max` writes
      # ALL intermediate layers (not just the final image) so the
      # 2.25 GB qmd model layer is the dominant cache hit.
      - name: Build and push multi-arch image
        env:
          REF_NAME: ${{ github.ref_name }}
          # Plain-text progress so cache-import/export lines are
          # actually readable in the log — the TTY-style default hid
          # whether `type=gha` was working at all in earlier runs.
          BUILDKIT_PROGRESS: plain
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          # ghcr.io image refs must be lowercase; GITHUB_REPOSITORY
          # preserves case from the org/repo slug. `${var,,}` lowercases.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # `scope=docker-publish` makes the cache persist across
          # tag pushes. Without an explicit scope, type=gha defaults
          # to the workflow ref, so a tag push (refs/tags/v0.6.x)
          # gets a per-tag scope — i.e. every release starts cold and
          # re-runs the 2.25 GB `qmd pull` plus all the apt / node /
          # latchkey / doltlite-CLI layers from scratch. Mirrors the
          # devcontainer block below (which already does this right).
          #
          # `version=2` pins the GHA Cache Service v2 API. v1 was
          # turned off on 2025-06-30; without this, older BuildKit
          # builds silently no-op the cache (no import, no export).
          docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${image}:${version}" \
              --tag "${image}:latest" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --cache-from type=gha,scope=docker-publish,version=2 \
              --cache-to type=gha,mode=max,scope=docker-publish,version=2 \
              --push \
              ctx

          # The same image without qmd's 2.2 GB of GGUFs, for the
          # devcontainer below to build on. Only CI pulls the
          # devcontainer image, and CI's one consumer of those models
          # (`//tests/fixtures:ingested_tng_qmd`) is a remote cache hit
          # on almost every run, so it was downloading them for nothing:
          # measured 6.45 GB -> 3.78 GB, cold pull 80s -> 37s, and the
          # whole CI job 218s -> 133s.
          #
          # Deliberately NOT tagged `:latest` and deliberately amd64
          # only: this is a build input for the devcontainer, not a
          # product image, and the only thing that consumes it runs on
          # x86_64 runners. Every layer up to the qmd step is identical
          # to the build above and comes from the same `type=gha` cache,
          # so this costs one extra qmd/npm layer, not a second image.
          #
          # Reads the full build's cache (every layer up to the qmd step
          # is identical) but writes to its OWN scope. BuildKit keeps one
          # mutable index per scope, so exporting both builds to
          # `docker-publish` would leave the amd64-only slim index as the
          # survivor and cost the multi-arch build its cache on the next
          # tag — the exact cold-start this job's cache config exists to
          # avoid.
          docker buildx build \
              --platform linux/amd64 \
              --build-arg QMD_PREFETCH_MODELS=false \
              --tag "${image}:${version}-slim" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --cache-from type=gha,scope=docker-publish,version=2 \
              --cache-from type=gha,scope=docker-publish-slim,version=2 \
              --cache-to type=gha,mode=max,scope=docker-publish-slim,version=2 \
              --push \
              ctx

      # Run the user-facing Docker walkthrough (docs/user/docker.md)
      # against the image just pushed: pull it back, serve the baked
      # demo, ingest a mounted mbox, query both. The pull is the cost
      # (~80s cold); the checks themselves take a couple of minutes,
      # most of it the semantic index build. A failure here does not
      # un-push the tag — it makes a broken `:latest` visible instead
      # of leaving it for a user to find.
      - name: Check docs/user/docker.md against the pushed image
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          DATALIB_DOCKER_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${version}" \
              datalib/docker/doc_test.sh
