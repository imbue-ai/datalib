# Builds and stages what CUDA adds to a release, as the release's `cuda`
# job does (scripts/release/build_cuda.sh): llama.cpp's CUDA backend,
# `libggml-cuda.so`, checked to resolve against the `datalib-step` it loads
# into, and the cuBLAS the `-cuda` image carries, checked to leave the
# module wanting nothing but NVIDIA's driver. Plus `gpu_check`, to run the
# staged module on a rented GPU by hand (docs/dev/plans/embed_on_modal.md):
# nothing here has a GPU. Then the `-cuda` image from those, over the latest
# release's binaries: a tag is otherwise the first to build it. Kept out of `test.yml` because the toolkit is a
# ~1 GB fetch that no other target needs.
name: cuda

on:
  pull_request:
    paths:
      - .bazelrc
      - .github/actions/free-runner-disk/**
      - .github/workflows/cuda.yml
      - MODULE.bazel
      - datalib/docker/Dockerfile
      - scripts/release/build_cuda.sh
      - scripts/release/cuda_layer_digests.py
      - scripts/release/stage_cuda.sh
      - scripts/release/stage_docker_context.sh
      - datalib/backend/embedder/**
      - third-party/llama_cpp/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build libggml-cuda.so
    # The release's gnu legs' runner (release_steps.md §"The Linux floor"):
    # its gcc 13 is one CUDA 12.9's nvcc accepts, and its glibc is the floor
    # the module has to load on.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As the release's `cuda` job does, so the build is checked on a
      # runner whose SDKs are gone.
      - uses: ./.github/actions/free-runner-disk

      # The contributor cache, as test.yml's PR runs use it
      # (.github/actions/prepare-bazel, whose disk and output-base steps
      # are for the devcontainer and do not apply on a bare runner).
      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_API_KEY }}
        run: |
          if [[ -n "${BUILDBUDDY_API_KEY:-}" ]]; then
            printf 'common --remote_header=x-buildbuddy-api-key=%s\nbuild --config=buildbuddy\n' \
              "$BUILDBUDDY_API_KEY" >> .bazelrc.user
          fi

      # The shipped binaries' build mode (release.yml's gnu legs), unstamped.
      - name: build and stage
        run: |
          mkdir -p "$RUNNER_TEMP/cuda" && cd "$RUNNER_TEMP/cuda"
          "$GITHUB_WORKSPACE/scripts/release/build_cuda.sh" -c opt --config=release --nostamp
          tar -xzf ggml-cuda-x86_64-unknown-linux-gnu.tar.gz
          readelf -d lib/libggml-cuda.so | grep -E 'NEEDED|RUNPATH|RPATH'

      # gpu_check, beside lib/ as it looks for the module there.
      - name: build gpu_check
        run: |
          flags=(-c opt --config=release --config=cuda --nostamp)
          bazelisk build "${flags[@]}" //datalib/backend/embedder:gpu_check
          bazelisk cquery "${flags[@]}" --output=files //datalib/backend/embedder:gpu_check 2>/dev/null \
            | grep -vE '\.(rustfmt|clippy)\.ok$' | xargs -I{} cp {} "$RUNNER_TEMP/cuda/gpu_check"
          cd "$RUNNER_TEMP/cuda"
          nm -D --undefined-only lib/libggml-cuda.so | awk '$1 == "U" {print $2}' \
            | grep -v '@' | grep -vE '^(cublas|cu[A-Z])' | sort -u > from_step.txt || true
          nm -D --defined-only gpu_check | awk '{print $3}' | sort -u > exported.txt
          if comm -23 from_step.txt exported.txt | grep .; then
            echo "::error::libggml-cuda.so needs symbols gpu_check does not export"
            exit 1
          fi

      # What the module's bytes are: each ELF section, the GPU code per GPU
      # model (uncompressed, so it sums past the file), and the file
      # stripped of host symbols.
      - name: measure
        run: |
          so="$RUNNER_TEMP/cuda/lib/libggml-cuda.so"
          size -A -d "$so" | sort -k2 -n -r | head -n 12
          bazelisk build --config=cuda @cuda_cuobjdump//:bin/cuobjdump
          cuobjdump="$(bazelisk info output_base)/external/+http_archive+cuda_cuobjdump/bin/cuobjdump"
          mkdir -p "$RUNNER_TEMP/elf" && cd "$RUNNER_TEMP/elf"
          "$cuobjdump" -xelf all "$so" > /dev/null
          "$cuobjdump" -xptx all "$so" > /dev/null || true
          for f in *; do
            arch=$(printf '%s\n' "$f" | grep -oE 'sm_[0-9]+|compute_[0-9]+' | head -n 1 || true)
            echo "${arch:-unknown} $(wc -c < "$f")"
          done | awk '{n[$1]++; b[$1]+=$2} END {for (a in b) printf "%-12s %5d files %8.1f MB\n", a, n[a], b[a]/1e6}' | sort
          strip --strip-unneeded -o "$RUNNER_TEMP/stripped.so" "$so"
          ls -la "$so" "$RUNNER_TEMP/stripped.so"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda-linux-x86_64
          path: |
            ${{ runner.temp }}/cuda/ggml-cuda-x86_64-unknown-linux-gnu.tar.gz*
            ${{ runner.temp }}/cuda/cuda-libs-x86_64-unknown-linux-gnu.tar.gz*
            ${{ runner.temp }}/cuda/gpu_check
          if-no-files-found: error
          retention-days: 7

  # The `-cuda` image, up to its demo (`--target app`), from this run's CUDA
  # assets and the latest release's binaries, which a PR builds no tarball
  # of and which cannot run this tree's demo config: the CUDA stage's layers
  # and the image's own check that the module lacks nothing but the driver.
  # Built twice from a cold cache, the second time over another Ubuntu, and
  # pushed to a registry on the runner: the two CUDA layers must have the
  # same digests in both, as a pull of the next release will compare them
  # (docs/dev/docker.md § "The CUDA variant").
  image:
    name: build the -cuda image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/free-runner-disk

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cuda-linux-x86_64
          path: ${{ runner.temp }}/cuda

      - name: Stage the build context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" \
              --pattern datalib-x86_64-unknown-linux-gnu.tar.gz \
              --pattern 'runtime-x86_64-unknown-linux-gnu.tar.gz*'
          scripts/release/stage_docker_context.sh ctx amd64 x86_64-unknown-linux-gnu \
              "$RUNNER_TEMP/release" "$RUNNER_TEMP/cuda"

      - name: Start a registry
        run: |
          docker run --detach --name registry --publish 127.0.0.1:5000:5000 \
              mirror.gcr.io/library/registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c

      # As release.yml's docker-image job sets it up, on the runner's network
      # so that it can push to the registry above.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
            network=host
          cache-binary: false
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
            [registry."localhost:5000"]
              http = true

      # Each from an empty cache, as each release's runner starts.
      - name: Build it twice and push both
        env:
          BUILDKIT_PROGRESS: plain
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --build-arg CUDA=12 \
              --target app --tag localhost:5000/datalib:cuda-first --push ctx
          docker buildx prune --all --force
          docker buildx build --platform linux/amd64 --build-arg CUDA=12 \
              --build-context ubuntu:26.04=docker-image://mirror.gcr.io/library/ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5 \
              --target app --tag localhost:5000/datalib:cuda-second --push ctx

      - name: The CUDA layers have the same digests in both
        run: |
          set -euo pipefail
          for tag in cuda-first cuda-second; do
            python3 scripts/release/cuda_layer_digests.py localhost:5000 datalib "$tag" > "$RUNNER_TEMP/$tag.txt"
            echo "$tag:" && cat "$RUNNER_TEMP/$tag.txt"
          done
          if ! diff "$RUNNER_TEMP/cuda-first.txt" "$RUNNER_TEMP/cuda-second.txt"; then
            echo "::error::the CUDA layers' digests moved between two builds"
            exit 1
          fi

      - name: Look inside it
        run: |
          docker pull localhost:5000/datalib:cuda-first
          docker run --rm --entrypoint sh localhost:5000/datalib:cuda-first -c \
              'ls -la /opt/datalib/lib /usr/local/lib/datalib-cuda/cublas; ldd /opt/datalib/lib/libggml-cuda.so | grep -E "cublas|cuda"'
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' localhost:5000/datalib:cuda-first | cut -c1-160
