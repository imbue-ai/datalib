# Runs `bazel test //...` inside the published devcontainer image with
# BuildBuddy as the action cache. Gates merges on PRs and warms the
# BuildBuddy cache on main pushes.
#
# Why a separate workflow (and not a step in `release.yml`): an earlier
# `bazel test //...` step lived in `release.yml` and was removed because
# the `bazel-contrib/setup-bazel` GHA disk cache kept tripping "Lost
# inputs no longer available remotely" against rules_rust's
# ExtractCargoTomlEnvVars actions — every release run rebuilt 1500+
# actions and the broken cache never healed. Routing the cache through
# BuildBuddy instead sidesteps the GHA-cache-shape mismatch entirely.
#
# Why the devcontainer image: `bazel test //...` needs the full Bazel
# build toolchain — clang, cmake, llvm, libclang-dev, lld, perl,
# pkg-config, libssl-dev — that the prod image deliberately omits. The
# devcontainer image carries that toolchain on top of the prod image's
# qmd model cache, latchkey, doltlite CLI, etc. Re-installing it via apt
# at the start of each job (the pattern `release.yml`'s build matrix
# uses) would add ~3 min of apt + cold qmd model download to every run;
# pulling the pre-built image is closer to ~30s.
#
# Bootstrap: the devcontainer image must be published to GHCR before
# this workflow can succeed. The `devcontainer-publish` job in
# `release.yml` publishes it on every `v*` tag push. On a fresh repo
# with no devcontainer image yet, push a tag first; the first PR after
# can then run this workflow.
name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # to pull the devcontainer image from GHCR

# Cancel superseded PR runs — pushing a fixup commit shouldn't keep the
# previous run burning a runner. main pushes don't cancel so the
# BuildBuddy cache fill from every merged commit is preserved.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs, deliberately. `bazel-test` and `musl-dist` share nothing at
# execution time — different configurations, disjoint action sets — so
# running them in sequence just parked the musl build (~80s, of which
# ~45s is a second analysis phase) at the end of the critical path.
# Measured on a warm cache: 483s in one job -> 398s as two (n=4).
#
# The costs are a second container pull and a second analysis phase, and
# both are compute rather than wall clock: the jobs run concurrently on
# separate runners. Neither is a `needs:` of the other, and both are
# merge gates, so a musl regression doesn't mask a test failure.
#
# Their common setup — the BuildBuddy key and LIBCLANG_PATH — lives in
# `.github/actions/prepare-bazel` so the two jobs cannot drift apart.
#
# --------------------------------------------------------------------
# Both jobs pass `--nostamp --jobs=16`. Why:
#
# `--nostamp` turns OFF the `--stamp` that `--config=release` turns on
# (later flags win). Stamping is worth nothing to CI and costs a lot, in
# two separate ways:
#
#   1. rules_rust defaults `rust_binary`'s `stamp` attribute to -1
#      ("defer to --stamp"), and when stamping is on it adds
#      `stable-status.txt` to EVERY rust_binary's Rustc action inputs —
#      unconditionally, whether or not the target references a
#      {STABLE_*} placeholder (rules_rust 0.70.0,
#      rust/private/rustc.bzl:849). `tools/workspace_status.sh` emits
#      STABLE_GIT_HASH, so every commit relinked every binary in the
#      repo: measured at 20 Rustc actions plus the two fixture genrules
#      they feed, ~2.5 min of a 4-vCPU runner, on a run where NOTHING
#      else had changed.
#   2. `--stamp` is part of the build configuration, so the subgraph
#      reachable from a stamped binary is configured a second time under
#      a `k8-opt-ST-<hash>` output tree. Measured from
#      `--execution_log_json_file`: 786 extra spawns, 4133 vs 3350
#      total, purely duplicate work.
#
# Nothing is lost. The stamped variants can never be cache hits anyway —
# their key contains the commit SHA, which is new by definition — so
# `release.yml` rebuilds them at tag time whether or not this workflow
# also built them, and it still stamps everything it publishes. The
# unstamped rlibs that dominate the graph are shared either way
# (`rust_library` defaults to `stamp = 0` and ignores the flag).
# `-c opt --config=release` stays, so the rest of the cache-warming
# rationale below still holds.
#
# `--jobs=16` is 4x this runner's vCPU count, which is what `--jobs`
# defaults to. A remote cache HIT does not take a CPU token from bazel's
# ResourceManager, so on a warm run the ~3400 hits are gated purely by
# the --jobs thread count while they wait on the network: the execution
# log shows 508 spawn-seconds of cache-hit materialization finishing in
# ~120s of wall clock, i.e. 4 at a time. Local execution is still
# CPU/RAM-gated by the ResourceManager, so this does not oversubscribe
# compile-bound runs — verified on a run with a real source change (226
# locally executed actions): 1183s with --jobs=16 vs 1209s without, no
# memory pressure.
jobs:
  bazel-test:
    name: bazel test //...
    runs-on: ubuntu-latest

    # GitHub Actions defaults `run:` steps to `sh` (dash) when the job
    # runs inside a container, which rejects `set -o pipefail` and `[[ ]]`.
    # Force bash so the bash-isms in the steps below work.
    defaults:
      run:
        shell: bash

    # Run the job inside the published devcontainer image. We
    # deliberately track `:latest` rather than pinning a version: the
    # image is only republished on `v*` tag pushes (by
    # `release.yml`'s `devcontainer-publish` job), so `:latest` only
    # moves on deliberate release events, not opportunistically. In
    # exchange, contributors don't have to remember to bump a pin in
    # this file after every release — `.devcontainer/Dockerfile`'s
    # `PROD_IMAGE_TAG` is the only remaining manual pin (and it
    # governs reproducible LOCAL devcontainer builds, which is a
    # property worth keeping).
    #
    # Risk: a broken devcontainer image published at `:latest` taints
    # every subsequent CI run until the next release. Acceptable
    # because release tagging is a deliberate human action; bad images
    # surface immediately on the next PR.
    container:
      image: ghcr.io/imbue-ai/datalib_devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          # `tools/workspace_status.sh` runs `git describe --tags`; the
          # default shallow clone has no tag history, so describe would
          # always fall back to a bare sha. We pass `--nostamp` now (see
          # the block above), but `release.yml` does stamp, and keeping
          # the two checkouts identical means a tag-time build sees the
          # same repo state this one tested.
          fetch-depth: 0

      - id: env
        uses: ./.github/actions/prepare-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILD_BUDDY_API_KEY }}

      # `-c opt --config=release` mirrors the build mode `release.yml`'s
      # dist build uses, so the BuildBuddy action cache populated here
      # on every PR / main push warms exactly the entries tag-time
      # release builds will hit (instead of fastbuild entries the
      # release path's opt-mode actions can't use). Side benefit:
      # tests run against the same binaries we ship, which catches
      # opt-mode-only behaviors before release.
      #
      # `--build_metadata=ROLE=CI` tags the invocation in the BuildBuddy
      # UI so CI runs are filterable from contributor invocations.
      # Matches the convention used by `release.yml`'s build + test
      # steps.
      #
      # Repo-hygiene lints that cannot be Bazel tests: both have to
      # enumerate every file in the repo via git, which is exactly what a
      # sandbox denies. Kept as a plain step so `bazel test //...` stays
      # fully hermetic. Runs before the build because it is ~instant and
      # its failures are cheap to fix.
      # ── the qmd embedding models, for `//datalib/ui:e2e_test` ────────
      #
      # Two consumers need these GGUFs and neither can download them
      # itself: `//tests/fixtures:ingested_tng_qmd` (a genrule, sandboxed)
      # and `tests/fixtures/materialize_tng_root.sh`, which the e2e suite
      # runs and which `exit 3`s on an empty cache on purpose — a silent
      # multi-GB HuggingFace download masquerading as a hang is exactly
      # what that check exists to prevent.
      #
      # The image does NOT carry them. `release.yml` publishes the
      # devcontainer against `datalib:<ver>-slim`, i.e.
      # `QMD_PREFETCH_MODELS=false`, which creates
      # `/root/.cache/qmd/models` EMPTY. So CI has to fill it, and this
      # is where.
      #
      # `/root`, not `$HOME`: GitHub forces `HOME=/github/home` for
      # container steps, while every other qmd accommodation in this job
      # (the sandbox mount pair, `CLAUDE_MIRROR_HOST_HOME`) already names
      # `/root`. Keeping one location keeps one copy — pointing them at
      # two homes would cache 2.2 GB twice.
      #
      # Keyed on the repo's qmd pin, since that is what decides which
      # GGUFs qmd wants. Note the image's globally-installed `qmd` is
      # whatever the last release built with; if the repo pin moves ahead
      # of it and the model set changes, the materializer fails by name
      # ("missing qmd models in ...") rather than mysteriously — which is
      # the failure mode we want.
      #
      # Watch the disk if this job starts failing on space: 2.2 GB is a
      # real increment on top of the image and bazel's outputs, and this
      # job has no cleanup step. `release.yml`'s "Free up runner disk"
      # is the ready-made fix to copy if it comes to that.
      - name: Cache the qmd models
        id: qmd-models
        uses: actions/cache@v4
        with:
          path: /root/.cache/qmd/models
          key: qmd-models-${{ hashFiles('third-party/qmd/runtime/package.json') }}

      - name: Populate the qmd models
        if: steps.qmd-models.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # `qmd pull` writes to $HOME/.cache/qmd/models, and $HOME is
          # /github/home here — so override it for this one command
          # rather than letting 2.2 GB land where nothing reads it.
          HOME=/root qmd pull
          ls -lh /root/.cache/qmd/models

      - name: repo hygiene lints
        run: |
          # This job runs in a container as root, while the checkout is
          # owned by the runner's uid. git refuses to touch a repo it
          # sees as someone else's ("detected dubious ownership"), and
          # actions/checkout only records the workspace as safe in the
          # RUNNER's git config, not the container's — so `git ls-files`
          # inside lint_repo.py exits 128. Mark it safe here too.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/lint_repo.py

      # This step is the merge gate: a non-zero `bazel test` exit must
      # fail the job. It previously carried `continue-on-error: true` to
      # hide a red cross while the CI-only failures were triaged — the
      # two known causes (the old `precommit_test` shelling out to a host
      # `cargo` the devcontainer doesn't ship, and exec-config bindgen
      # missing `--host_action_env=LIBCLANG_PATH`) are now fixed at the
      # source — the first by replacing that target with the hermetic
      # `//:lint` suite — so the suppression is removed and real failures
      # gate merges again.
      - name: bazel test //...
        run: |
          libdir="${{ steps.env.outputs.libclang-path }}"
          # `//datalib/ui:e2e_test` (Playwright) IS in this gate. It was
          # excluded for a long time behind a FIXME whose stated
          # precondition — a published image carrying `rsync` and both
          # browsers — has been satisfied since `v0.30.1`, the first
          # release whose devcontainer-publish actually ran the
          # `playwright install --with-deps chromium webkit` layer
          # (WebKit landed in d5be7eb8, five days after v0.29.0, and
          # v0.30.0's release run failed). What actually
          # kept it out was two things that note never mentioned, both
          # now handled above and below:
          #
          #   1. The qmd GGUFs are absent from the `-slim`-based image.
          #      The "Cache the qmd models" step fills
          #      `/root/.cache/qmd/models`.
          #   2. `HOME=/github/home`, which GitHub forces for container
          #      steps, points every cache lookup away from the `/root`
          #      the image bakes into. The two `--test_env` flags below
          #      redirect the only two lookups that matter.
          #
          # WebKit's arrival was verified in v0.30.1's build log rather
          # than inferred from the Dockerfile, since layer caching could
          # have skipped the step:
          #
          #   #12 [stage-0 4/10] RUN npx -y "playwright@1.62.1" install --with-deps chromium webkit
          #   #12 62.88 WebKit 26.5 (playwright webkit v2336) downloaded to /root/.cache/ms-playwright/webkit-2336
          #
          # Why bother gating on this at all, given it costs real
          # wall-clock: CI had never run this suite, which is easy to
          # miss because a local `bazel test //...` does. #252 is the
          # worked example — AG Grid 36 restructured the row DOM and 39
          # tests across 18 spec files failed while the grid rendered
          # perfectly, and a Vite 8 `outDir` change made the `dist`
          # action succeed with an empty declared output, which 60 e2e
          # tests reported as "UI bundle not embedded in this binary".
          # CI was green through both. They were caught only because
          # someone happened to run the suite locally.
          #
          # The suite's Playwright report — video and trace per test —
          # rides along as this job's `outputs.zip` with no second
          # invocation needed; see
          # datalib/ui/tests/e2e/README-artifacts.md.
          #
          # It is `no-sandbox` + `requires-network` and takes ~4 min, so
          # it lands on the critical path rather than being a cache
          # replay like the rest of a warm `main` run. That is the price
          # of gating UI regressions; see `docs/dev/testing.md`.
          #
          # `--test_env=CLAUDE_MIRROR_HOST_HOME=/root` — read by
          # `tests/fixtures/materialize_tng_root.sh` in place of `$HOME`
          # when resolving the model cache, the same variable and the
          # same reason as the `--action_env` form below (that one
          # covers build actions; this one covers tests, and they are
          # separate flags).
          #
          # `--test_env=PLAYWRIGHT_BROWSERS_PATH=...` — `run_e2e.sh` runs
          # `playwright install` before the suite. Left pointing at
          # `/github/home`, that is a ~400 MB re-download of chromium +
          # webkit on EVERY run; pointed at the image's baked cache it is
          # the no-op it was designed to be.
          #
          # Do NOT try to collapse these two into a single
          # `--test_env=HOME=/root`. It looks equivalent and is not: the
          # target declares `env_inherit = ["PATH", "HOME", ...]`, and
          # env_inherit WINS over `--test_env` for the same name, so the
          # flag is silently ignored and HOME stays `/github/home`.
          # Measured, not assumed — a local run with
          # `--test_env=HOME=/nonexistent` passed, which it could only do
          # by ignoring the flag. Redirecting the two specific lookups
          # is the mechanism that actually works, which is why there are
          # two flags here rather than one.
          #
          # qmd model cache: the `//tests/fixtures:ingested_tng_qmd` genrule
          # runs qmd, which reads its ~2GB GGUFs from a host dir mounted
          # into the sandbox. The PROD image bakes them at
          # `/root/.cache/qmd/models`, but the devcontainer image CI runs
          # in is built on the `-slim` prod variant (release.yml passes
          # `--build-arg PROD_IMAGE_TAG=${version}-slim`), where that path
          # exists and is EMPTY. #256 wrote that down, and the trade it
          # described was: 2.2 GB of image pulled on every run, against
          # ~2 GB downloaded by qmd on the rare cold genrule.
          #
          # **That trade is off the table now.** The e2e suite needs the
          # same models on EVERY run and refuses to download them
          # (`materialize_tng_root.sh` `exit 3`s on an empty cache, so a
          # multi-GB stall cannot masquerade as a hang), so the "Cache the
          # qmd models" step above fills the path up front. The genrule is
          # the second beneficiary: its cold run no longer downloads
          # anything either.
          #
          # An earlier version of this comment ended by claiming "qmd then
          # finds the baked models + their `.etag` sidecars and skips the
          # download". That was true of a LOCAL devcontainer, which
          # `devcontainer.json` builds against the full prod image, and
          # false here until the cache step existed — it is the cache
          # step, not the image, that makes it true of CI. Read the
          # genrule's own output before believing any version of this
          # story: it prints a line per model saying which it did.
          #
          # The two flags below are still load-bearing, for a different
          # reason than "find the baked models". GitHub Actions overrides
          # HOME=/github/home for container steps, so `.bazelrc`'s
          # `$(HOME)/.cache/qmd/models` mount and build_qmd_index.py's
          # `~/.cache/qmd/models` would otherwise resolve to two different
          # places, and the models dir would not be reachable from inside
          # the genrule sandbox at all:
          #   * --sandbox_add_mount_pair makes /root/.cache/qmd/models
          #     visible in the genrule sandbox (additive to the .bazelrc
          #     $(HOME) mount, which stays correct for local dev).
          #   * CLAUDE_MIRROR_HOST_HOME makes build_qmd_index.py resolve
          #     its models dir to the same path (the script reads it in
          #     place of $HOME).
          # Standing CI accommodation — not a republish bridge: the image
          # bakes as root and GH always sets HOME=/github/home.
          bazel test -c opt --config=release --config=ci --nostamp --jobs=16 \
            --build_metadata=ROLE=CI \
            --action_env=LIBCLANG_PATH="${libdir}" \
            --host_action_env=LIBCLANG_PATH="${libdir}" \
            --sandbox_add_mount_pair=/root/.cache/qmd/models \
            --action_env=CLAUDE_MIRROR_HOST_HOME=/root \
            --test_env=CLAUDE_MIRROR_HOST_HOME=/root \
            --test_env=PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright \
            //...

  # PR-time gate for the fully-static musl release leg. The musl dist
  # build only otherwise runs at tag time (release.yml), and this repo
  # has been burned before by release-only build paths rotting between
  # tags (see the incident notes in release.yml). Building `:dist` under
  # `--config=musl-x86_64` here catches musl-only breakage — a new crate
  # that links a system library, a native build script that mishandles
  # the musl toolchain — on every PR instead of at the next release. It
  # also warms BuildBuddy with the exact opt-mode musl actions the
  # tag-time release build will replay. The static-ness assertion mirrors
  # release.yml's: no PT_INTERP, no DT_NEEDED. (This runs on the x86_64
  # runner only; the aarch64-musl leg differs by arch, not by build
  # logic, and stays tag-time-only.)
  musl-dist:
    name: bazel build :dist (musl static)
    runs-on: ubuntu-latest

    # Same shell, image and checkout depth as `bazel-test` above, for the
    # reasons documented there.
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/imbue-ai/datalib_devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: env
        uses: ./.github/actions/prepare-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILD_BUDDY_API_KEY }}

      - name: bazel build //datalib/backend:dist (musl static)
        run: |
          libdir="${{ steps.env.outputs.libclang-path }}"
          bazel build -c opt --config=release --config=musl-x86_64 \
            --nostamp --jobs=16 \
            --build_metadata=ROLE=CI \
            --action_env=LIBCLANG_PATH="${libdir}" \
            --host_action_env=LIBCLANG_PATH="${libdir}" \
            //datalib/backend:dist
          for bin in \
              bazel-bin/datalib/backend/dag/datalib_dag_bin \
              bazel-bin/datalib/backend/datalib_step/datalib_step \
              bazel-bin/datalib/backend/http/datalib_http_bin \
              bazel-bin/datalib/backend/etl/latchkey_curl_impersonate; do
              echo "--- ${bin}"
              if readelf -l "${bin}" | grep -q 'INTERP'; then
                  echo "ERROR: ${bin} requests a dynamic loader (PT_INTERP) — not fully static." >&2
                  exit 1
              fi
              if readelf -d "${bin}" 2>/dev/null | grep -q 'NEEDED'; then
                  echo "ERROR: ${bin} has DT_NEEDED shared-library deps — not fully static." >&2
                  readelf -d "${bin}" | grep 'NEEDED' >&2
                  exit 1
              fi
              echo "fully static: OK"
          done
