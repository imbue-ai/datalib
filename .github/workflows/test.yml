# Runs `bazel test //...` inside the published devcontainer image with
# BuildBuddy as the action cache. Gates merges on PRs and warms the
# BuildBuddy cache on main pushes.
#
# Why a separate workflow (and not a step in `release.yml`): an earlier
# `bazel test //...` step lived in `release.yml` and was removed because
# the `bazel-contrib/setup-bazel` GHA disk cache kept tripping "Lost
# inputs no longer available remotely" against rules_rust's
# ExtractCargoTomlEnvVars actions — every release run rebuilt 1500+
# actions and the broken cache never healed. Routing the cache through
# BuildBuddy instead sidesteps the GHA-cache-shape mismatch entirely.
#
# Why the devcontainer image: `bazel test //...` needs the full Bazel
# build toolchain — cmake, lld, perl, pkg-config, libssl-dev — that the
# prod image deliberately omits. The
# devcontainer image carries that toolchain on top of the prod image's
# qmd model cache, latchkey, doltlite CLI, etc. Re-installing it via apt
# at the start of each job (the pattern `release.yml`'s build matrix
# uses) would add ~3 min of apt + cold qmd model download to every run;
# pulling the pre-built image is closer to ~30s.
#
# The devcontainer image is published by `devcontainer.yml` — on every
# `v*` tag, and on demand — on its own rather than as a job inside
# `release.yml`.
# It carries a pre-fetched bazel output base, which `prepare-bazel`
# points bazel at.
name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      devcontainer_tag:
        description: >
          Tag of ghcr.io/imbue-ai/datalib_devcontainer to run in, e.g. a
          `sha-<commit>` that `devcontainer.yml` just built, to try an
          image before it becomes `latest`.
        type: string
        default: latest
      remote_execution:
        description: >
          Run the test job on BuildBuddy remote execution instead of on the
          runner. A trial switch, not the merge gate: the gate stays local
          until a dispatch with this on has gone green and the BuildBuddy
          usage graph shows what a month of it costs in cache transfer.
          Requires ghcr.io/imbue-ai/datalib_devcontainer to be a PUBLIC
          package — the executors pull it anonymously.
        type: boolean
        default: false

permissions:
  contents: read
  packages: read  # to pull the devcontainer image from GHCR

# Cancel superseded PR runs — pushing a fixup commit shouldn't keep the
# previous run burning a runner. main pushes don't cancel so the
# BuildBuddy cache fill from every merged commit is preserved.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two bazel jobs, deliberately (`deny` is a third, a one-minute lockfile
# scan with no bazel in it). `bazel-test` and `musl-dist` share nothing at
# execution time — different configurations, disjoint action sets — so
# running them in sequence just parked the musl build (~80s, of which
# ~45s is a second analysis phase) at the end of the critical path.
# Measured on a warm cache: 483s in one job -> 398s as two (n=4).
#
# The costs are a second container pull and a second analysis phase, and
# both are compute rather than wall clock: the jobs run concurrently on
# separate runners. Neither is a `needs:` of the other, and both are
# merge gates, so a musl regression doesn't mask a test failure.
#
# Their common setup — the BuildBuddy key — lives in
# `.github/actions/prepare-bazel` so the two jobs cannot drift apart.
#
# --------------------------------------------------------------------
# Both jobs pass `--nostamp --jobs=16`. Why:
#
# `--nostamp` turns OFF the `--stamp` that `--config=release` turns on
# (later flags win). Stamping is worth nothing to CI and costs a lot, in
# two separate ways:
#
#   1. rules_rust defaults `rust_binary`'s `stamp` attribute to -1
#      ("defer to --stamp"), and when stamping is on it adds
#      `stable-status.txt` to EVERY rust_binary's Rustc action inputs —
#      unconditionally, whether or not the target references a
#      {STABLE_*} placeholder (rules_rust 0.70.0,
#      rust/private/rustc.bzl:849). `tools/workspace_status.sh` emits
#      STABLE_GIT_HASH, so every commit relinked every binary in the
#      repo: measured at 20 Rustc actions plus the two fixture genrules
#      they feed, ~2.5 min of a 4-vCPU runner, on a run where NOTHING
#      else had changed.
#   2. `--stamp` is part of the build configuration, so the subgraph
#      reachable from a stamped binary is configured a second time under
#      a `k8-opt-ST-<hash>` output tree. Measured from
#      `--execution_log_json_file`: 786 extra spawns, 4133 vs 3350
#      total, purely duplicate work.
#
# Nothing is lost. The stamped variants can never be cache hits anyway —
# their key contains the commit SHA, which is new by definition — so
# `release.yml` rebuilds them at tag time whether or not this workflow
# also built them, and it still stamps everything it publishes. The
# unstamped rlibs that dominate the graph are shared either way
# (`rust_library` defaults to `stamp = 0` and ignores the flag).
# `-c opt --config=release` stays, so the rest of the cache-warming
# rationale below still holds.
#
# `--jobs=16` is 4x this runner's vCPU count, which is what `--jobs`
# defaults to. A remote cache HIT does not take a CPU token from bazel's
# ResourceManager, so on a warm run the ~3400 hits are gated purely by
# the --jobs thread count while they wait on the network: the execution
# log shows 508 spawn-seconds of cache-hit materialization finishing in
# ~120s of wall clock, i.e. 4 at a time. Local execution is still
# CPU/RAM-gated by the ResourceManager, so this does not oversubscribe
# compile-bound runs — verified on a run with a real source change (226
# locally executed actions): 1183s with --jobs=16 vs 1209s without, no
# memory pressure.
jobs:
  # Vulnerability and policy scan of both cargo lockfiles (the backend
  # workspace — the lockfile crate_universe resolves every Bazel crate
  # from, Bazel-only crates included — and the desktop shell). The
  # policies are datalib/backend/deny.toml and datalib/tauri/deny.toml;
  # a RustSec advisory against anything in either lock fails this job,
  # and the fix is a hand repin (tools/repin_cargo.sh for the backend;
  # Dependabot only covers the tauri lock, see .github/dependabot.yml).
  #
  # cargo-deny is a prebuilt release binary, pinned by version and
  # sha256 rather than installed through a third-party action or a
  # 3-minute `cargo install`. It needs no toolchain: `cargo metadata`
  # is all it runs, against the committed lockfiles, and the runner
  # image's cargo is enough for that.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny (pinned)
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          name="cargo-deny-${VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "${name}.tar.gz" \
              "https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}/${name}.tar.gz"
          echo "${SHA256}  ${name}.tar.gz" | sha256sum -c -
          tar -xzf "${name}.tar.gz"
          install -m 0755 "${name}/cargo-deny" /usr/local/bin/cargo-deny
          cargo deny --version

      - name: cargo deny check (backend)
        run: cd datalib/backend && cargo deny check

      - name: cargo deny check (tauri shell)
        run: cd datalib/tauri && cargo deny check

  bazel-test:
    name: bazel test //...
    runs-on: ubuntu-latest

    # GitHub Actions defaults `run:` steps to `sh` (dash) when the job
    # runs inside a container, which rejects `set -o pipefail` and `[[ ]]`.
    # Force bash so the bash-isms in the steps below work.
    defaults:
      run:
        shell: bash

    # `:latest` is moved by `devcontainer.yml` only after the new image
    # has analysed the tree from its baked output base without fetching
    # anything, so a broken image cannot become the one every PR pulls.
    # A dispatch can name a `sha-<commit>` tag to try one first.
    container:
      image: ghcr.io/imbue-ai/datalib_devcontainer:${{ inputs.devcontainer_tag || 'latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `tools/workspace_status.sh` runs `git describe --tags`; the
          # default shallow clone has no tag history, so describe would
          # always fall back to a bare sha. We pass `--nostamp` now (see
          # the block above), but `release.yml` does stamp, and keeping
          # the two checkouts identical means a tag-time build sees the
          # same repo state this one tested.
          fetch-depth: 0

      # A push here is a commit on `main` (see `on:`), i.e. PR-gated
      # code: it writes the release group's cache, which is what the
      # tag build replays. Everything else — PRs, dispatches — uses the
      # contributor group, which laptops write too and releases never
      # read. `.bazelrc`'s BuildBuddy block has the reasoning.
      - uses: ./.github/actions/prepare-bazel
        with:
          buildbuddy-api-key: ${{ github.event_name == 'push' && secrets.BUILD_BUDDY_RELEASE_API_KEY || secrets.BUILD_BUDDY_API_KEY }}
          buildbuddy-config: ${{ github.event_name == 'push' && 'buildbuddy-release' || 'buildbuddy' }}

      # `-c opt --config=release` mirrors the build mode `release.yml`'s
      # dist build uses, so the BuildBuddy action cache populated here
      # on every PR / main push warms exactly the entries tag-time
      # release builds will hit (instead of fastbuild entries the
      # release path's opt-mode actions can't use). Side benefit:
      # tests run against the same binaries we ship, which catches
      # opt-mode-only behaviors before release.
      #
      # `--build_metadata=ROLE=CI` tags the invocation in the BuildBuddy
      # UI so CI runs are filterable from contributor invocations.
      # Matches the convention used by `release.yml`'s build + test
      # steps.
      #
      # Repo-hygiene lints that cannot be Bazel tests: both have to
      # enumerate every file in the repo via git, which is exactly what a
      # sandbox denies. Kept as a plain step so `bazel test //...` stays
      # fully hermetic. Runs before the build because it is ~instant and
      # its failures are cheap to fix.
      - name: repo hygiene lints
        run: |
          # This job runs in a container as root, while the checkout is
          # owned by the runner's uid. git refuses to touch a repo it
          # sees as someone else's ("detected dubious ownership"), and
          # actions/checkout only records the workspace as safe in the
          # RUNNER's git config, not the container's — so `git ls-files`
          # inside lint_repo.py exits 128. Mark it safe here too.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/lint_repo.py

      # This step is the merge gate: a non-zero `bazel test` exit must
      # fail the job. It previously carried `continue-on-error: true` to
      # hide a red cross while CI-only failures were triaged (the old
      # `precommit_test` shelling out to a host `cargo` the devcontainer
      # doesn't ship, since replaced by the hermetic `//:lint` suite);
      # the suppression is removed and real failures gate merges again.
      - name: bazel test //...
        run: |
          # `//datalib/ui:e2e_test` (Playwright) IS in this gate. The image
          # bakes both browsers with their OS libraries (the
          # `playwright install --with-deps chromium webkit` layer in
          # `.devcontainer/Dockerfile`), and two things the suite needs
          # are arranged here:
          #
          #   1. The qmd GGUFs are not in the image; they are bazel
          #      inputs (`//third-party/qmd_models`), so the suite brings
          #      its own.
          #   2. `HOME=/github/home`, which GitHub forces for container
          #      steps, points every cache lookup away from the `/root`
          #      the image bakes into. That matters for Playwright's
          #      browser cache — the `--test_env` below redirects it.
          #
          # Why bother gating on this at all, given it costs real
          # wall-clock: CI had never run this suite, which is easy to
          # miss because a local `bazel test //...` does. #252 is the
          # worked example — AG Grid 36 restructured the row DOM and 39
          # tests across 18 spec files failed while the grid rendered
          # perfectly, and a Vite 8 `outDir` change made the `dist`
          # action succeed with an empty declared output, which 60 e2e
          # tests reported as "UI bundle not embedded in this binary".
          # CI was green through both. They were caught only because
          # someone happened to run the suite locally.
          #
          # The suite's Playwright report — video and trace per failed
          # test — lands in bazel's `outputs.zip` for the target, which
          # the step after this one uploads when the run is red; see
          # datalib/ui/tests/e2e/README-artifacts.md.
          #
          # It is `no-sandbox` + `requires-network` and takes ~4 min, so
          # it lands on the critical path rather than being a cache
          # replay like the rest of a warm `main` run. That is the price
          # of gating UI regressions; see `docs/dev/testing.md`.
          #
          # `--test_env=PLAYWRIGHT_BROWSERS_PATH=...` — `run_e2e.sh` runs
          # `playwright install` before the suite. Left pointing at
          # `/github/home`, that is a ~400 MB re-download of chromium +
          # webkit on EVERY run; pointed at the image's baked cache it is
          # the no-op it was designed to be.
          #
          # Do NOT try to replace it with `--test_env=HOME=/root`. That
          # looks equivalent and is not: the target declares
          # `env_inherit = ["PATH", "HOME", ...]`, and env_inherit WINS
          # over `--test_env` for the same name, so the flag is silently
          # ignored and HOME stays `/github/home`. Measured, not assumed
          # — a local run with `--test_env=HOME=/nonexistent` passed,
          # which it could only do by ignoring the flag. Redirecting the
          # specific lookup is the mechanism that actually works.
          #
          # qmd models: nothing to arrange here any more, and the
          # steps that used to arrange it are gone. The GGUFs are
          # fetched by `//third-party/qmd_models` and reach their two
          # consumers as bazel inputs: the
          # `//tests/fixtures:ingested_tng_qmd` genrule and
          # `//tests/fixtures:materialize_tng_root_embed_only`, which
          # the e2e suite runs — the embedding model only, in both
          # cases. Neither reads a host cache, so neither cares that
          # the devcontainer image carries no `/root/.cache/qmd/models`.
          #
          # What this replaced: a `Cache the qmd models` + `Populate the
          # qmd models` pair of steps that filled that directory from the
          # GitHub Actions cache, plus a `qmd pull` on a cache miss. They
          # existed because the two consumers downloaded models
          # themselves, and on 2026-09-03 one of those downloads drew a
          # 429 from HuggingFace and failed a merge-gating build.
          #
          # The fetch is a remote-cached build action. A run whose e2e
          # test is a cache hit never moves the bytes; one that executes
          # it downloads the test's runfiles here, from BuildBuddy's
          # action cache, before it can start — the reason the suite
          # carries one model and not three. HuggingFace is reached
          # only when that cache has lost them, with retries on a 429.
          #
          # Three flags went with those steps:
          # `--sandbox_add_mount_pair=/root/.cache/qmd/models`,
          # `--action_env=CLAUDE_MIRROR_HOST_HOME=/root` and
          # `--test_env=CLAUDE_MIRROR_HOST_HOME=/root` — between them
          # what aimed the genrule and the e2e materializer at the
          # image's cache, GitHub having forced HOME=/github/home for
          # container steps. Nothing reads that variable now.
          # Remote execution is opt-in per dispatch (see the workflow
          # inputs). `inputs.remote_execution` is empty on push and
          # pull_request, so those take the local branch.
          #
          # `--jobs` is set by `--config=remote` (80, the free tier's
          # core ceiling). A command-line `--jobs` beats an rc file, so
          # the local branch is the only one that may pass it.
          if [[ "${{ inputs.remote_execution }}" == "true" ]]; then
              mode=(--config=remote)
          else
              mode=(--jobs=16)
          fi
          bazel test -c opt --config=release --config=ci --nostamp "${mode[@]}" \
            --build_metadata=ROLE=CI \
            --test_env=PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright \
            //...

      # The e2e suite's Playwright report, when the run is red: a trace
      # per failed test, scrubbable action by action with the DOM before
      # and after each. Without this a spec that fails only on these
      # runners is undiagnosable from the console log alone — the trace
      # is what says which element was under the pointer.
      # The testlogs directory is per configuration, so the flags are the
      # test step's; `cp -L` because the path is a symlink farm.
      - name: Keep the e2e report
        if: failure()
        run: |
          set -euo pipefail
          flags=(-c opt --config=release --config=ci --nostamp)
          zip="$(bazel info bazel-testlogs "${flags[@]}")/datalib/ui/e2e_test/test.outputs/outputs.zip"
          if [[ -f "${zip}" ]]; then
            mkdir -p e2e-report && cp -L "${zip}" e2e-report/playwright-report.zip
          else
            echo "no e2e outputs at ${zip} — the suite did not run, or passed"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && hashFiles('e2e-report/playwright-report.zip') != ''
        with:
          name: e2e-playwright-report
          path: e2e-report/playwright-report.zip
          retention-days: 7

      # Make the build downloadable: every shipped binary under its
      # public name (`//datalib/backend:bin` does the rename), in a
      # tarball laid out like the release's. Nearly free — the test
      # step above already built all of them in this exact mode — and
      # it is how to get a current Linux build of a PR without cutting
      # a tag, e.g. to build the docker image locally against binaries
      # newer than the last release (docs/dev/docker.md). Three days
      # covers a review.
      - name: Stage the build as a tarball
        if: success()
        run: |
          set -euo pipefail
          flags=(-c opt --config=release --config=ci --nostamp)
          if [[ "${{ inputs.remote_execution }}" == "true" ]]; then
              mode=(--config=remote)
          else
              mode=(--jobs=16)
          fi
          # `--config=ci` builds without the bytes; the tarball needs them.
          bazel build "${flags[@]}" "${mode[@]}" --build_metadata=ROLE=CI \
            --remote_download_toplevel //datalib/backend:bin
          bindir="$(bazel info bazel-bin "${flags[@]}")/datalib/backend/bin"
          version="$(sed -n -E 's/^version = "([^"]+)"$/\1/p' datalib/backend/Cargo.toml)"
          stage="datalib-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "artifact/${stage}"
          cp -L "${bindir}"/* "artifact/${stage}/"
          chmod +x "artifact/${stage}"/*
          tar -C artifact -czf "artifact/datalib-x86_64-unknown-linux-gnu.tar.gz" "${stage}"
          ls -la artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: datalib-x86_64-unknown-linux-gnu
          path: artifact/datalib-x86_64-unknown-linux-gnu.tar.gz
          retention-days: 3

  # PR-time gate for the fully-static musl release leg. The musl dist
  # build only otherwise runs at tag time (release.yml), and this repo
  # has been burned before by release-only build paths rotting between
  # tags (see the incident notes in release.yml). Building `:dist` under
  # `--config=musl-x86_64` here catches musl-only breakage — a new crate
  # that links a system library, a native build script that mishandles
  # the musl toolchain — on every PR instead of at the next release. It
  # also warms BuildBuddy with the exact opt-mode musl actions the
  # tag-time release build will replay. The static-ness assertion mirrors
  # release.yml's: no PT_INTERP, no DT_NEEDED. (This runs on the x86_64
  # runner only; the aarch64-musl leg differs by arch, not by build
  # logic, and stays tag-time-only.)
  musl-dist:
    name: bazel build :dist (musl static)
    runs-on: ubuntu-latest

    # Same shell, image and checkout depth as `bazel-test` above, for the
    # reasons documented there.
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/imbue-ai/datalib_devcontainer:${{ inputs.devcontainer_tag || 'latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A push here is a commit on `main` (see `on:`), i.e. PR-gated
      # code: it writes the release group's cache, which is what the
      # tag build replays. Everything else — PRs, dispatches — uses the
      # contributor group, which laptops write too and releases never
      # read. `.bazelrc`'s BuildBuddy block has the reasoning.
      - uses: ./.github/actions/prepare-bazel
        with:
          buildbuddy-api-key: ${{ github.event_name == 'push' && secrets.BUILD_BUDDY_RELEASE_API_KEY || secrets.BUILD_BUDDY_API_KEY }}
          buildbuddy-config: ${{ github.event_name == 'push' && 'buildbuddy-release' || 'buildbuddy' }}

      - name: bazel build //datalib/backend:dist (musl static)
        run: |
          bazel build -c opt --config=release --config=musl-x86_64 \
            --nostamp --jobs=16 \
            --build_metadata=ROLE=CI \
            //datalib/backend:dist
          for bin in \
              bazel-bin/datalib/backend/dag/datalib_dag_bin \
              bazel-bin/datalib/backend/datalib_step/datalib_step \
              bazel-bin/datalib/backend/http/datalib_http_bin \
              bazel-bin/third-party/latchkey-curl-shims/latchkey-curl-router \
              bazel-bin/third-party/latchkey-curl-shims/curl-impersonate \
              bazel-bin/third-party/doltlite/doltlite; do
              echo "--- ${bin}"
              if readelf -l "${bin}" | grep -q 'INTERP'; then
                  echo "ERROR: ${bin} requests a dynamic loader (PT_INTERP) — not fully static." >&2
                  exit 1
              fi
              if readelf -d "${bin}" 2>/dev/null | grep -q 'NEEDED'; then
                  echo "ERROR: ${bin} has DT_NEEDED shared-library deps — not fully static." >&2
                  readelf -d "${bin}" | grep 'NEEDED' >&2
                  exit 1
              fi
              echo "fully static: OK"
          done

      # Static is necessary, not sufficient: a musl link can come out
      # fully static and still carry stock SQLite instead of the doltlite
      # engine, and the checks above cannot tell. This runs the musl
      # binaries end to end on a fixture and reads dolt_log back through
      # the shell. The script is //datalib/backend:doltlite_link_test in
      # the default build; here it runs standalone, because a
      # `--platforms` build has no shell toolchain for an sh_test.
      - name: doltlite_link_test against the musl binaries
        run: |
          set -euo pipefail
          flags=(-c opt --config=release --config=musl-x86_64 --nostamp)
          bazel build "${flags[@]}" --jobs=16 --build_metadata=ROLE=CI //datalib/backend:bin
          DATALIB_BIN_DIR="$(bazel info bazel-bin "${flags[@]}")/datalib/backend/bin" \
          DATALIB_VCF_DIR="datalib/backend/etl/providers/contacts/tests/fixtures/carddav_tng" \
              datalib/backend/doltlite_link_test.sh


