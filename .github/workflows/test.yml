# TEMPORARY probe: can the toolchains_musl bazel-9 autoload bridge be
# dropped by bumping to 0.1.27.bcr.1 (which carries musl-toolchain#67)?
# Only builds the musl leg — the bridge affects nothing else. Not for merge.
name: test
on: [workflow_dispatch]
permissions:
  contents: read
  packages: read
jobs:
  musl-only:
    name: musl bridge probe
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/imbue-ai/datalib_devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${BUILDBUDDY_API_KEY:-}" ]]; then
              cat > .bazelrc.user <<EOF
          common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
          build --config=buildbuddy
          EOF
          fi
      - name: bazel build :dist (musl static), bridge removed
        run: |
          libdir="$(llvm-config --libdir)"
          bazel build -c opt --config=release --config=musl-x86_64 \
            --nostamp --jobs=16 --build_metadata=ROLE=CI \
            --action_env=LIBCLANG_PATH="${libdir}" \
            --host_action_env=LIBCLANG_PATH="${libdir}" \
            //datalib/backend:dist
          for bin in bazel-bin/datalib/backend/dag/datalib_dag_bin \
                     bazel-bin/datalib/backend/etl/latchkey_curl_impersonate; do
              readelf -l "${bin}" | grep -q 'INTERP' && { echo "NOT STATIC: ${bin}"; exit 1; }
              echo "fully static: ${bin}"
          done
      - name: did MODULE.bazel.lock need repinning?
        if: always()
        run: git diff --stat MODULE.bazel.lock || true
