# Dependabot: keeps the pins current, so a fixed advisory reaches us as a
# PR rather than as a red `deny` job. The `deny` job in test.yml is what
# fails the build in between.
#
# Not every lockfile in the tree is here. The backend's Cargo.lock and
# requirements.txt are inputs to bzlmod extensions, so a bump to either
# also has to repin MODULE.bazel.lock (`bazelisk build --nobuild //...`;
# not `bazel mod deps`, which aborts on protobuf's lockfile-less
# crate_universe use) — which Dependabot cannot do, so every such PR
# fails at analysis. Those two are bumped by hand (tools/repin_cargo.sh;
# AGENTS.md § "Python deps"). The tauri Cargo.lock is outside Bazel and
# stays.
#
# Actions are pinned to full commit SHAs (a tag can be moved; a SHA
# cannot), and Dependabot keeps the SHA and the `# vN` comment in step.
#
# The two npm trees under third-party/ are the packages the shipped
# binaries run (see MODULE.bazel); a bump there also bumps the Rust
# version constants (`//tools:version_pins_test` says which), so those
# PRs need a hand. tools/lint's pyright is pinned beside the pip one
# for the same reason.
#
# One batch a week, every entry on the same Monday-morning slot, a few
# PRs at a time: every PR is a full CI run on the shared BuildBuddy
# executors, and the day this was enabled fourteen cold runs started at
# once and made every merge-gating run that hour slow. The batch lands
# before the weekly routine that triages it (Monday 07:00 Zurich,
# claude.ai/code/routines). Security advisories still arrive as soon as
# Dependabot sees them; the schedule only governs version bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /datalib/tauri
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 2
    versioning-strategy: lockfile-only

  - package-ecosystem: npm
    directory: /datalib/ui
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is the native compiler and drops the JS compiler
      # API that vue-tsc (the typecheck test) is built on. Lift this
      # when vue-tsc runs on 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /datalib/tauri
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /tools/lint
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /third-party/qmd/runtime
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /third-party/latchkey/runtime
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directory: /datalib/docker
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 1
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 1
