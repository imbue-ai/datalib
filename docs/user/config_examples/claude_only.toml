# Minimal config in the format `datalib-pipeline` runs: one source (claude.ai
# conversations) — a group and its three steps — plus the grid and search
# index group with its shared index step and the app's applets.
# `datalib-step help dag-example` walks through the format.

# Where the downloaded data gets written. Top-level keys have to come
# before the first [[…]] header — everything after a table header
# belongs to that table.
data_root = "~/claude_data_liberated"

[[groups]]
id = "claude_chats"
type = "claude"

[[steps]]
id = "claude_chats/ingest"
command = "datalib-step run ingest claude"
[steps.params]
api = {}

[[steps]]
id = "claude_chats/render_markdown"
command = "datalib-step run render_markdown claude"
reads = "pinned"
inputs = ["claude_chats/ingest"]

[[steps]]
id = "claude_chats/embed"
command = "datalib-step run embed claude"
reads = "files"
locks = ["embedder"]
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]

[[groups]]
id = "unified_grid_and_search_index"

[[steps]]
id = "unified_grid_and_search_index/unified_grid_and_search_index"
command = "datalib-step run unified_grid_and_search_index"
reads = "pinned"
locks = ["index"]
inputs = ["*/render_markdown"]

# The app's own surface: `unified_grid_and_search_index` serves the grid, the document
# view and the document picker. Without it the UI has no search — it is
# an applet rather than a built-in so the backend does not have to know
# what a grid row is.
[[applets]]
group = "unified_grid_and_search_index"
id = "unified_grid_and_search_index"
command = "datalib-applet unified_grid_and_search_index"

# The contacts app: your own record of who a handle is, which the person
# chips and search read. `datalib-step help contacts-app`.
[[applets]]
group = "unified_grid_and_search_index"
id = "datalib_contacts"
command = "datalib-applet datalib_contacts"

# The verbs `datalib-step` takes (docs/dev/step_protocol.md § Verbs).
[[programs]]
command = "datalib-step"
verbs = ["reset", "prepare", "compact", "collect", "check"]
pass_env = ["DATALIB_CACHE_DIR", "MINDS_VIA_DESKTOP_URL_PREFIX", "DATALIB_EMBED_THREADS"]

# One embed at a time: each loads the model and writes the search index.
[[locks]]
name = "embedder"
slots = 1

# The fan-ins that read every source.
[[locks]]
name = "index"
slots = 2
