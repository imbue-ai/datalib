# Minimal config in the format `datalib-dag` runs: one source (claude.ai
# conversations) — a group and its two steps — plus the unified index
# group with its two shared index steps. See configs/dag_example.toml
# for a walkthrough of the format.

# Where the downloaded data gets written. Top-level keys have to come
# before the first [[…]] header — everything after a table header
# belongs to that table.
data_root = "~/claude_data_liberated"

[[groups]]
id = "claude_chats"
type = "claude_api"

[[steps]]
group = "claude_chats"
function = "ingest"
[steps.params]
sync = {}

[[steps]]
group = "claude_chats"
function = "render_markdown"
inputs = ["claude_chats/ingest"]

[[groups]]
id = "unified_index"

[[steps]]
group = "unified_index"
function = "grid_index"
inputs = ["claude_chats/render_markdown"]

[[steps]]
group = "unified_index"
function = "qmd_index"
inputs = ["claude_chats/render_markdown"]

# The app's own surface: `unified_index` serves the grid, the document
# view and the document picker. Without it the UI has no search — it is
# an applet rather than a built-in so the backend does not have to know
# what a grid row is.
[[applets]]
group = "unified_index"
id = "unified_index"
command = "datalib-applet unified_index"
