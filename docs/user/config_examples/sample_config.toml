# Sample config in the format `datalib-dag` runs: each source is a
# `[[groups]]` entry with a `type` plus its steps (`ingest`,
# `render_markdown` and its two search steps), and the two shared index
# steps under the `unified_document_index` group, which every source's
# rendered markdown feeds. A step's `id` is `<group>/<function>`, and
# `inputs` name steps by that id. Each step's `command` runs
# `datalib-step run <function>`, followed by the group's `type` for a
# step under a source. See configs/dag_example.toml for a walkthrough
# of the format and all_sources.toml (next to this file) for every
# supported source.

# Where the downloaded data gets written. Top-level keys have to come
# before the first [[…]] header — everything after a table header
# belongs to that table.
data_root = "~/datalib"

# Shared fan-in steps: the SQL index behind the grid UI, fed by every
# source's rendered markdown, and the qmd aggregator, which runs after
# every source's own search steps.
[[groups]]
id = "unified_document_index"

[[steps]]
id = "unified_document_index/grid_index"
command = "datalib-step run grid_index"
reads = "pinned"
locks = ["index"]
inputs = ["gmail-takeout/render_markdown", "slack/render_markdown", "claude-api/render_markdown"]

[[steps]]
id = "unified_document_index/qmd_aggregator"
command = "datalib-step run qmd_aggregator"
reads = "pinned"
locks = ["qmd_keyword"]
inputs = ["gmail-takeout/keyword_index", "gmail-takeout/embed", "slack/keyword_index", "slack/embed", "claude-api/keyword_index", "claude-api/embed"]

# Google Takeout Gmail export. The `mbox` table is the method: it puts
# the email provider in file-backed mode, reading the file at its
# `path` instead of talking to a mail server. Point it at the .mbox
# unpacked from your Takeout zip.
[[groups]]
id = "gmail-takeout"
type = "email"

[[steps]]
id = "gmail-takeout/ingest"
command = "datalib-step run ingest email"
[steps.params.mbox]
path = "~/backups/Takeout/Mail/All mail Including Spam and Trash.mbox"

[[steps]]
id = "gmail-takeout/render_markdown"
command = "datalib-step run render_markdown email"
reads = "pinned"
inputs = ["gmail-takeout/ingest"]

[[steps]]
id = "gmail-takeout/keyword_index"
command = "datalib-step run keyword_index email"
reads = "files"
locks = ["qmd_keyword"]
inputs = ["gmail-takeout/render_markdown"]

[[steps]]
id = "gmail-takeout/embed"
command = "datalib-step run embed email"
reads = "files"
locks = ["qmd_embed"]
inputs = ["gmail-takeout/keyword_index"]

# Slack workspace mirror. Credentials come from `latchkey` at runtime
# (see the "Register Slack with latchkey" section in the first-time
# user guide). `channels` restricts the sync to the listed channels;
# omit it (or set `all_channels = true`) to mirror every channel the
# account can see. `media = true` pulls file attachments into blobs.
[[groups]]
id = "slack"
type = "slack"

[[steps]]
id = "slack/ingest"
command = "datalib-step run ingest slack"

[steps.params.common]
blob_size_limit_bytes = "1 MB"  # skip larger file uploads
# Bound how long the download keeps retrying upstream rate limits
# before giving up, and how many requests it has out at once. The
# shared HTTP layer always honors a 429 `Retry-After` (else backs off
# exponentially); the first two decide when to stop. Each request is a
# `latchkey curl` process of about 80 MB, so the third bounds memory
# too. Defaults shown.
# [steps.params.common.download_params]
# maximum_time_without_progress_in_minutes = 30
# maximum_sequential_failed_requests = 50
# maximum_requests_at_once = 8

[steps.params.api]
media = true
channels = ["project-data-liberation"]
# dms = true             # also mirror direct messages (1:1 and group).
                         # Off unless set. `dm_conversations = ["D024BE7LH"]`
                         # narrows them to particular conversations, by
                         # Slack id or pasted link — a separate list
                         # from `channels`, since a DM has no channel name.
# since = "2025-01-01"   # oldest message to mirror (unset: everything).
                         # This — not `refresh_window_days` — is how you
                         # bound how far back the mirror goes.

[[steps]]
id = "slack/render_markdown"
command = "datalib-step run render_markdown slack"
reads = "pinned"
inputs = ["slack/ingest"]

[[steps]]
id = "slack/keyword_index"
command = "datalib-step run keyword_index slack"
reads = "files"
locks = ["qmd_keyword"]
inputs = ["slack/render_markdown"]

[[steps]]
id = "slack/embed"
command = "datalib-step run embed slack"
reads = "files"
locks = ["qmd_embed"]
inputs = ["slack/keyword_index"]

# Anthropic / claude.ai conversation mirror. Credentials come from
# `latchkey` at runtime (see the "Register Claude web with latchkey"
# section in the first-time user guide). An empty `api` table fetches
# every conversation across every org the account can see; uncomment
# the knobs below to bound the work on incremental re-runs.
[[groups]]
id = "claude-api"
type = "claude"

[[steps]]
id = "claude-api/ingest"
command = "datalib-step run ingest claude"
[steps.params.api]
# refresh_most_recent_n_chat_count = 3   # force-refetch top-N by updated_at
# since = "2025-01-01"      # only sync conversations updated at/after this
# projects = false          # skip Claude Projects (default: on)
# project_uuids = [...]     # or: mirror only these projects (UUIDs or URLs)

[[steps]]
id = "claude-api/render_markdown"
command = "datalib-step run render_markdown claude"
reads = "pinned"
inputs = ["claude-api/ingest"]

[[steps]]
id = "claude-api/keyword_index"
command = "datalib-step run keyword_index claude"
reads = "files"
locks = ["qmd_keyword"]
inputs = ["claude-api/render_markdown"]

[[steps]]
id = "claude-api/embed"
command = "datalib-step run embed claude"
reads = "files"
locks = ["qmd_embed"]
inputs = ["claude-api/keyword_index"]

# The app's own surface: `unified_document_index` serves the grid, the document
# view and the document picker. Without it the UI has no search — it is
# an applet rather than a built-in so the backend does not have to know
# what a grid row is.
[[applets]]
group = "unified_document_index"
id = "unified_document_index"
command = "datalib-applet unified_document_index"

# The contacts app: your own record of who a handle is, which the person
# chips and search read. `datalib-step help contacts-app`.
[[applets]]
group = "unified_document_index"
id = "datalib_contacts"
command = "datalib-applet datalib_contacts"

# The verbs `datalib-step` takes (docs/dev/step_protocol.md § Verbs).
[[programs]]
command = "datalib-step"
verbs = ["reset", "prepare", "compact", "collect"]

# Whatever writes qmd's keyword index: two at once can lose a document.
[[locks]]
name = "qmd_keyword"
slots = 1

# Whatever embeds into qmd's index: two at once race on its vectors.
[[locks]]
name = "qmd_embed"
slots = 1

# The fan-ins that read every source.
[[locks]]
name = "index"
slots = 2
