# Sample config in the format `datalib-dag` runs: each source is a
# `[[groups]]` entry with a `type` plus its two steps (`ingest` and
# `render_markdown`, each written as `group` + `function` and with no
# `command`, since a built-in step is `datalib-step`), and the two
# shared index steps under the `unified_index` group, which every
# source's rendered markdown feeds. A step's id is `<group>/<function>`,
# composed rather than written; `inputs` name steps by that id. See
# configs/dag_example.toml for a walkthrough of the format and
# all_sources.toml (next to this file) for every supported source.

# Where the downloaded data gets written. Top-level keys have to come
# before the first [[…]] header — everything after a table header
# belongs to that table.
data_root = "~/datalib"

# Shared fan-in steps: the SQL index behind the grid UI and the qmd
# semantic-search index, each fed by every source's rendered markdown.
[[groups]]
id = "unified_index"

[[steps]]
group = "unified_index"
function = "grid_index"
inputs = ["gmail-takeout/render_markdown", "slack/render_markdown", "claude-api/render_markdown"]

[[steps]]
group = "unified_index"
function = "qmd_index"
inputs = ["gmail-takeout/render_markdown", "slack/render_markdown", "claude-api/render_markdown"]

# Google Takeout Gmail export. The `mbox` table is the method: it puts
# the email provider in file-backed mode, reading the file at its
# `path` instead of talking to a mail server. Point it at the .mbox
# unpacked from your Takeout zip.
[[groups]]
id = "gmail-takeout"
type = "email"

[[steps]]
group = "gmail-takeout"
function = "ingest"
[steps.params.mbox]
path = "~/backups/Takeout/Mail/All mail Including Spam and Trash.mbox"

[[steps]]
group = "gmail-takeout"
function = "render_markdown"
inputs = ["gmail-takeout/ingest"]

# Slack workspace mirror. Credentials come from `latchkey` at runtime
# (see the "Register Slack with latchkey" section in the first-time
# user guide). `channels` restricts the sync to the listed channels;
# omit it (or set `all_channels = true`) to mirror every channel the
# account can see. `media = true` pulls file attachments into blobs.
[[groups]]
id = "slack"
type = "slack"

[[steps]]
group = "slack"
function = "ingest"

[steps.params.common]
blob_size_limit_bytes = 1000000  # 1 MB — skip larger file uploads
# Bound how long the download keeps retrying upstream rate limits
# before giving up. The shared HTTP layer always honors a 429
# `Retry-After` (else backs off exponentially); these decide when
# to stop. Defaults shown.
# [steps.params.common.download_params]
# maximum_time_without_progress_in_minutes = 30
# maximum_sequential_failed_requests = 50

[steps.params.api]
media = true
channels = ["project-data-liberation"]
# dms = true             # also mirror direct messages (1:1 and group).
                         # Off unless set. `dm_users = ["@riker"]`
                         # narrows them to conversations with particular
                         # people — a separate list from `channels`,
                         # since a DM has no channel name.
# since = "2025-01-01"   # oldest message to mirror (default 2024-01-01).
                         # This — not `refresh_window_days` — is how you
                         # bound how far back the mirror goes.

[[steps]]
group = "slack"
function = "render_markdown"
inputs = ["slack/ingest"]

# Anthropic / claude.ai conversation mirror. Credentials come from
# `latchkey` at runtime (see the "Register Claude web with latchkey"
# section in the first-time user guide). An empty `api` table fetches
# every conversation across every org the account can see; uncomment
# the knobs below to bound the work on incremental re-runs.
[[groups]]
id = "claude-api"
type = "claude"

[[steps]]
group = "claude-api"
function = "ingest"
[steps.params.api]
# refresh_most_recent_n_chat_count = 3   # force-refetch top-N by updated_at
# since = "2025-01-01"      # only sync conversations updated at/after this
# projects = false          # skip Claude Projects (default: on)
# project_uuids = [...]     # or: mirror only these projects (UUIDs or URLs)

[[steps]]
group = "claude-api"
function = "render_markdown"
inputs = ["claude-api/ingest"]

# The app's own surface: `unified_index` serves the grid, the document
# view and the document picker. Without it the UI has no search — it is
# an applet rather than a built-in so the backend does not have to know
# what a grid row is.
[[applets]]
group = "unified_index"
id = "unified_index"
command = "datalib-applet unified_index"
