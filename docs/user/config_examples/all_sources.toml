# use the only one.
[steps.params.latchkey_settings]
account = "picard"

[steps.params.api]
since = "2025-01-01"              # only conversations updated at or after this (a day,
                                  # RFC 3339, or "-30d" from the sync); move it back later
                                  # to backfill; default: all
max_listing_pages = 20            # stop listing after this many pages (100 conversations
                                  # each); a listing cut short deletes nothing; default: all
max_conversations_per_run = 100   # fetch at most this many per run, the never-fetched
                                  # first; default: every one that changed
refetch_newest_conversations = 3  # fetch the 3 most recently updated conversations
                                  # again every run; unset fetches only what changed
seconds_between_requests = 0.5    # wait between requests (0 to 3600); default: none
conv_uuids = [                    # only these conversations, by id or pasted link, and
  "https://chatgpt.com/c/abc123de-f456-7890-abcd-ef0123456789",  # no listing, so every
]                                 # setting above but the wait is ignored, with a
                                  # warning; omit for all

# Start from a data export of this same account: the `.zip`, or the
# folder it was unzipped into. It fills in every conversation the store
# does not have yet, so they and their files are not downloaded; the API
# then fetches what moved since, newer than `since` if set. Only the API's
# listing deletes. The export is read again only when it changes. Omit
# the table to download every conversation.
[steps.params.export]
path = "~/Downloads/chatgpt-export.zip"

[[steps]]
id = "chatgpt-api/render_markdown"
command = "datalib-step run render_markdown chatgpt"
inputs = ["chatgpt-api/ingest"]
reads = "pinned"

