# --- airvisual by `export` ----------------------------------------------

# AirVisual Pros' own history files, read off each unit's Samba share
# (`smb://<ip>/airvisual`, mounted in the Finder) or a copy of that folder,
# with every option set, and searchable. No sign-in.
[[groups]]
id = "airvisual"
name = "AirVisual"
type = "airvisual"

[[steps]]
group = "airvisual"
function = "ingest"

# One entry per monitor. Every `YYYYMM_AirVisual_values.txt` under `path`
# is read, the `archive*/` folders too.
[[steps.params.export.devices]]
path = "/Volumes/airvisual"  # the mounted share, or a copy of it
serial = "NCC1701D"          # the device's serial, which keys every sample; default:
                             # read from the folder's latest_config_measurements.json
                             # (set it for a copy without that file)
name = "Bridge"              # what to call it; default: the name the device gives
                             # itself, then the serial

[[steps.params.export.devices]]
path = "~/Downloads/airvisual-export/ten-forward"

# One page with a chart per quantity (particulates, AQI, CO2, temperature,
# humidity, VOC), every device a series. No options.
[[steps]]
group = "airvisual"
function = "render_markdown"
inputs = ["airvisual/ingest"]

# The readings as time series, for the charts. Add this step to
# `unified_time_series_index/time_series_index`'s inputs.
[[steps]]
group = "airvisual"
function = "render_time_series"
inputs = ["airvisual/ingest"]

# Keyword (BM25) search over the page. Add it to
# `unified_document_index/qmd_aggregator`'s inputs. A time-series source
# takes no `embed` step: its pages are summaries of numbers.
[[steps]]
group = "airvisual"
function = "keyword_index"
inputs = ["airvisual/render_markdown"]

# --- apple_messages by `messages` ---------------------------------------

# The Messages app's own database (`chat.db`), mirrored table for table, with
# every option set, and searchable. No sign-in. macOS protects
# `~/Library/Messages`: the terminal running the sync needs Full Disk Access.
[[groups]]
id = "apple_messages"
name = "Apple Messages"
type = "apple_messages"

[[steps]]
group = "apple_messages"
function = "ingest"

# Which tables and columns to mirror. Globs: `*` and `?` only.
[steps.params]
include_tables = ["*"]                          # the default: every table
exclude_tables = ["recoverable_message_part"]   # skip these, after include_tables;
                                                # default none (this one is "recently deleted" text)
exclude_columns = ["message.payload_data"]      # `Table.column` globs left out entirely; default none
skip_churn = true    # leave out the app's counters, settings, Spotlight and CloudKit
                     # queues and every `index_state` column, which the daemons rewrite
                     # constantly; with it off every run commits; default true
snapshot = true      # read a `VACUUM INTO` copy, not the live file Messages keeps
                     # open; default true
gc = false           # collect unreachable chunks each run: a smaller store,
                     # history kept, but it rewrites the store; default false

# The Messages folder, or a `chat.db` file directly (a copy, or an iPhone
# backup's `3d0d7e5fb2ce288813306e4d4636395e047a3d28`, the same database).
# Prefer the folder: the snapshot also reads the `chat.db-wal` beside it.
[steps.params.messages]
path = "~/Library/Messages"

[[steps]]
group = "apple_messages"
function = "render_markdown"
inputs = ["apple_messages/ingest"]

# Free-text search: keyword (BM25), then embeddings for search by meaning.
# Add both to `unified_document_index/qmd_aggregator`'s inputs.
[[steps]]
group = "apple_messages"
function = "keyword_index"
inputs = ["apple_messages/render_markdown"]

[[steps]]
group = "apple_messages"
function = "embed"
inputs = ["apple_messages/keyword_index"]

# --- apple_photos by `library` ------------------------------------------

# An Apple Photos library's database (`database/Photos.sqlite`) mirrored table
# for table, with every option set. No sign-in. macOS protects the library:
# the terminal running the sync needs Full Disk Access.
[[groups]]
id = "apple_photos"
name = "Apple Photos"
type = "apple_photos"

[[steps]]
group = "apple_photos"
function = "ingest"

# Which tables and columns to mirror. Globs: `*` and `?` only.
[steps.params]
include_tables = ["*"]                          # the default: every table
exclude_tables = ["ZCLOUD*"]                    # skip these, after include_tables; default none
exclude_columns = ["ZASSET.*HIGHLIGHTBEING*"]   # `Table.column` globs left out entirely; default none
skip_history = true  # leave out Core Data's change log, the daemons' work queue and
                     # counters, and every row's `Z_OPT`, which Photos rewrites
                     # constantly; with it off every run commits; default true
# Photos keys its tables on `Z_PK`, a rowid it renumbers on a library repair;
# `ZUUID` is the stable id beside it. A table with one of these columns is
# keyed on it when it is unique on every row; [] keys every table on what it
# declares. Default ["ZUUID"].
stable_key_columns = ["ZUUID"]
# Pin a table's key yourself, `table = [columns]`; an empty list mirrors the
# table with no key. Default none.
primary_keys = { ZDETECTEDFACE = ["Z_PK"] }
snapshot = true      # read a `VACUUM INTO` copy, not the live file Photos keeps
                     # open; default true
gc = false           # collect unreachable chunks each run: a smaller store,
                     # history kept, but it rewrites the store; default false

# The `.photoslibrary` bundle, or its `database/Photos.sqlite` directly.
[steps.params.library]
path = "~/Pictures/Photos Library.photoslibrary"

# Apple Photos renders no documents: query the raw store with
# `datalib-doltlite`. This step writes the storage report every source
# gets, which is what puts Apple Photos in the grid.
[[steps]]
group = "apple_photos"
function = "render_markdown"
inputs = ["apple_photos/ingest"]

# --- beeper by `texts` --------------------------------------------------

# The Beeper Texts desktop app's local data, with every option set, and
# searchable. No sign-in; it reads the app's data directory.
[[groups]]
id = "beeper"
name = "Beeper"
type = "beeper"

[[steps]]
group = "beeper"
function = "ingest"

[steps.params.texts]
path = "~/Library/Application Support/BeeperTexts"  # the app's data directory; this is
                                                    # the default on macOS
media = true         # copy the app's cached media into blobs; false keeps the
                     # attachments' names without their bytes; default true

[[steps]]
group = "beeper"
function = "render_markdown"
inputs = ["beeper/ingest"]

[steps.params]
period = "month"                     # span of each page: month (default), day, year,
                                     # or all (one page per chat)
networks = ["signal", "googlechat"]  # which networks to render; omit for every one
                                     # (the ingest mirrors them all either way)

# Free-text search: keyword (BM25), then embeddings for search by meaning.
# Add both to `unified_document_index/qmd_aggregator`'s inputs.
[[steps]]
group = "beeper"
function = "keyword_index"
inputs = ["beeper/render_markdown"]

[[steps]]
group = "beeper"
function = "embed"
inputs = ["beeper/keyword_index"]

# --- calendar by `google` -----------------------------------------------

# Google Calendar through Google's API, signed in through latchkey
# (`latchkey auth browser google-calendar`), with every option set, and
# searchable.
[[groups]]
id = "calendar-google"
name = "Google Calendar"
type = "calendar"

[[steps]]
group = "calendar-google"
function = "ingest"

# When to give up on a failing server. The download always backs off and
# retries; these only decide when to stop.
[steps.params.common.download_params]
maximum_time_without_progress_in_minutes = 30  # the default
maximum_sequential_failed_requests = 50        # the default

# A JSONL copy of every row written, under ingest/events/, for debugging.
# Nothing reads it and it grows every run.
[steps.params.common.event_tape]
enabled = false

# Which stored latchkey account to use (`latchkey auth list`). Omit it to
# use the only one.
[steps.params.latchkey_settings]
account = "picard@example.com"

[steps.params.google]
calendars = ["Bridge Duty", "Away Missions"]  # names as the service shows them, or ids;
                                               # omit for every calendar. One added later
                                               # downloads whole on the next run
since = "2024-01-01"  # first day mirrored, YYYY-MM-DD; omit for all of history
until = "2026-12-31"  # last day mirrored, included; omit for no end. With either set,
                      # the calendar is listed whole every run rather than resumed

[[steps]]
group = "calendar-google"
function = "render_markdown"
inputs = ["calendar-google/ingest"]

# Free-text search: keyword (BM25), then embeddings for search by meaning.
# Add both to `unified_document_index/qmd_aggregator`'s inputs.
[[steps]]
group = "calendar-google"
function = "keyword_index"
inputs = ["calendar-google/render_markdown"]

[[steps]]
group = "calendar-google"
function = "embed"
inputs = ["calendar-google/keyword_index"]

