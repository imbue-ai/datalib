# --- signal by `backup` -------------------------------------------------

# Signal messages from the Android app's local backups, with every option
# set, and searchable. Each snapshot in `backup.path` is decrypted with
# the passphrase held in the environment variable `aep_env_var` names:
#   export SIGNAL_BACKUP_PASSPHRASE_PICARD='<your 30-digit passphrase>'
[[groups]]
id = "signal"
name = "Signal"
type = "signal"

[[steps]]
id = "signal/ingest"
command = "datalib-step run ingest signal"

# A JSONL copy of every row written, under ingest/events/, for debugging.
# Nothing reads it and it grows every run.
[steps.params.common.event_tape]
enabled = false

[steps.params.backup]
path = "~/Downloads/signal-backup"  # the folder holding the signal-backup-* snapshots
aep_env_var = "SIGNAL_BACKUP_PASSPHRASE_PICARD"  # env var holding the passphrase;
                                                 # default SIGNAL_BACKUP_PASSPHRASE

[[steps]]
id = "signal/render_markdown"
command = "datalib-step run render_markdown signal"
inputs = ["signal/ingest"]
reads = "pinned"

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "signal/embed"
command = "datalib-step run embed signal"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]

# --- slack by `api` -----------------------------------------------------

# Slack over its API, signed in through latchkey, with every option set, and
# searchable.
[[groups]]
id = "slack"
name = "Slack"
type = "slack"

[[steps]]
id = "slack/ingest"
command = "datalib-step run ingest slack"

[steps.params.common]
blob_size_limit_bytes = "1 MB"  # skip an attachment larger than this; unset is no limit

# When to give up on rate limits. The download always honours a 429's
# Retry-After and backs off; these only decide when to stop.
[steps.params.common.download_params]
maximum_time_without_progress_in_minutes = 30  # the default
maximum_sequential_failed_requests = 100       # Slack rate-limits hard; the default is 50

# A JSONL copy of every row written, under ingest/events/, for debugging.
# Nothing reads it and it grows every run.
[steps.params.common.event_tape]
enabled = false

# Which stored latchkey account to use (`latchkey auth list`). Omit it to
# use the only one.
[steps.params.latchkey_settings]
account = "enterprise"

[steps.params.api]
since = "2025-01-01"           # oldest message: a day ("2025-01-01"), an RFC 3339 instant
                               # ("2025-01-01T09:00:00-08:00"), or an offset back from each
                               # sync ("-30d", "-2w": a rolling window). Omit it for the whole
                               # history; a first sync of a big workspace then takes hours
channels = ["bridge", "engineering"]  # by name, without `#`; omit for every channel you are in
all_channels = false           # also channels you can see but are not in (ignored with `channels`)
archived = false               # also archived channels, each read once; meant with
                               # `all_channels` (Slack drops members on archive). A
                               # channel named in `channels` is mirrored either way
media = true                   # download attachments into blobs; on unless set, so a
                               # first sync fetches every file in range
dms = true                     # direct messages, 1:1 and group: off unless set
dm_conversations = ["D024BE7LH", "https://enterprise.slack.com/archives/G0ABC12DE"]
                               # only these DMs, by id or pasted link; needs `dms = true`.
                               # Unset, every DM: each is read once, then when Slack
                               # shows it open with new messages, and daily if closed
refresh_window_days = 30       # re-walk this many trailing days for edits, reactions
                               # and deletions; default 30, 0 turns it off
refresh_every_minutes = 60     # re-walk that window at most this often; default 60,
                               # 0 re-walks it on every sync
list_every_hours = 6           # re-read the user list and bookmarks at most this often;
                               # default 6, 0 re-reads them on every sync. New authors are
                               # looked up as their messages land either way
scope = "involves_me"          # walk only the channels where something involves you;
                               # default "every_conversation". DMs follow `dms` either way
involves_me = ["mention", "from_me", "broadcast"]
                               # what counts: a mention of you, your own message,
                               # @here / @channel; unset is all three
context_before = "-1d"         # walk a channel from this long before the oldest such
                               # message; default "-1d"
context_after = "+2d"          # walk only this long after each one; unset walks up to now

[[steps]]
id = "slack/render_markdown"
command = "datalib-step run render_markdown slack"
inputs = ["slack/ingest"]
reads = "pinned"

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "slack/embed"
command = "datalib-step run embed slack"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]

# --- sms_backup_restore by `backup` -------------------------------------

# Android texts and call logs from the SMS Backup & Restore app's XML
# export, with every option set, and searchable. No credentials.
[[groups]]
id = "sms_backup_restore"
name = "SMS Backup & Restore"
type = "sms_backup_restore"

[[steps]]
id = "sms_backup_restore/ingest"
command = "datalib-step run ingest sms_backup_restore"

# A JSONL copy of every row written, under ingest/events/, for debugging.
# Nothing reads it and it grows every run.
[steps.params.common.event_tape]
enabled = false

# The directory is the whole archive: every *.xml in it is read, and a
# message no backup file still holds leaves the mirror on the next sync.
[steps.params.backup]
path = "~/Downloads/sms-backup"

[[steps]]
id = "sms_backup_restore/render_markdown"
command = "datalib-step run render_markdown sms_backup_restore"
inputs = ["sms_backup_restore/ingest"]
reads = "pinned"

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "sms_backup_restore/embed"
command = "datalib-step run embed sms_backup_restore"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]

# --- todoist by `api` ---------------------------------------------------

# Your Todoist over its API, signed in through latchkey (by browser, or with
# the API token from Settings → Integrations → Developer), with every option
# set.
[[groups]]
id = "todoist"
name = "Todoist"
type = "todoist"

[[steps]]
id = "todoist/ingest"
command = "datalib-step run ingest todoist"

# When to give up on failed requests. The download retries and backs off
# on its own; these only decide when to stop.
[steps.params.common.download_params]
maximum_time_without_progress_in_minutes = 30  # the default
maximum_sequential_failed_requests = 50        # the default

# Which stored latchkey account to use (`latchkey auth list`). Omit it to
# use the only one.
[steps.params.latchkey_settings]
account = "picard@enterprise.test"

# Open tasks always come. Completed ones come too unless `completed` is
# false; `since` stops the first run's read of them at a day ("2024-01-01"),
# an RFC 3339 instant, or an offset back from each sync ("-90d"), rather
# than at the day the account joined Todoist.
[steps.params.api]
completed = true
since = "2024-01-01"

# One document per project: its sections, its tasks and their comments,
# completed tasks folded under each section. No options.
[[steps]]
id = "todoist/render_markdown"
command = "datalib-step run render_markdown todoist"
inputs = ["todoist/ingest"]
reads = "pinned"

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "todoist/embed"
command = "datalib-step run embed todoist"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]

# --- whatsapp by `backup` -----------------------------------------------

# WhatsApp from an Android end-to-end-encrypted backup, with every option
# set, and searchable. The 64-digit key is read from the environment
# variable `key_env_var` names, never from this file.
[[groups]]
id = "whatsapp"
name = "WhatsApp"
type = "whatsapp"

[[steps]]
id = "whatsapp/ingest"
command = "datalib-step run ingest whatsapp"

# The decrypted database is mirrored table for table; these pick the tables.
[steps.params]
include_tables = ["*"]                  # table-name globs to mirror (`*` and `?`); default ["*"], every table
exclude_tables = ["ai_thread_*"]        # table-name globs to skip, after include_tables; default none
exclude_columns = ["message_media.media_key"]  # `table.column` globs to drop; default none
skip_churn = true                       # leave out props, backup_changes and frequent, which change
                                        # on every backup; default true
gc = false                              # reclaim unused space in the store at the start of each run;
                                        # default false

[steps.params.backup]
path = "~/Downloads/whatsapp-backup"         # holds Databases/msgstore.db.crypt15 and Media/
key_env_var = "WHATSAPP_ENTERPRISE_PHONE_KEY"  # the variable holding the key as 64 hex digits;
                                               # default WHATSAPP_BACKUP_DECRYPTION_KEY

[[steps]]
id = "whatsapp/render_markdown"
command = "datalib-step run render_markdown whatsapp"
inputs = ["whatsapp/ingest"]
reads = "pinned"

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "whatsapp/embed"
command = "datalib-step run embed whatsapp"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]

# --- yolink by `api` ----------------------------------------------------

# YoLink sensor history, one CSV download per device, with every option
# set, and searchable by keyword. No sign-in: a device's two ids are what
# let anyone fetch its history, so keep a config that holds real ones to
# yourself. YoLink serves only about two months back, so sync often.
[[groups]]
id = "yolink"
name = "YoLink"
type = "yolink"

[[steps]]
id = "yolink/ingest"
command = "datalib-step run ingest yolink"

# When to give up on failed requests. The download retries and backs off
# on its own; these only decide when to stop.
[steps.params.common.download_params]
maximum_time_without_progress_in_minutes = 30  # the default
maximum_sequential_failed_requests = 50        # the default

[steps.params.api]
window_days = 7       # days of history asked for in one request; default 7
overlap_minutes = 5   # ask again for this many minutes before each window, for
                      # readings a sensor reported late; default 5

# One table per device. `name` keys its history, so renaming a device
# later orphans what was fetched under the old name. Quote `start`: a bare
# 2026-01-01 is a TOML date, not the string expected.
[[steps.params.api.devices]]
name = "ten_forward_freezer"
kind = "temperature_humidity"                     # or "watermeter"
start = "2026-01-01"                              # earliest day to fetch, YYYY-MM-DD
family_device_id = "0123456789abcdef0123456789abcdef"  # 32 lowercase hex digits, from the
                                                       # device's CSV download link
device_udid = "fedcba9876543210fedcba9876543210"  # 32 lowercase hex digits, the device's
                                                  # `deviceUDID` in YoLink's API

[[steps.params.api.devices]]
name = "sickbay_water_meter"
kind = "watermeter"
start = "2026-03-15"
family_device_id = "00112233445566778899aabbccddeeff"
device_udid = "ffeeddccbbaa99887766554433221100"

# The whole store renders as one page: a summary per device and a chart per
# quantity (temperature, humidity, water), every device a series.
[[steps]]
id = "yolink/render_markdown"
command = "datalib-step run render_markdown yolink"
inputs = ["yolink/ingest"]
reads = "pinned"

# Its numbers as time series, for charts and the time-series index.
[[steps]]
id = "yolink/render_time_series"
command = "datalib-step run render_time_series yolink"
inputs = ["yolink/ingest"]
reads = "pinned"
