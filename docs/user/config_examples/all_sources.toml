# Every source Datalib can mirror, one group per way in, ready to copy.
#
# GENERATED: each group below is its source's complete example stanza,
# `datalib/backend/etl/providers/<type>_config/examples/complete_<method>.toml`,
# which a test loads and plans against the source's own config structs.
# Edit those, then regenerate this file:
#
#   bazel run //datalib/backend/datalib_step:all_sources.update
#
# `datalib-step examples <type>` prints the same stanzas and the minimal
# ones, and `datalib-step help <type> <method>` lists every option.
#
# This is a reference, not a turn-key config: running it would sync every
# source at once, and most need credentials (through latchkey), a backup
# pulled off a phone, or an export on disk; `datalib-step help <type>` says
# how to sign one in or where its data comes from. Copy the groups you want:
# the index groups read every source by pattern (`*/render_markdown`).
#
# Shape: each source is a `[[groups]]` entry with a `type`, and steps whose
# `id` is `<group>/<function>`: the tree the step writes, and what another
# step's `inputs` name. Each runs `datalib-step run <function> <type>`.
# `ingest` brings the data into `<group>/ingest` (its `params` hold one
# method table, `[steps.params.api]`, `[steps.params.export]`, …, and the
# options every method shares); `render_markdown` turns that raw store into
# documents under `<group>/render_markdown`, which
# `unified_grid_and_search_index` puts in the grid and the keyword search;
# `embed` puts them in the search by meaning; a source
# whose data is also numbers over time adds `render_time_series`. `reads`
# and `locks` say what a step may run beside; the `[[programs]]` entry,
# which verbs `datalib-step` takes.
#
# TOML shape: a table header ends the table it sits in, so within a step
# the plain keys (`id`, `command`, `inputs`) come first and the params
# headers last, and `data_root` comes before the first `[[…]]` header.
#
# A group's `id` is the folder under `data_root` its data goes in, chosen
# once; its `name` is free text the app shows and can change any time.
#
# Any `*_bytes` option takes an integer of bytes or a string with a unit:
# "5 MB", "512 KiB". KB/MB/GB are ×1000, KiB/MiB/GiB ×1024.
#
# Every value here is made up. Never commit a real token, key or address.

data_root = "~/datalib"

# --- The program and the locks its steps hold ---------------------------

[[programs]]
command = "datalib-step"
verbs = ["reset", "prepare", "compact", "collect"]

[[locks]]
name = "index"
slots = 2

[[locks]]
name = "embedder"
slots = 1

# --- The indexes every source feeds -------------------------------------

# The SQL index behind the grid and search reads every source's documents
# into the grid and the keyword search; `params.not_searched` would keep a
# source out of search.
[[groups]]
id = "unified_grid_and_search_index"
name = "Grid and Search Index"

[[steps]]
id = "unified_grid_and_search_index/unified_grid_and_search_index"
command = "datalib-step run unified_grid_and_search_index"
inputs = ["*/render_markdown"]
reads = "pinned"
locks = ["index"]

# The app's search, grid and document view.
[[applets]]
group = "unified_grid_and_search_index"
id = "unified_grid_and_search_index"
command = "datalib-applet unified_grid_and_search_index"

# The contacts app: your own record of who a handle is, which the person
# chips and search read. `datalib-step help contacts-app`.
[[applets]]
group = "unified_grid_and_search_index"
id = "datalib_contacts"
command = "datalib-applet datalib_contacts"

# The time-series index reads every source's time series, without copying
# the points, for the charts.
[[groups]]
id = "unified_time_series_index"
name = "Time Series Index"

[[steps]]
id = "unified_time_series_index/time_series_index"
command = "datalib-step run time_series_index"
inputs = ["*/render_time_series"]
reads = "pinned"
locks = ["index"]

[[applets]]
group = "unified_time_series_index"
id = "unified_time_series_index"
command = "datalib-applet unified_time_series_index"

# --- airvisual by `export` ----------------------------------------------

# AirVisual Pros' own history files, read off each unit's Samba share
# (`smb://<ip>/airvisual`, mounted in the Finder) or a copy of that folder,
# with every option set, and searchable. No sign-in.
[[groups]]
id = "airvisual"
name = "AirVisual"
type = "airvisual"

[[steps]]
id = "airvisual/ingest"
command = "datalib-step run ingest airvisual"

# One entry per monitor. Every `YYYYMM_AirVisual_values.txt` under `path`
# is read, the `archive*/` folders too.
[[steps.params.export.devices]]
path = "/Volumes/airvisual"  # the mounted share, or a copy of it
serial = "NCC1701D"          # the device's serial, which keys every sample; default:
                             # read from the folder's latest_config_measurements.json
                             # (set it for a copy without that file)
name = "Bridge"              # what to call it; default: the name the device gives
                             # itself, then the serial

[[steps.params.export.devices]]
path = "~/Downloads/airvisual-export/ten-forward"

# One page with a chart per quantity (particulates, AQI, CO2, temperature,
# humidity, VOC), every device a series. No options.
[[steps]]
id = "airvisual/render_markdown"
command = "datalib-step run render_markdown airvisual"
inputs = ["airvisual/ingest"]
reads = "pinned"

# The readings as time series, for the charts.
[[steps]]
id = "airvisual/render_time_series"
command = "datalib-step run render_time_series airvisual"
inputs = ["airvisual/ingest"]
reads = "pinned"

# --- apple_messages by `messages` ---------------------------------------

# The Messages app's own database (`chat.db`), mirrored table for table, with
# every option set, and searchable. No sign-in. macOS protects
# `~/Library/Messages`: the terminal running the sync needs Full Disk Access.
[[groups]]
id = "apple_messages"
name = "Apple Messages"
type = "apple_messages"

[[steps]]
id = "apple_messages/ingest"
command = "datalib-step run ingest apple_messages"

# Which tables and columns to mirror. Globs: `*` and `?` only.
[steps.params]
include_tables = ["*"]                          # the default: every table
exclude_tables = ["recoverable_message_part"]   # skip these, after include_tables;
                                                # default none (this one is "recently deleted" text)
exclude_columns = ["message.payload_data"]      # `Table.column` globs left out entirely; default none
skip_churn = true    # leave out the app's counters, settings, Spotlight and CloudKit
                     # queues and every `index_state` column, which the daemons rewrite
                     # constantly; with it off every run commits; default true
snapshot = true      # read a `VACUUM INTO` copy, not the live file Messages keeps
                     # open; default true
gc = false           # collect unreachable chunks each run: a smaller store,
                     # history kept, but it rewrites the store; default false

# The Messages folder, or a `chat.db` file directly (a copy, or an iPhone
# backup's `3d0d7e5fb2ce288813306e4d4636395e047a3d28`, the same database).
# Prefer the folder: the snapshot also reads the `chat.db-wal` beside it.
[steps.params.messages]
path = "~/Library/Messages"

[[steps]]
id = "apple_messages/render_markdown"
command = "datalib-step run render_markdown apple_messages"
inputs = ["apple_messages/ingest"]
reads = "pinned"

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "apple_messages/embed"
command = "datalib-step run embed apple_messages"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]

# --- apple_photos by `library` ------------------------------------------

# An Apple Photos library's database (`database/Photos.sqlite`) mirrored table
# for table, with every option set. No sign-in. macOS protects the library:
# the terminal running the sync needs Full Disk Access.
[[groups]]
id = "apple_photos"
name = "Apple Photos"
type = "apple_photos"

[[steps]]
id = "apple_photos/ingest"
command = "datalib-step run ingest apple_photos"

# Which tables and columns to mirror. Globs: `*` and `?` only.
[steps.params]
include_tables = ["*"]                          # the default: every table
exclude_tables = ["ZCLOUD*"]                    # skip these, after include_tables; default none
exclude_columns = ["ZASSET.*HIGHLIGHTBEING*"]   # `Table.column` globs left out entirely; default none
skip_history = true  # leave out Core Data's change log, the daemons' work queue and
                     # counters, and every row's `Z_OPT`, which Photos rewrites
                     # constantly; with it off every run commits; default true
# Photos keys its tables on `Z_PK`, a rowid it renumbers on a library repair;
# `ZUUID` is the stable id beside it. A table with one of these columns is
# keyed on it when it is unique on every row; [] keys every table on what it
# declares. Default ["ZUUID"].
stable_key_columns = ["ZUUID"]
# Pin a table's key yourself, `table = [columns]`; an empty list mirrors the
# table with no key. Default none.
primary_keys = { ZDETECTEDFACE = ["Z_PK"] }
snapshot = true      # read a `VACUUM INTO` copy, not the live file Photos keeps
                     # open; default true
gc = false           # collect unreachable chunks each run: a smaller store,
                     # history kept, but it rewrites the store; default false

# The `.photoslibrary` bundle, or its `database/Photos.sqlite` directly.
[steps.params.library]
path = "~/Pictures/Photos Library.photoslibrary"

# Apple Photos renders no documents: query the raw store with
# `datalib-doltlite`. This step writes the storage report every source
# gets, which is what puts Apple Photos in the grid.
[[steps]]
id = "apple_photos/render_markdown"
command = "datalib-step run render_markdown apple_photos"
inputs = ["apple_photos/ingest"]
reads = "pinned"

# --- baby_connect by `api` ----------------------------------------------

# Your Baby Connect history, signed in through latchkey (by browser), with
# every option set.
[[groups]]
id = "baby_connect"
name = "Baby Connect"
type = "baby_connect"

[[steps]]
id = "baby_connect/ingest"
command = "datalib-step run ingest baby_connect"

# When to give up on failed requests. The download retries and backs off
# on its own; these only decide when to stop.
[steps.params.common.download_params]
maximum_time_without_progress_in_minutes = 30  # the default
maximum_sequential_failed_requests = 50        # the default

# Which stored latchkey account to use (`latchkey auth list`). Omit it to
# use the only one.
[steps.params.latchkey_settings]
account = "beverly@enterprise.test"

# Baby Connect answers one day at a time. `since` and `until` bound the
# days read: a day ("2368-01-01"), an RFC 3339 instant, or an offset back
# from each sync ("-90d"). Without them the read starts at the eldest
# child's birthday and ends today.
[steps.params.api]
since = "2368-01-01"
until = "2372-12-31"

# One document per child: every entry, with its notes. Baby
# Connect keeps a time as a clock reading with no zone; `time_zone` (an IANA
# name) says where the clock was, daylight saving included. Unset reads the
# times as UTC, and the Manage row says so.
[[steps]]
id = "baby_connect/render_markdown"
command = "datalib-step run render_markdown baby_connect"
inputs = ["baby_connect/ingest"]
reads = "pinned"

[steps.params]
time_zone = "America/Los_Angeles"

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "baby_connect/embed"
command = "datalib-step run embed baby_connect"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]

# --- beeper by `texts` --------------------------------------------------

# The Beeper Texts desktop app's local data, with every option set, and
# searchable. No sign-in; it reads the app's data directory.
[[groups]]
id = "beeper"
name = "Beeper"
type = "beeper"

[[steps]]
id = "beeper/ingest"
command = "datalib-step run ingest beeper"

[steps.params.texts]
path = "~/Library/Application Support/BeeperTexts"  # the app's data directory; this is
                                                    # the default on macOS
media = true         # copy the app's cached media into blobs; false keeps the
                     # attachments' names without their bytes; default true

[[steps]]
id = "beeper/render_markdown"
command = "datalib-step run render_markdown beeper"
inputs = ["beeper/ingest"]
reads = "pinned"

[steps.params]
networks = ["signal", "googlechat"]  # which networks to render; omit for every one
                                     # (the ingest mirrors them all either way)

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "beeper/embed"
command = "datalib-step run embed beeper"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]

# --- calendar by `google` -----------------------------------------------

# Google Calendar through Google's API, signed in through latchkey, with
# every option set, and searchable.
[[groups]]
id = "calendar-google"
name = "Google Calendar"
type = "calendar"

[[steps]]
id = "calendar-google/ingest"
command = "datalib-step run ingest calendar"

# When to give up on a failing server. The download always backs off and
# retries; these only decide when to stop.
[steps.params.common.download_params]
maximum_time_without_progress_in_minutes = 30  # the default
maximum_sequential_failed_requests = 50        # the default

# A JSONL copy of every row written, under ingest/events/, for debugging.
# Nothing reads it and it grows every run.
[steps.params.common.event_tape]
enabled = false

# Which stored latchkey account to use (`latchkey auth list`). Omit it to
# use the only one.
[steps.params.latchkey_settings]
account = "picard@example.com"

[steps.params.google]
calendars = ["Bridge Duty", "Away Missions"]  # names as the service shows them, or ids;
                                               # omit for every calendar. One added later
                                               # downloads whole on the next run
since = "-2d"   # first day mirrored: a day ("2024-01-01"), or days from the sync's
                # own ("-2d" moves with it); omit for all of history
until = "+21d"  # last day mirrored, included, the same way; omit for no end. With
                # either set, the calendar is listed whole every run rather than
                # resumed, and an event the window no longer reaches is dropped

[[steps]]
id = "calendar-google/render_markdown"
command = "datalib-step run render_markdown calendar"
inputs = ["calendar-google/ingest"]
reads = "pinned"

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "calendar-google/embed"
command = "datalib-step run embed calendar"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]

# Every occurrence of every event in a window of days around now, one row
# each, the way Google's `singleEvents=true` lists them, in
# render_occurrences/occurrences.doltlite_db. The window moves when the
# step runs, which is when ingest has stored something new.
[[steps]]
id = "calendar-google/render_occurrences"
command = "datalib-step run render_occurrences calendar"
inputs = ["calendar-google/ingest"]
reads = "pinned"

[steps.params]
days_back = 30    # the default
days_ahead = 400  # the default

