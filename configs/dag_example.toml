# DAG config (run with `datalib-dag`): two sources and the index.
#
# Three kinds of entry. A `[[groups]]` entry is one thing on the
# Manage screen — a source is a group with a `type`, and the unified
# index is a group without one. A `[[steps]]` entry is one process the
# runner starts. Its `id` is `<group>/<function>`: the first part names
# the group it is filed under, and the whole id is the directory the
# step writes and what another step's `inputs` name. An `[[applets]]`
# entry is a server the app runs, filed under a group for display.
#
# Every step names the program it runs, with all of its arguments, in
# `command` (see docs/dev/step_protocol.md). The runner hands it its
# `params` as JSON in `DATALIB_DAG_PARAMS` and its `inputs` in
# `DATALIB_DAG_INPUTS`, and knows nothing else about it. Datalib's own
# steps run `datalib-step run <function> [<type>]`: the function, and
# the group's `type` for a step under a source. The functions are
# `ingest` (bring the data in), `render_markdown` (turn the raw store
# into markdown), `keyword_index` and `embed` (fill the source's part
# of the qmd search index: its keyword index, then its embeddings), and
# three under the unified document index: `grid_index` over every
# render_markdown tree, `qmd_aggregator` over every source's qmd steps,
# and `embedding_map`, which lays out what the `embed` steps embedded.
# `params` is per-function — the ingest step carries the provider's
# config, with where the data comes from as one table whose name is
# read under the group's type (`api` is the product's own API;
# `export`, `backup` and the like read files and carry their own
# `path`), and the render step only render knobs (none for most
# providers; e.g. beeper's `period`, perseus's `alignment_pairs`).
#
# TOML shape: one `[[…]]` table per entry, with a step's `params` as
# `[steps.params.…]` sub-tables. A table header ends the table it sits
# in, so a step's plain keys come first and its params headers last;
# likewise `data_root` below has to precede the first `[[…]]` header.
#
# Editing a step re-runs it. The runner fingerprints each step over its
# id, `command`, `inputs`, `params` and `env`, so changing any of them
# makes the step stale even when nothing it reads has moved — widen a
# `since`, flip a render knob, and the next run rebuilds that step's
# output. An optional `code_version = "..."` covers the remaining case:
# a step whose behavior changed without its command line changing.
#
#   bazelisk build //datalib/backend:bin
#   bazel-bin/datalib/backend/bin/datalib-dag configs/dag_example.toml
#
# (`//datalib/backend:bin` stages every binary under its public
# dash-separated name in one directory — the same layout the installer
# produces. `datalib-dag` falls back to its own directory when looking
# up a step's `command`, so `datalib-step` is found with no flag. Use
# `--binary-dir DIR` only to point at binaries staged somewhere else.)
#
# data_root defaults to the directory this file lives in; set it
# explicitly for a real run. A relative one is taken from the directory
# `datalib-dag` is run in.
data_root = "~/tmp/dr-dag"

# The lowest level of datalib's own log lines every process of this
# root keeps — the server, the runner, each step: `trace`, `debug`,
# `info`, `warn` or `error`. Omitted means `trace` (the log card still
# opens at `info`); third-party crates never go below `debug`; a
# `RUST_LOG` in a process's environment wins over this.
log_level = "trace"


# The free space the data root's disk must keep. Under `pause_below`
# no step starts and running ones are stopped; they carry on once the
# disk is back to `resume_at`, and the status bar turns red meanwhile.
# Bytes, or a size with a unit: "5000 MB", "10 GB", "8 GiB". Omit the
# table for the defaults, which are these; `pause_below_bytes = 0`
# turns the floor off.
[disk_space]
pause_below_bytes = "10 GB"
resume_at_bytes = "15 GB"

# How much of the run store (`system/runs/runs.sqlite`: every run's step
# states, log lines and metrics) to keep. Both limits apply; omit the
# table for the defaults, which are these.
[run_history]
max_runs = 100
max_age_days = 30
# The app server's own log lines belong to no run and rotate faster:
# these are their limits.
process_log_days = 3
process_log_lines = 200000
# How long to keep the disk samples in `system/disk_stats.sqlite` (each
# tree's size, and the disk's free space) that the storage sparklines and
# each run's disk chart are drawn from. As long as a run is kept, so every
# run still listed keeps its chart.
disk_usage_days = 30

# ── slack ──────────────────────────────────────────────────────────
# A group has two names. Its `id` is the identity: unique, path-safe,
# and the directory every step under it writes into — so changing it
# moves data on disk and strands the paths the index recorded, which is
# a migration rather than an edit. Its `name` is what a person types and
# what every screen shows; optional, read only by the UI, and free to
# change at any moment because nothing depends on it. The `type` says
# what kind of data the group mirrors; each `datalib-step` command under
# it names it again, so the step knows which provider to run. Each step's
# id is the group's id and a word for what the step does (`ingest`
# brings the data in, `render_markdown` renders it). An optional
# `description` says what this source is to you. Like the name it is
# display text nothing depends on; search does not read it yet
# (imbue-ai/datalib#409).
[[groups]]
id = "slack"
name = "Work Slack"
type = "slack"
description = "The company Slack, mostly the infra and on-call channels."

[[steps]]
id = "slack/ingest"
command = "datalib-step run ingest slack"
[steps.params.api]
media = true
channels = ["chat-qi"]
since = "2026-06-15"

[[steps]]
id = "slack/render_markdown"
command = "datalib-step run render_markdown slack"
reads = "pinned"
inputs = ["slack/ingest"]

# A source's own part of free-text search. `keyword_index` keeps its
# collection of the qmd index in line with its render; `embed` then
# embeds what changed, and is the slow one. Either can be turned off on
# the Manage screen and synced by hand; leave both out, and out of
# `qmd_aggregator`'s inputs, to keep the source out of search.
[[steps]]
id = "slack/keyword_index"
command = "datalib-step run keyword_index slack"
reads = "files"
locks = ["qmd_keyword"]
inputs = ["slack/render_markdown"]

[[steps]]
id = "slack/embed"
command = "datalib-step run embed slack"
reads = "files"
locks = ["qmd_embed"]
inputs = ["slack/keyword_index"]

# ── claude ─────────────────────────────────────────────────────────
# Signs in through latchkey's `claude-ai` service with your browser's
# sessionKey cookie; `datalib-step help claude` says how.
[[groups]]
id = "claude"
type = "claude"

[[steps]]
id = "claude/ingest"
command = "datalib-step run ingest claude"
[steps.params.api]
conv_uuids = ["f6e7d4bb-991e-433d-91f0-e19b2c8a1e37"]

[[steps]]
id = "claude/render_markdown"
command = "datalib-step run render_markdown claude"
reads = "pinned"
inputs = ["claude/ingest"]

[[steps]]
id = "claude/keyword_index"
command = "datalib-step run keyword_index claude"
reads = "files"
locks = ["qmd_keyword"]
inputs = ["claude/render_markdown"]

[[steps]]
id = "claude/embed"
command = "datalib-step run embed claude"
reads = "files"
locks = ["qmd_embed"]
inputs = ["claude/keyword_index"]

# ── a diff group ───────────────────────────────────────────────────
# What changed in a source between two of its raw store's commits, as
# documents with the changes highlighted and grid rows with a
# `diff_status`. `type = "diff"` makes it one, and each of its commands
# names the source's type after `--source-type`; its one render step
# is `render_markdown`, reading the source's ingest tree, with the two
# commits under `params.diff` — both required, a diff is asked for and
# never keeps itself up to date. Named in the fan-ins like any source.
# The Manage screen's "Compare…" writes one; see
# docs/dev/plans/completed/diff_renderer.md.
[[groups]]
id = "slack-diff"
name = "Work Slack, this week's changes"
type = "diff"

[[steps]]
id = "slack-diff/render_markdown"
command = "datalib-step run render_markdown diff --source-type slack"
reads = "pinned"
inputs = ["slack/ingest"]
[steps.params.diff]
from = "8f1c2b0d7e6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c"
to = "3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c"
# The most documents a side may render before the step fails instead —
# a diff a person expected to be small and is not. Default 1000.
max_documents = 200

[[steps]]
id = "slack-diff/keyword_index"
command = "datalib-step run keyword_index diff --source-type slack"
reads = "files"
locks = ["qmd_keyword"]
inputs = ["slack-diff/render_markdown"]

[[steps]]
id = "slack-diff/embed"
command = "datalib-step run embed diff --source-type slack"
reads = "files"
locks = ["qmd_embed"]
inputs = ["slack-diff/keyword_index"]

# ── locks ──────────────────────────────────────────────────────────
# What keeps steps apart beyond the trees they write and read. The
# runner has two budgets, `network` (4 slots) and `cpu` (4), and a step
# that names no lock holds one of them: `network` if it reads nothing
# (a download), `cpu` if it does. Any other lock is declared here and
# named on the steps that hold it. The qmd steps all write one index
# file, so they hold a lock of one slot: `qmd_keyword`
# (`qmd_aggregator`, every `keyword_index`) or `qmd_embed` (every
# `embed`). The fan-ins that read every source hold `index`, so two of
# them at most run at once. Declare a budget to resize it, or add your
# own:
#
#   [[locks]]
#   name = "slack-api"   # two sources on one workspace's rate limit
#   slots = 1            # at most this many hold it at once; 1 is a mutex
#
#   locks = ["slack-api"]                 # on a step: one slot
#   locks = { slack-api = "exclusive" }   # or every slot, alone
[[locks]]
name = "qmd_keyword"
slots = 1

[[locks]]
name = "qmd_embed"
slots = 1

[[locks]]
name = "index"
slots = 2

# A step that reads its inputs at a pinned commit says
# `reads = "pinned"`, and may run while a writer of them does; one that
# reads their files off disk leaves it out or says `reads = "files"`,
# and no writer of them runs beside it.
# A step that would rather not run at every seal of a download that
# streams says `start = "after_inputs_settle"`: it waits until nothing
# upstream of it is running or due, then runs once, and holds no writer
# back while it does. None of these changes a step's fingerprint: they
# say when it may run, not what it makes. See
# datalib/backend/dag/README.md, "What keeps steps apart".

# ── shared fan-in steps ────────────────────────────────────────────
# `inputs` names the steps these read, by id. Adding a source
# above means adding its steps' ids here too — the wizard does that for
# you; a hand-edit has to remember, and the Pipeline table flags a
# render step nothing consumes. The group has no `type`: it mirrors
# nothing, it indexes what the others mirrored. `qmd_aggregator` runs
# after every source's qmd steps: it retires the collection of any
# source it does not name, and reports what the index holds. Removing it
# turns free-text search off.
[[groups]]
id = "unified_document_index"

[[steps]]
id = "unified_document_index/grid_index"
command = "datalib-step run grid_index"
reads = "pinned"
locks = ["index"]
inputs = ["slack/render_markdown", "claude/render_markdown", "slack-diff/render_markdown"]

[[steps]]
id = "unified_document_index/qmd_aggregator"
command = "datalib-step run qmd_aggregator"
reads = "pinned"
locks = ["qmd_keyword"]
inputs = ["slack/keyword_index", "slack/embed", "claude/keyword_index", "claude/embed", "slack-diff/keyword_index", "slack-diff/embed"]

# qmd's document embeddings laid out on a plane by UMAP, for the map
# card (`umapView()`). It reads the vectors every source's `embed` wrote,
# so it runs after the aggregator, which runs after them. Each run starts from the last map, so
# documents stay put as more arrive; resetting the step lays the map out
# afresh.
[[steps]]
id = "unified_document_index/embedding_map"
command = "datalib-step run embedding_map"
reads = "files"
locks = ["index"]
inputs = ["unified_document_index/qmd_aggregator"]

# ── applets ────────────────────────────────────────────────────────
# An applet is the third kind of config entry: a long-lived server the
# http gateway starts with itself, contributing both card components and
# the endpoints behind them. It declares no inputs because it is never
# scheduled — it reads what the steps above already wrote.
#
# `id` is the mount prefix (`/applet/<id>/`) *and* the name card source
# calls, so it must be a JavaScript identifier, and it is not composed
# from the group. `group` only says which row the Manage screen shows
# it under. There is no `title` key: the label the component gallery
# shows is written by the applet itself, from its own `params` —
# `workspace` below, for this one.
#
# The entry below serves the `slack` source rendered above. Starting
# this applet wipes `system/frontend/slack_view/` and asks the command
# to rewrite it; what lands there — one `<sha256>.js` and one
# `<name>.json` — is what defines `comp.slack_view.channels` and its
# gallery row.
#
# A second Slack download (its own download + render steps) would get a
# second applet entry over that tree. The two would write *identical*
# component code — same bytes, same hash, one URL in the browser — and
# differ only in the argument their metadata carries, so each row calls
# the shared component against its own backend.
#
# See docs/dev/applets.md for the contract a command has to honor. Note
# that `user` is not available as an id: it names the namespace for
# hand-written components, which a refresh never touches.
[[applets]]
group = "slack"
id = "slack_view"
command = "datalib-applet slack"
[applets.params]
tree = "slack/render_markdown"
workspace = "Slack"

# The app's own surface: `unified_document_index` serves the grid, the document
# view and the document picker. Without it the UI has no search — it is
# an applet rather than a built-in so the backend does not have to know
# what a grid row is.
[[applets]]
group = "unified_document_index"
id = "unified_document_index"
command = "datalib-applet unified_document_index"

# The contacts app: your own record of who a handle is, which the person
# chips and search read. `datalib-step help contacts-app`.
[[applets]]
group = "unified_document_index"
id = "datalib_contacts"
command = "datalib-applet datalib_contacts"

