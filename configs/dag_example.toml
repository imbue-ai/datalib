# DAG config (run with `datalib-dag`), equivalent to the retired
# stanza config:
#
#   sources:
#     - name: slack
#       source:
#         type: slack_api
#         sync: {media: true, channels: ["chat-qi"], since: "2026-06-15"}
#     - name: claude
#       source:
#         type: claude_api
#         sync: {conv_uuids: ["f6e7d4bb-991e-433d-91f0-e19b2c8a1e37"]}
#
# Three kinds of entry. A `[[groups]]` entry is one thing on the
# Manage screen — a source is a group with a `type`, and the unified
# index is a group without one. A `[[steps]]` entry is `group` +
# `function`: what it does within its group. Its id is composed as
# `<group>/<function>` and never written; that id is the directory the
# step writes, and what another step's `inputs` name. An `[[applets]]`
# entry is a server the app spawns, filed under a group for display.
#
# Each step is an arbitrary `command` (see docs/dev/step_protocol.md);
# the runner appends `params` and `inputs` as `--params` / `--inputs`
# JSON flags and passes the composed id, the group, its type and the
# function in the environment. For the built-in `datalib-step`
# commands, download and render take the provider as a nested
# subcommand, and `params` is per-phase — the download step carries
# the provider's download config, the render step only render knobs
# (none for most providers; e.g. beeper's `period`, perseus's
# `alignment_pairs`). The `grid_index` and `qmd_index` steps are
# source-independent fan-ins over every rendered_md tree.
#
# TOML shape: one `[[…]]` table per entry, with a step's `params` as
# `[steps.params.…]` sub-tables. A table header ends the table it sits
# in, so a step's plain keys come first and its params headers last;
# likewise `data_root` below has to precede the first `[[…]]` header.
#
# Editing a step re-runs it. The runner fingerprints each step over its
# command, `params`, `env` and declared paths, so changing any of them
# makes the step stale even when nothing it reads has moved — widen a
# `since`, flip a render knob, and the next run rebuilds that step's
# output. An optional `code_version = "..."` covers the remaining case:
# a step whose behavior changed without its command line changing.
#
#   bazelisk build //datalib/backend:bin
#   bazel-bin/datalib/backend/bin/datalib-dag configs/dag_example.toml
#
# (`//datalib/backend:bin` stages every binary under its public
# dash-separated name in one directory — the same layout the installer
# produces. `datalib-dag` falls back to its own directory when looking
# up a step's `command`, so `datalib-step` is found with no flag. Use
# `--binary-dir DIR` only to point at binaries staged somewhere else.)
#
# data_root defaults to the directory this file lives in; set it
# explicitly for a real run.
data_root = "~/tmp/dr-dag"

# ── slack ──────────────────────────────────────────────────────────
# A group has two names. Its `id` is the identity: unique, path-safe,
# and the directory every step under it writes into — so changing it
# moves data on disk and strands the paths the index recorded, which is
# a migration rather than an edit. Its `name` is what a person types and
# what every screen shows; optional, read only by the UI, and free to
# change at any moment because nothing depends on it. The `type` says
# what kind of data the group mirrors; the steps under it are named for
# what they do (`raw` fetches, `rendered_md` renders), and their ids are
# composed from the two.
[[groups]]
id = "slack"
name = "Work Slack"
type = "slack_api"

[[steps]]
group = "slack"
function = "raw"
command = "datalib-step download slack_api"
[steps.params.sync]
media = true
channels = ["chat-qi"]
since = "2026-06-15"

[[steps]]
group = "slack"
function = "rendered_md"
command = "datalib-step render slack_api"
inputs = ["slack/raw"]

# ── claude ─────────────────────────────────────────────────────────
# Prerequisite (one-time): register claude.ai with latchkey and
# supply your sessionKey cookie (DevTools → Application → Cookies):
#   npx -y latchkey services register claude-ai --base-api-url="https://claude.ai/"
#   npx -y latchkey auth set claude-ai -H "Cookie: sessionKey=$(pbpaste)"
# See docs/user/getting_your_data.md for the full walkthrough.
[[groups]]
id = "claude"
type = "claude_api"

[[steps]]
group = "claude"
function = "raw"
command = "datalib-step download claude_api"
[steps.params.sync]
conv_uuids = ["f6e7d4bb-991e-433d-91f0-e19b2c8a1e37"]

[[steps]]
group = "claude"
function = "rendered_md"
command = "datalib-step render claude_api"
inputs = ["claude/raw"]

# ── shared fan-in steps ────────────────────────────────────────────
# `inputs` names the steps these read, by composed id. Adding a source
# above means adding its render step's id here too — the wizard does
# that for you; a hand-edit has to remember, and the Pipeline table
# flags a render step nothing consumes. The group has no `type`: it
# mirrors nothing, it indexes what the others mirrored.
[[groups]]
id = "unified_index"

[[steps]]
group = "unified_index"
function = "grid"
command = "datalib-step grid_index"
inputs = ["slack/rendered_md", "claude/rendered_md"]

[[steps]]
group = "unified_index"
function = "qmd"
command = "datalib-step qmd_index"
inputs = ["slack/rendered_md", "claude/rendered_md"]

# ── applets ────────────────────────────────────────────────────────
# An applet is the third kind of config entry: a long-lived server the
# http gateway spawns on demand, contributing both card components and
# the endpoints behind them. It declares no inputs because it is never
# scheduled — it reads what the steps above already wrote.
#
# `id` is the mount prefix (`/applet/<id>/`) *and* the name card source
# calls, so it must be a JavaScript identifier, and it is not composed
# from the group. `group` only says which row the Manage screen shows
# it under. There is no `title` key: the label the component gallery
# shows is written by the applet itself, from its own `params` —
# `workspace` below, for this one.
#
# The entry below serves the `slack` source rendered above. Starting
# this applet wipes `system/frontend/slack_view/` and asks the command
# to rewrite it; what lands there — one `<sha256>.js` and one
# `<name>.json` — is what defines `comp.slack_view.channels` and its
# gallery row.
#
# A second Slack download (its own download + render steps) would get a
# second applet entry over that tree. The two would write *identical*
# component code — same bytes, same hash, one URL in the browser — and
# differ only in the argument their metadata carries, so each row calls
# the shared component against its own backend.
#
# See docs/dev/applets.md for the contract a command has to honor. Note
# that `user` is not available as an id: it names the namespace for
# hand-written components, which a refresh never touches.
[[applets]]
group = "slack"
id = "slack_view"
command = "datalib-applet slack"
[applets.params]
tree = "slack/rendered_md"
workspace = "Slack"

# The app's own surface: `unified_index` serves the grid, the document
# view and the document picker. Without it the UI has no search — it is
# an applet rather than a built-in so the backend does not have to know
# what a grid row is.
[[applets]]
group = "unified_index"
id = "unified_index"
command = "datalib-applet unified_index"
