[project]
name = "datalib"
version = "0.1.0"
description = "Tooling environment for schema codegen + lint of datalib"
authors = [
    { name = "Thad Hughes", email = "thad@imbue.com" }
]
requires-python = ">=3.13"
# Runtime is now Rust under datalib/backend/. Python is kept only
# for schema codegen and host-side lint/typecheck.
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pyright>=1.1.400",
]

[tool.ruff]
# Vendored subtrees are upstream-owned; lint them in their own repo, not
# ours. Mirrors the [tool.pyright] `exclude` below.
extend-exclude = ["third-party"]

[tool.pyright]
# `include` used to be ["schemas"], a directory that no longer exists —
# schema codegen moved to Rust and took the tree with it. pyright printed
# `File or directory "schemas" does not exist` and then exited 0, so the
# typecheck gate passed vacuously on zero files while these six real
# first-party scripts went unchecked. Pointing it at them is the fix.
#
# Keep in sync with `//:python_sources`, which is the Bazel-side list of
# the same files; `scripts/lint_repo.py` fails if the two drift.
include = [
    "scripts",
    "tests/fixtures",
    "tools",
]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/bazel-*",
    "**/node_modules",
    "**/dist",
    "**/target",
    "datalib",
    "third-party",
]
# No `venvPath` / `venv`. `[project] dependencies` is empty and every one
# of these files imports stdlib only, so pyright needs nothing but its
# bundled typeshed — and pointing it at `.venv` would break
# `//tools/lint:pyright_test`, which runs in a sandbox that has no such
# directory.
pythonVersion = "3.13"
