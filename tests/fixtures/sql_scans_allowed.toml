[[scan]]
statement = "DELETE FROM runs WHERE run_id NOT IN (SELECT run_id FROM runs ORDER BY started_at_utc DESC LIMIT ?) RETURNING run_id"
files = ["*/runs/runs.sqlite"]
why = "The table stays small: retention keeps at most `max_runs` runs (100 by default) and none older than `max_age_days`; this is retention itself, once per run. It returns the runs it removes, so the tables filed under them delete through their `run_id` index."

[[scan]]
statement = "DELETE FROM runs WHERE started_at_utc < ? AND run_id != ? RETURNING run_id"
files = ["*/runs/runs.sqlite"]
why = "The table stays small: retention keeps at most `max_runs` runs (100 by default) and none older than `max_age_days`; this is retention itself, once per run. It returns the runs it removes, so the tables filed under them delete through their `run_id` index."

