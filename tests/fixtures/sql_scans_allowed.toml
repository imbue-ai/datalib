# Every statement the TNG fixture sync runs whose plan walks a whole table
# or index, other than reads of the catalog alone, and why that is allowed.
# sql_scans_test.py checks the sync's list (ingested/sql_scans.jsonl) against
# this file. A new scan fails it until the statement gets an index or an
# entry here with a reason, and an entry whose statement no longer runs or
# no longer scans fails it until the entry goes (docs/dev/testing.md).
#
# On a fixture a scan costs nothing; on a library it costs the whole table,
# every time the statement runs. A reason says why that is fine: the
# statement reads every row anyway, or the table stays small. The entries
# marked "Not reviewed" were here when the check began.

[[scan]]
statement = "SELECT run_id, started_at_utc, finished_at_utc, tz_offset, kind, reason FROM runs WHERE ? IS NULL OR run_id = ? ORDER BY started_at_utc DESC LIMIT 1"
files = ["*/runs/runs.sqlite"]
why = "The table stays small: retention keeps at most `max_runs` runs (100 by default) and none older than `max_age_days` (datalib_runs::Retention); 76 rows on a large library. #1949 reads it by an index instead."

