[package]
name = "datalib-tauri"
version = "0.10.0"
edition = "2021"
rust-version = "1.83"
publish = false

# Standalone workspace, deliberately NOT a member of datalib/backend's
# workspace: Bazel's crate_universe (`crate.from_cargo` in MODULE.bazel)
# ingests that workspace, and the tauri dependency tree is cargo-only.
# This crate is driven by `cargo tauri` / `pnpm dlx @tauri-apps/cli`, not
# Bazel — see README.md.
#
# The crate is a thin process manager: it spawns the Bazel-built
# `datalib-http` binary (bundled under Resources/binaries/) rather
# than linking the backend in, so there are NO path deps into
# datalib/backend and no sqlx/doltlite/rust-embed plumbing here.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# `reveal_item_in_dir` — selects a file in Finder / Explorer / the
# platform file manager. Backs the grid's "Reveal in Finder" action for
# rows whose `source_url` is a `file://` URL (today: the `pdf` source).
# Only the reveal command is granted to the webview; see
# `capabilities/reveal-local-files.json` for why that matters.
tauri-plugin-opener = "2"
anyhow = "1.0"
