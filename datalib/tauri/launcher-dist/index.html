<!doctype html>
<!--
  The libraries screen: what the desktop app shows when no library is
  open — at launch without a data root, and from the app's top bar
  ("Data Liberation ✊", or the library menu's "All libraries").

  It lists the libraries, each with what the server last wrote down
  about it (sources, size, last sync), and makes a new one from a name
  or a folder. A plain name is a library in ~/Documents/Datalib, and
  the first one's name is filled in for you.

  This is the ONLY page the shell bundles. Once a library is chosen the
  same window loads the spawned `datalib-http`'s page, which serves the
  real (rust-embed'd Vue) UI, and closing the library brings the window
  back here — see src/main.rs.

  Every decision here is in `src/launcher.rs` (which libraries are
  listed, where a new one goes, what is already at that folder), which
  is unit-tested by //datalib/tauri:launcher_test. This file is
  presentation: it asks for state, renders it, and invokes one command
  per action. Its colours are the app's (`ui/src/theme.css`).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Data Liberation</title>
    <style>
      :root {
        color-scheme: light dark;
        --ground: #ececee;
        --surface: #ffffff;
        --fg: #1d1d1f;
        --muted: #55555a;
        --faint: #6e6e73;
        --border: #d0d0d5;
        --border-soft: #e3e3e6;
        --row-line: #ededf0;
        --hover: #f2f2f5;
        --accent: #1f5fd1;
        --on-accent: #ffffff;
        --accent-soft: #e8effb;
        --warn-fg: #8a4a00;
        --error-fg: #b42318;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #1c1c1e;
          --surface: #2a2a2d;
          --fg: #ececf0;
          --muted: #b0b0b8;
          --faint: #9a9aa2;
          --border: #45454b;
          --border-soft: #3a3a3f;
          --row-line: #36363b;
          --hover: #333337;
          --accent: #6ea0f5;
          --on-accent: #0d1b33;
          --accent-soft: #233552;
          --warn-fg: #f0b366;
          --error-fg: #ff8a80;
        }
      }
      /* The rules below set `display`, which would otherwise win over
         the `hidden` attribute the script toggles. */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ground);
        color: var(--fg);
        font-family: var(--font);
        font-size: 14px;
      }
      .bar {
        height: 40px;
        display: flex;
        align-items: center;
        padding: 0 16px 0 92px;
        font-weight: 600;
        font-size: 13px;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        display: flex;
        justify-content: center;
        padding: 48px 24px;
      }
      .page {
        width: 680px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .head {
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: 12px;
      }
      .head .titles {
        flex: 1 1 auto;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .btn {
        height: 36px;
        padding: 0 16px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--fg);
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        background: var(--hover);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      .primary:hover:not(:disabled) {
        background: color-mix(in srgb, var(--accent) 85%, black);
      }
      .small {
        height: 30px;
        padding: 0 12px;
        font-size: 13px;
      }
      .link {
        border: none;
        background: none;
        padding: 0;
        color: var(--accent);
        font-size: inherit;
      }
      .link:hover {
        text-decoration: underline;
      }
      code {
        font-family: var(--mono);
        font-size: 12px;
      }
      .error {
        margin: 0;
        color: var(--error-fg);
      }

      /* The list. */
      .list {
        background: var(--surface);
        border: 1px solid var(--border-soft);
        border-radius: 10px;
        overflow: hidden;
      }
      /* A row is the library (a button that opens it, or the same
         content when its folder is gone) and, for a library outside the
         Datalib folder, a Forget button beside it: two controls side by
         side, since a button cannot hold another. */
      .lib {
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--row-line);
      }
      .lib:last-child {
        border-bottom: none;
      }
      .lib:not(.missing):hover {
        background: var(--hover);
      }
      .lib-open {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border: none;
        background: none;
        color: inherit;
        text-align: left;
      }
      .forget,
      .folder {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 6px;
        background: none;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Every row has the slot, so the folder icons line up; a library
         in the Datalib folder leaves it empty. */
      .forget {
        margin-right: 2px;
      }
      button.forget:hover,
      .folder:hover:not(:disabled) {
        background: var(--border-soft);
        color: var(--fg);
      }
      .folder {
        margin-right: 12px;
      }
      .folder:disabled {
        visibility: hidden;
      }
      .icon {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lib .name {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .lib .name strong {
        font-size: 15px;
      }
      .lib .name code {
        color: var(--faint);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lib .facts {
        font-size: 12px;
        color: var(--muted);
        text-align: right;
        line-height: 1.5;
        white-space: nowrap;
      }
      .lib.missing .icon {
        background: var(--hover);
        color: var(--faint);
      }
      .lib.missing strong {
        color: var(--faint);
      }
      .lib.missing .facts {
        color: var(--warn-fg);
      }
      .legacy {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 10px;
        border: 1px solid var(--accent);
        background: var(--accent-soft);
        font-size: 13px;
        line-height: 1.5;
      }
      .legacy .what {
        flex: 1 1 auto;
      }
      .empty {
        height: 120px;
        border: 1.5px dashed var(--border);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--faint);
        font-size: 13px;
      }

      /* The new-library popover, under its button. */
      .pop {
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        width: 400px;
        z-index: 2;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .pop label {
        font-size: 13px;
        font-weight: 600;
      }
      .pop input {
        height: 32px;
        box-sizing: border-box;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 10px;
        font: inherit;
        background: var(--surface);
        color: var(--fg);
      }
      .pop input:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
        outline-offset: -1px;
      }
      .where {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .where .what {
        flex: 1 1 auto;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .where .link {
        white-space: nowrap;
      }
      .where .what code {
        color: var(--fg);
      }
      .where.bad .what {
        color: var(--warn-fg);
      }
      .pop .primary {
        height: 32px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="bar" data-tauri-drag-region>Data Liberation ✊</div>
    <main>
      <div class="page">
        <div class="head">
          <div class="titles">
            <h1>Your libraries</h1>
          </div>
          <button class="btn" id="pick">Open a folder…</button>
          <button class="btn primary" id="new" aria-expanded="false" aria-controls="pop">
            New library
          </button>
          <div class="pop" id="pop" role="dialog" aria-label="New library" hidden>
            <label for="name">Name or path of folder</label>
            <input id="name" autocomplete="off" spellcheck="false" />
            <div class="where" id="where">
              <span class="what" id="what"></span>
              <button class="link" id="choose">Create elsewhere…</button>
            </div>
            <button class="btn primary" id="create">Create and open</button>
          </div>
        </div>
        <p class="error" id="error" role="alert" hidden></p>
        <!-- TODO(after 2026-11-01): remove with launcher::move_legacy. -->
        <div class="legacy" id="legacy" hidden>
          <span class="what" id="legacy-what"></span>
          <button class="btn primary small" id="legacy-move">Move it</button>
        </div>
        <div class="list" id="list" hidden></div>
        <div class="empty" id="empty" hidden>Your libraries will be listed here.</div>
      </div>
    </main>

    <script>
      // `withGlobalTauri` (tauri.conf.json) is what puts this here; the
      // launcher has no bundler and no module graph.
      const invoke = window.__TAURI__.core.invoke;
      const $ = (id) => document.getElementById(id);

      const BOOK =
        '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>';

      const CROSS =
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      const FOLDER =
        '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

      function fail(e) {
        $("error").textContent = String((e && e.message) || e);
        $("error").hidden = false;
        setBusy(false);
      }

      // Every way out of this screen starts a server and loads it in
      // this window, so a second click while that is in flight would
      // start a second one.
      let busy = false;
      function setBusy(on) {
        busy = on;
        for (const b of document.querySelectorAll("button")) b.disabled = on;
        if (!on) void resolveField();
      }

      async function run(command, args) {
        setBusy(true);
        $("error").hidden = true;
        try {
          // On success the shell loads the library here; nothing to do.
          // `false` means nothing is opening: a canceled picker.
          if ((await invoke(command, args)) === false) setBusy(false);
        } catch (e) {
          fail(e);
        }
      }

      function formatBytes(n) {
        const units = ["B", "KB", "MB", "GB", "TB"];
        let i = 0;
        while (n >= 1000 && i < units.length - 1) {
          n /= 1000;
          i++;
        }
        return `${n < 10 && i > 0 ? n.toFixed(1) : Math.round(n)} ${units[i]}`;
      }

      function ago(iso) {
        const t = Date.parse(iso);
        if (!Number.isFinite(t)) return "";
        const s = Math.max(0, (Date.now() - t) / 1000);
        if (s < 90) return "just now";
        const m = s / 60;
        if (m < 60) return `${Math.round(m)} minutes ago`;
        const h = m / 60;
        if (h < 36) return `${Math.round(h)} hour${Math.round(h) === 1 ? "" : "s"} ago`;
        const d = h / 24;
        return `${Math.round(d)} days ago`;
      }

      function facts(summary) {
        if (!summary) return [];
        const n = summary.sources;
        const lines = [`${n} source${n === 1 ? "" : "s"} · ${formatBytes(summary.bytes)}`];
        lines.push(summary.last_synced_at ? `synced ${ago(summary.last_synced_at)}` : "never synced");
        return lines;
      }

      function libraryRow(lib) {
        const row = document.createElement("div");
        row.className = "lib" + (lib.found ? "" : " missing");
        const open = document.createElement(lib.found ? "button" : "div");
        open.className = "lib-open";
        const icon = document.createElement("span");
        icon.className = "icon";
        icon.innerHTML = BOOK;
        const name = document.createElement("span");
        name.className = "name";
        const strong = document.createElement("strong");
        strong.textContent = lib.name;
        name.append(strong);
        if (lib.shown_path) {
          const path = document.createElement("code");
          path.textContent = lib.shown_path;
          name.append(path);
        }
        const right = document.createElement("span");
        right.className = "facts";
        const lines = lib.found ? facts(lib.summary) : ["Not found.", "Is its drive connected?"];
        lines.forEach((l, i) => {
          if (i) right.append(document.createElement("br"));
          right.append(l);
        });
        open.append(icon, name, right);
        if (lib.found) {
          open.addEventListener("click", () => run("launcher_open", { path: lib.path }));
        }
        row.append(open);
        if (lib.forgettable) {
          const forget = document.createElement("button");
          forget.className = "forget";
          forget.innerHTML = CROSS;
          forget.title = "Forget (the folder stays)";
          forget.setAttribute("aria-label", `Forget ${lib.name}`);
          forget.addEventListener("click", async () => {
            try {
              await invoke("launcher_forget", { path: lib.path });
              await render();
            } catch (e) {
              fail(e);
            }
          });
          row.append(forget);
        } else {
          const slot = document.createElement("span");
          slot.className = "forget";
          slot.setAttribute("aria-hidden", "true");
          row.append(slot);
        }
        const folder = document.createElement("button");
        folder.className = "folder";
        folder.innerHTML = FOLDER;
        folder.title = "Open the folder in Finder";
        folder.setAttribute("aria-label", `Open ${lib.name}'s folder`);
        // A folder that is gone has nothing to open; the button keeps its
        // place so the columns line up.
        folder.disabled = !lib.found;
        folder.addEventListener("click", async () => {
          try {
            await invoke("launcher_open_folder", { path: lib.path });
          } catch (e) {
            fail(e);
          }
        });
        row.append(folder);
        return row;
      }

      // ---- the new-library popover ----

      let resolved = null;
      async function resolveField() {
        const input = $("name").value;
        let r = null;
        try {
          r = await invoke("launcher_resolve", { input });
        } catch (e) {
          fail(e);
          return;
        }
        if ($("name").value !== input) return; // typed on since
        resolved = r;
        const what = $("what");
        const where = $("where");
        what.textContent = "";
        where.classList.remove("bad");
        const code = (t) => {
          const c = document.createElement("code");
          c.textContent = t;
          return c;
        };
        let ok = false;
        if (!r) {
          what.append("Type a name, or a folder.");
        } else if (r.target === "new") {
          what.append("Creates ", code(r.shown_path));
          ok = true;
        } else if (r.target === "library") {
          what.append(code(r.shown_path), " is already a library. ");
          const open = document.createElement("button");
          open.className = "link";
          open.textContent = "Open it";
          open.addEventListener("click", () => run("launcher_open", { path: r.path }));
          what.append(open);
          where.classList.add("bad");
        } else if (r.target === "inside_legacy") {
          what.append("Move your library into Default first.");
          where.classList.add("bad");
        } else if (r.target === "occupied") {
          what.append(code(r.shown_path), " has other files in it.");
          where.classList.add("bad");
        } else {
          what.append(code(r.shown_path), " is a file, not a folder.");
          where.classList.add("bad");
        }
        $("create").disabled = busy || !ok;
      }

      function setPopover(open) {
        $("pop").hidden = !open;
        $("new").setAttribute("aria-expanded", String(open));
        if (open) {
          void resolveField();
          $("name").focus();
          $("name").select();
        }
      }

      $("new").addEventListener("click", () => setPopover($("pop").hidden));
      $("name").addEventListener("input", () => void resolveField());
      $("name").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !$("create").disabled) $("create").click();
        if (e.key === "Escape") setPopover(false);
      });
      $("choose").addEventListener("click", async () => {
        try {
          const chosen = await invoke("launcher_choose_folder");
          if (chosen) {
            $("name").value = chosen;
            await resolveField();
          }
        } catch (e) {
          fail(e);
        }
      });
      $("create").addEventListener("click", () =>
        run("launcher_create", { input: $("name").value }),
      );
      document.addEventListener("mousedown", (e) => {
        if ($("pop").hidden) return;
        if (!$("pop").contains(e.target) && e.target !== $("new")) setPopover(false);
      });
      $("pick").addEventListener("click", () => run("launcher_pick"));
      $("legacy-move").addEventListener("click", async () => {
        setBusy(true);
        $("error").hidden = true;
        try {
          await invoke("launcher_move_legacy");
          $("name").value = "";
          await render();
        } catch (e) {
          fail(e);
          return;
        }
        setBusy(false);
      });

      async function render() {
        const state = await invoke("launcher_state");
        const list = $("list");
        list.replaceChildren(...state.libraries.map(libraryRow));
        const none = state.libraries.length === 0;
        list.hidden = none;
        $("empty").hidden = !none;
        if (!$("name").value) $("name").value = state.suggested_name;
        const legacy = state.legacy;
        $("legacy").hidden = !legacy;
        if (legacy) {
          const code = (t) => {
            const c = document.createElement("code");
            c.textContent = t;
            return c;
          };
          $("legacy-what").replaceChildren(
            "Libraries now each have their own folder. Move yours from ",
            code(legacy.shown_path),
            " to ",
            code(legacy.target),
            "? Close anything else using it first.",
          );
        }
        // The first time, the one thing to do is make a library.
        if (none) setPopover(true);
      }

      render().catch(fail);
    </script>
  </body>
</html>
