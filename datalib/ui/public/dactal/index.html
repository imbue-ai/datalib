<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>DACTAL × Datalib — prototype</title>
<!--
  Content-Security-Policy — issue #138, mitigation 4.

  The vendored engine carries live remote-code-loading paths back to
  dactal.org: `dactal_ai_init()` (dactal_utils.js:325) and `loadscript()`
  (:381) inject <script src="https://dactal.org/…">, and
  `loadscript_namespaced()` (:393) fetches from there and runs the text
  through `new Function`. Nothing in Datalib calls them today — they are
  dormant, not active — but they are one call away, and a future dataset
  or a refresh of the vendored snapshot could wake them. Reaching out at
  *runtime* also defeats the point of pinning a snapshot: it would run
  whatever dactal.org serves today, with no SRI and no pin.

  `script-src 'self'` kills the two script-tag paths and `connect-src
  'self'` kills the fetch, so all three fail closed permanently. Doing it
  here rather than by editing vendor/ keeps the "unmodified pinned
  copies" property vendor/PROVENANCE.md depends on.

  Why each escape hatch is present:
    'unsafe-eval'  — load-bearing. The query language evaluates
                     expressions through `eval` (dactal.js:2052) and
                     `new Function`; without it the engine cannot run.
    style-src      — 'unsafe-inline' is needed for the <style> block
                     below, for the `dactal_css` <style> that main.js
                     injects, and for the inline style= attributes the
                     vendored renderer emits. Inline *style* is not an
                     code-execution vector the way inline script is.
    img-src data:  — renderers emit data: URIs for inline images.
  The page's own script is in main.js precisely so that `script-src`
  need not allow 'unsafe-inline' — do not move it back inline.

  Note this is a <meta> CSP, so `frame-ancestors` would be ignored here
  (it is header-only). That is fine: the API token gate already stops a
  cross-site page from loading this page at all — no cookie, no 401-free
  response. A <meta> policy is used anyway so dev (vite serves public/)
  and prod (the embedded server) get identical behavior from one place.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-eval';
  connect-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self';
  media-src 'self' data:;
  base-uri 'none';
  form-action 'none';
" />
<!--
  DACTAL ships as classic (non-module) scripts that attach to globals:
    - dactal.js                 -> `window.DACTAL` (the engine: parse/execute/load)
    - dactal_storage_indexeddb.js -> `DACTALdb` (IndexedDB persistence wrapper)
    - dactal_utils.js           -> the table UI: buildView/arrayToTable/render,
                                   the `renderers` registry, and `dactal_css`.
  We reuse the ENGINE and the RENDERER, but NOT DACTAL's full host page
  (its query page, saved-query store, AI assist, adapters). Instead we wire
  a tiny query bar to `dactal.executeq()` + `buildView()` ourselves, and pull
  the working set from Datalib's own `/applet/unified_index/search`.
-->
<script src="./vendor/dactal.js"></script>
<script src="./vendor/dactal_storage_indexeddb.js"></script>
<script src="./vendor/dactal_utils.js"></script>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; color: #1a1a1a; }
  header { padding: 10px 14px; border-bottom: 1px solid #ddd; background: #fafafa; }
  header h1 { font-size: 15px; margin: 0 0 8px; }
  .bar { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .bar label { width: 92px; color: #666; font-size: 12px; text-align: right; }
  .bar input { flex: 1; font: inherit; padding: 5px 7px; border: 1px solid #bbb; border-radius: 4px; }
  .bar input#dq { font-family: ui-monospace, monospace; }
  .bar button { padding: 5px 10px; }
  .chips { margin: 6px 0 2px 98px; }
  .chip { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 7px; background: #eef;
          border: 1px solid #ccd; border-radius: 10px; cursor: pointer; font-family: ui-monospace, monospace; font-size: 12px; }
  .chip:hover { background: #dde; }
  #status { color: #777; font-size: 12px; margin: 4px 0 0 98px; min-height: 16px; }
  #crumbs { margin: 8px 14px 0; font-family: ui-monospace, monospace; font-size: 12px; color: #888; }
  #crumbs a { color: #36c; cursor: pointer; text-decoration: none; }
  #queryoutput { padding: 6px 14px 40px; }
  .err { color: #b00; white-space: pre-wrap; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>DACTAL × Datalib — query your <code>grid_rows</code> with DACTAL</h1>
  <div class="bar">
    <label for="datalib">Load (Datalib)</label>
    <input id="datalib" placeholder="Datalib search, e.g. provider:slack after:2025-01 — pulls a working set into the browser" />
    <button id="datalibgo">Load</button>
  </div>
  <div class="bar">
    <label for="dq">DACTAL query</label>
    <input id="dq" placeholder="rows/source   ·   rows:source=slack.author   ·   rows.author.count" />
    <button id="dqgo">Run</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="status">loading…</div>
</header>
<div id="crumbs"></div>
<div id="queryoutput"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
