[package]
name = "datalib-dag"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "datalib_dag"
path = "src/lib.rs"

[[bin]]
name = "datalib-dag"
path = "src/bin/datalib_dag.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
# Shell-style splitting of config `command:` strings; already pinned
# transitively.
shlex = "1"
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
# Workspace tokio lacks `process`/`sync`/`time`/`fs`; features are
# additive so we add what the scheduler + subprocess runner need.
tokio = { workspace = true, features = ["process", "sync", "time", "fs", "io-util"] }
# Same pinned spec as datalib-etl: default content hash for
# artifact versions when a step doesn't report its own.
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
tracing = "0.1"
# The binary's own lines go into the run store through
# `datalib_runs::StoreLayer`; the filter is `RUST_LOG`'s grammar.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = { workspace = true }
# Signal forwarding to step subprocesses (kill(2)); already pinned
# transitively.
libc = "0.2"
# Puts each step in a process group of its own, so a signal aimed at a
# step reaches what the step spawned. From the watchexec project, which
# runs arbitrary user commands for a living.
process-wrap = { version = "10", default-features = false, features = [
    "tokio1",
    "process-group",
] }
datalib-time = { path = "../time" }
strum = { workspace = true }
# Owner-only params files for step subprocesses (subprocess.rs).
tempfile = "3"
uuid = { workspace = true }

[dev-dependencies]
# The manual-e2e live golden (tests/manual_e2e_live_sync_golden.rs) is
# BAZEL-ONLY — it needs `datalib-step`, which has no cargo target — but cargo
# auto-discovers tests/*.rs, so these have to be declared or `cargo check`
# breaks on the whole crate.
insta = "1.41"
runfiles = "0.2"
sqlx = { workspace = true }
walkdir = { workspace = true }
