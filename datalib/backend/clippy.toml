# Clippy config for the datalib Rust workspace.
#
# Anything here that fires becomes a hard error in pre-commit, which
# runs `bazelisk build --config=clippy //...`. The .bazelrc block for
# that config wires in `-D warnings` so any clippy::* the build
# emits — including the `disallowed-methods` / `disallowed-macros`
# below — fails the build.

# Keep progress-bar rendering coordinated with the tracing writer.
#
# `datalib_obs::init` constructs the single process-wide
# `MultiProgress` and wires it into an `IndicatifWriter` that the
# tracing fmt layer uses, so every log emission suspends bar draws
# before writing. A second `MultiProgress` somewhere else in the
# workspace would race for stderr and reintroduce the flicker we
# already debugged out of existence.
#
# If a new caller needs progress bars, pull the shared MP via
# `datalib_obs::shared_multi()` and attach bars there.
# Every SQL statement is a named `datalib_sql::Sql` (datalib/backend/sql):
# `sql!("<package>.<what_it_does>", "…").query()`, or
# `Sql::dynamic(sql_id!("…"), text)` for text built while running, and its
# work is counted under that name. sqlx's own entry points take a bare
# string, so they are refused everywhere but in `datalib_sql` itself.
disallowed-methods = [
    { path = "sqlx::query", reason = "Name the statement: `sql!(\"<package>.<what_it_does>\", \"…\").query()`, or `Sql::dynamic(sql_id!(…), text).query()` (datalib/backend/sql)." },
    { path = "sqlx::query_as", reason = "Name the statement: `sql!(…).query_as()` (datalib/backend/sql)." },
    { path = "sqlx::query_scalar", reason = "Name the statement: `sql!(…).query_scalar()` (datalib/backend/sql)." },
    { path = "sqlx::query_with", reason = "Name the statement: `sql!(…).query()` and bind (datalib/backend/sql)." },
    { path = "sqlx::query_as_with", reason = "Name the statement: `sql!(…).query_as()` and bind (datalib/backend/sql)." },
    { path = "sqlx::query_scalar_with", reason = "Name the statement: `sql!(…).query_scalar()` and bind (datalib/backend/sql)." },
    { path = "sqlx::raw_sql", reason = "Name the statement: `sql!(…).raw()` (datalib/backend/sql)." },
    { path = "sqlx::QueryBuilder::new", reason = "Build the text, then name it: `Sql::dynamic(sql_id!(…), text)` (datalib/backend/sql)." },
    { path = "sqlx::Executor::execute", reason = "An executor handed a string runs it unnamed: `sql!(…).query().execute(executor)` (datalib/backend/sql)." },
    { path = "sqlx::Executor::execute_many", reason = "Name each statement: `sql!(…).raw().execute(executor)` (datalib/backend/sql)." },
    { path = "sqlx::Executor::fetch", reason = "Name the statement: `sql!(…).query().fetch(executor)` (datalib/backend/sql)." },
    { path = "sqlx::Executor::fetch_many", reason = "Name the statement (datalib/backend/sql)." },
    { path = "sqlx::Executor::fetch_all", reason = "Name the statement: `sql!(…).query().fetch_all(executor)` (datalib/backend/sql)." },
    { path = "sqlx::Executor::fetch_one", reason = "Name the statement: `sql!(…).query().fetch_one(executor)` (datalib/backend/sql)." },
    { path = "sqlx::Executor::fetch_optional", reason = "Name the statement: `sql!(…).query().fetch_optional(executor)` (datalib/backend/sql)." },
    { path = "sqlx::Executor::prepare", reason = "Name the statement (datalib/backend/sql)." },
    { path = "sqlx::Executor::prepare_with", reason = "Name the statement (datalib/backend/sql)." },
    { path = "indicatif::MultiProgress::new", reason = "Use `datalib_obs::shared_multi()` to get the process-wide MultiProgress that's coordinated with the tracing writer. A second MultiProgress races for stderr and flickers." },
]

# Raw `eprintln!` / `println!` bypass indicatif's bar suspension and
# corrupt the progress display whenever they fire during a phase that
# has live bars. Two safe alternatives, depending on intent:
#
#   1. Status banners (`[models] ...`,
#      `[translate] ...`, error summaries, SIGINT-handler messages):
#      use the `datalib_obs::status_line!` macro. It routes
#      through the shared `MultiProgress::println`, which suspends bar
#      draws across the write so the line lands above the bar block.
#
#   2. Structured log events: use `tracing::info!` / `warn!` /
#      `error!`. The obs subscriber writes through an `IndicatifWriter`
#      that suspends the MultiProgress for the duration of each event.
#
# Legitimate exceptions (compile-time `build.rs`, `#[cfg(test)]`
# blocks, standalone helper binaries that don't run under sync, the
# obs `Drop` fallback when the subscriber may already be torn down)
# carry a narrowly-scoped `#[allow(clippy::disallowed_macros)]` with
# a one-line reason — the same pattern as the `#[allow]` on the one
# legitimate `MultiProgress::new` call in `obs/src/lib.rs`.
disallowed-macros = [
    { path = "std::eprintln", reason = "Bypasses bar suspension and corrupts the progress display. Use `datalib_obs::status_line!` for status banners or `tracing::{info,warn,error}!` for log events." },
    { path = "std::println", reason = "Same as eprintln above. Stdout sinks (CLI piped-output tools) that genuinely need stdout add `#[allow(clippy::disallowed_macros)]`." },
]
