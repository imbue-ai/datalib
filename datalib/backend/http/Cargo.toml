[package]
name = "datalib-http"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_http"
path = "src/lib.rs"

[[bin]]
name = "datalib-http"
path = "src/main.rs"

# The code also consumes datalib-ingest-config, which is bazel-only
# (no Cargo.toml) — this manifest feeds crate_universe's third-party
# resolution and does not cargo-compile. BUILD.bazel is the dep truth.
[dependencies]
app-schema = { path = "../app_schema" }
datalib-core = { path = "../core" }
datalib-dag = { path = "../dag" }
datalib-time = { path = "../time" }
clap = { version = "4.5", features = ["derive"] }
mime_guess = "2"
# `debug-embed` forces the proc macro to bake bytes into the binary
# even in debug builds. Without it, debug builds resolve files from
# disk at *runtime* using the compile-time absolute path — fine for
# `cargo run` in-tree, broken for a Bazel-built binary that runs
# outside the sandbox + for a shipped release tarball.
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
serde = { workspace = true }
webbrowser = "1"
serde_json = { workspace = true }
sha2 = { workspace = true }
shlex = "1"
anyhow = { workspace = true }
axum = { workspace = true }
# `flock(2)` for the one-server-per-data-root claim (src/lock.rs).
libc = "0.2"
# Filesystem watching for src/watch.rs: the data root changes under us
# (an agent PUTs the config, a terminal `datalib-dag` writes its state)
# and the UI used to find out by polling. Default features only —
# that is FSEvents on macOS and inotify on Linux, and deliberately
# NOT `crossbeam-channel`, since the watcher hands events straight to
# a tokio channel from notify's own callback.
notify = "8"
chrono = { workspace = true }
futures = "0.3"
tokio = { workspace = true }
tower-http = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
