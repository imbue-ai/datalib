[sources.wizard]
method = "api"
label = "Baby Connect"
blurb = "Copy everything you logged for your children: feeds, sleeps, diapers and notes."
keywords = ["baby connect", "baby", "babyconnect", "tracker", "feeding", "sleep", "diaper"]
kind = "api"
icon = "baby_connect"
defaultName = "baby_connect"
nameHint = "Baby Connect"
wizard = true
intro = "Each child's month becomes a document you can read and search: every entry, with who logged it and the notes you typed. The first sync asks for one day at a time, from your eldest child's birthday."
credentialService = "babyconnect"
credentialConnectWarning = "Tick Remember Me when you sign in. Without it the session can end within a day, and every sync after that fails until you sign in again."

