target = "api.until"
label = "Until"
help = "The last day to copy. Empty copies up to today."

# ── the two `email` variants ──────────────────────────────────────
#
# Gmail must come before the JMAP entry: `variantKey` matching takes
# the first hit, and a Gmail step has no `jmap` table to confuse it
# — but a future entry keyed on something broader would.
[[sources]]
type = "email"
probe = "probe email"

[sources.wizard]
variantKey = "gmail"
label = "Gmail"
blurb = "Copy a Gmail account through Google's API."
keywords = ["gmail", "google", "email", "mail", "inbox", "labels"]
kind = "api"
icon = "gmail"
defaultName = "gmail"
nameHint = "Work Gmail"
mailboxNoun = "labels"
wizard = true
credentialService = "google-gmail"
# The presence of a `gmail` table is what selects this mode,
# and a table needs a key. `user_id` is the one to spend: `me`
# is both Gmail's meaning of "the authenticated user" and the
# backend's own default, so writing it changes nothing except
# making the mode explicit in the file. The JMAP server of the
# Fastmail entry is a preset too, rather than a field: that entry
# *is* Fastmail, and a different host is a different service that
# wants its own entry.
preset = [
  { target = "gmail.user_id", value = "me" },
  { target = "outlink_format", value = "gmail", phase = "render" },
]

[[sources.wizard.sections]]
heading = "Which mail?"
answers = [
  { label = "The whole account" },
  { label = "Only the labels I choose", fields = ["only_extract_labels"] },
]

[[sources.wizard.sections]]
heading = "How far back?"
answers = [
  { label = "Everything" },
  { label = "Only mail since a date I choose", fields = ["gmail.since"] },
]

[[sources.wizard.sections]]
heading = "Start from a Takeout?"
answers = [
  { label = "No, download every message" },
  { label = "Yes, I have a Google Takeout of this account", fields = ["mbox.path"] },
]

[[sources.wizard.sections]]
heading = "Large messages"
fields = ["common.blob_size_limit_bytes"]

[[sources.wizard.fields]]
kind = "text"
latchkey = true
target = "latchkey_settings.account"
label = "Google account"
help = "Which stored Google login to copy. Leave it empty if only one is stored — it is required only when the google-gmail service has more than one account, and naming the wrong one copies the wrong mailbox."

[[sources.wizard.fields]]
kind = "string_list"
probe = "labels"
target = "only_extract_labels"
label = "Labels"
help = "A nested label is named in full (Work/Projects), and choosing a parent does not include its children. A label added later brings in its mail on the next sync."

[[sources.wizard.fields]]
kind = "date"
target = "gmail.since"
label = "Start date"
help = "The first sync lists only mail from this day on, so it takes minutes rather than hours. Choosing an earlier date later brings in the older mail on the next sync."

[[sources.wizard.fields]]
kind = "path"
picks = "dir"
pickTitle = "Choose the folder holding your Google Takeout"
target = "mbox.path"
label = "Takeout folder"
help = "The folder holding the Takeout's .zip or .tgz files as Google sent them, every part, or the Mail folder of an unzipped one. Messages in the Takeout are not downloaded again, so the first sync takes minutes rather than hours. Mail newer than the Takeout, and every message's labels, still come from Gmail."

[[sources.wizard.fields]]
kind = "bytes"
target = "common.blob_size_limit_bytes"
label = "Skip messages bigger than"
help = "A skipped message keeps its headers and loses its body. Decide before the first sync: raising the limit later does not go back for messages already skipped. Empty means no limit."

[[sources.wizard.fields]]
kind = "string_list"
probe = "mailboxes"
phase = "render"
target = "only_render_labels"
label = "Render only these labels"
help = "A narrower filter applied at render. Empty renders everything downloaded. Changing it re-renders; it never re-downloads."

