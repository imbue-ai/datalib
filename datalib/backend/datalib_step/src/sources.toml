phase = "render"
target = "time_zone"
label = "Time zone"
help = "Where you were when you logged, as a zone name such as America/Los_Angeles. Baby Connect keeps times without one; empty reads them as UTC. Changing it re-renders; it never re-downloads."

[[sources.wizard.fields]]
kind = "date"
target = "api.since"
label = "From"
help = "The first day to copy. Empty starts at your eldest child's birthday."

[[sources.wizard.fields]]
