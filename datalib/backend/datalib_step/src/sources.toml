[[sources]]
type = "claude"
probe = "probe claude"

[sources.wizard]
variantKey = "api"
method = "api"
label = "Claude"
blurb = "Copy your claude.ai conversations and projects."
keywords = ["claude", "anthropic", "chat", "llm", "conversations"]
kind = "api"
icon = "claude"
defaultName = "claude"
nameHint = "Claude Account 1"
wizard = true
credentialService = "claude-ai"
# Kept to one line on purpose: the point is that clicking has a
# cost, not the history of how we found out (2026-08-31, the
# captured cookie and the everyday browser evicting each other).
credentialConnectWarning = "Signing in again may log out your other claude.ai session."

# The whole claude.ai credential is the `sessionKey` cookie, so
# cookie-capture is the flow that fits.
[sources.wizard.credentialRegister]
base_api_url = "https://claude.ai/"
login_url = "https://claude.ai/login"
login_flow = "cookie-capture"
login_flow_params = { cookieKeys = ["sessionKey"] }

# latchkey offers a service it did not ship the generic Bearer
# example; claude.ai's credential is the cookie.
[sources.wizard.credentialPaste]
headers = ["Cookie: sessionKey={secret}"]
help = "The sessionKey cookie from a signed-in claude.ai tab: DevTools → Application → Cookies → https://claude.ai → sessionKey → Value."

[[sources.wizard.sections]]
heading = "Which conversations?"

[[sources.wizard.sections.answers]]
label = "All of them"

[[sources.wizard.sections.answers]]
label = "Only the conversations I choose"
help = "Useful for a first sync of a large account."
fields = ["api.conv_uuids"]

[[sources.wizard.sections.answers]]
label = "Only conversations updated since a date I choose"
fields = ["api.since"]

[[sources.wizard.sections]]
heading = "Projects"
fields = ["api.projects"]

[[sources.wizard.sections]]
heading = "Cowork"
fields = ["api.cowork"]

[[sources.wizard.sections]]
heading = "Deleted chats"
fields = ["when_deleted_upstream"]

[[sources.wizard.fields]]
kind = "text"
latchkey = true
target = "latchkey_settings.account"
label = "Claude account"
help = "Either pick an existing one, or type a new name here and use one of the authentication options below to create a new latchkey account."

[[sources.wizard.fields]]
kind = "date"
target = "api.since"
label = "Start date"

[[sources.wizard.fields]]
kind = "bool"
target = "api.projects"
label = "Also copy Claude Projects"
default = true
help = "Each project's description, custom instructions and knowledge documents."

[[sources.wizard.fields]]
kind = "bool"
target = "api.cowork"
label = "Also copy Cowork tasks"
default = true
help = "Each task that ran in the cloud, as a conversation: your prompts, Claude's steps and its answers."

[[sources.wizard.fields]]
kind = "int"
target = "api.max_conversations_per_run"
label = "Most conversations to fetch per sync"
help = "The ones never fetched come first; the next sync fetches the rest. Empty is no limit."

[[sources.wizard.fields]]
kind = "int"
target = "api.refetch_newest_conversations"
label = "Fetch the N newest again each sync"
help = "Even when updated_at says they have not changed, in each org. Empty fetches only what changed."

[[sources.wizard.fields]]
kind = "int"
target = "api.seconds_between_requests"
label = "Seconds between requests"
help = "Empty waits none; a rate limit is still waited out."

[[sources.wizard.fields]]
kind = "string_list"
probe = "conversations"
target = "api.conv_uuids"
label = "Conversations"
help = "Chat links work too: paste one in the box."

[[sources.wizard.fields]]
kind = "select"
target = "when_deleted_upstream"
label = "When a chat is deleted on claude.ai"
default = "delete_local_copy"
options = [
  { value = "delete_local_copy", label = "Delete my copy too" },
  { value = "keep_local_copy", label = "Keep my copy" },
]
help = "Keep your copy if you mean to delete chats there for privacy and still have them here. Check the copy before you delete anything: it can't be downloaded again."

