# The sources `datalib-step` offers in "Add source", in the shape of a
# package manifest's `[[sources]]` (docs/dev/packages.md): the group
# `type`, the command that probes it, and the add-source form as a
# `CatalogEntry` without `type` (datalib/ui/src/config/catalog.ts).
# `datalib-step --describe` prints these with the commands each
# function's step runs (`describe.rs`). Before adding a source here,
# read docs/dev/wizard_design.md (how a form is laid out and worded),
# docs/dev/config_model.md (what the form writes) and
# docs/dev/wizard_file_pickers.md (a path field offers a native picker).
#
# Fields are kept inline per entry rather than factored out, even where
# two entries agree: a descriptor is data owned by one provider.
#
# Order matters where one `type` has several entries: the UI takes the
# first whose `variantKey` the step's params hold, so a more specific
# key comes first, and the entry without one last.

[[sources]]
type = "slack"
probe = "probe slack"

[sources.wizard]
method = "api"
label = "Slack"
blurb = "Copy channels and DMs from one Slack workspace."
keywords = ["slack", "chat", "workspace", "channels", "messages"]
kind = "api"
icon = "slack"
defaultName = "slack"
nameHint = "Work Slack"
wizard = true
credentialService = "slack"

[[sources.wizard.sections]]
heading = "Which channels?"

[[sources.wizard.sections.answers]]
label = "Every channel I'm in"
sets = { "api.all_channels" = false }

[[sources.wizard.sections.answers]]
label = "Every channel in the workspace"
help = "Including ones you haven't joined."
sets = { "api.all_channels" = true }

# No `sets`: a channel list wins over `all_channels` in the
# downloader, so a config holding both is this answer.
[[sources.wizard.sections.answers]]
label = "Only the channels I choose"
fields = ["api.channels"]

[[sources.wizard.sections]]
heading = "All of each channel?"
fields = ["api.scope"]

[[sources.wizard.sections]]
heading = "Direct messages?"

[[sources.wizard.sections.answers]]
label = "Leave them out"
help = "DMs are the most private part of a workspace."
sets = { "api.dms" = false }

[[sources.wizard.sections.answers]]
label = "All my direct messages"
help = "One-to-one and group conversations. Each is read in full once; after that, a sync reads the ones open in Slack's sidebar with new messages, and the closed ones once a day."
sets = { "api.dms" = true }

[[sources.wizard.sections.answers]]
label = "Only the conversations I choose"
sets = { "api.dms" = true }
fields = ["api.dm_conversations"]

[[sources.wizard.sections]]
heading = "How far back?"
answers = [
  { label = "Everything" },
  { label = "Only messages since a date I choose", fields = ["api.since"] },
]

[[sources.wizard.sections]]
heading = "Files people shared"
fields = ["api.media", "common.blob_size_limit_bytes"]

[[sources.wizard.sections]]
heading = "Archived channels"
fields = ["api.archived"]
advanced = true

[[sources.wizard.fields]]
kind = "string_list"
probe = "channels"
target = "api.channels"
label = "Channels"
help = "A channel named here is copied whether or not you're a member of it."

[[sources.wizard.fields]]
kind = "select"
target = "api.scope"
label = "Copy"
default = "every_conversation"
options = [
  { value = "every_conversation", label = "Everything in those channels" },
  { value = "involves_me", label = "Only the channels that involve me" },
]
help = "The second copies only the channels where you're mentioned, you posted, or someone wrote @here or @channel, from a day before. A first sync takes minutes rather than hours. Direct messages follow the next question either way."

[[sources.wizard.fields]]
kind = "date"
target = "api.since"
label = "Start date"
help = "Choosing an earlier date later brings in the older messages on the next sync."

[[sources.wizard.fields]]
kind = "date"
target = "api.until"
label = "Copy until"
help = "Last day to copy. Empty keeps up with today; a past day fixes the window."

[[sources.wizard.fields]]
kind = "bool"
target = "api.media"
label = "Download them"
default = true
help = "Off keeps each file's name and details, without the file."

[[sources.wizard.fields]]
kind = "bytes"
target = "common.blob_size_limit_bytes"
requires = "api.media"
label = "Skip files bigger than"
default = 5_000_000
help = "A few very large uploads usually take most of the disk space and hold little text. Clear the number for no limit; raising it later brings in the files it skipped."

[[sources.wizard.fields]]
kind = "bool"
target = "api.all_channels"
label = "Include channels you're not a member of"
default = false
help = "Ignored when Channels is set."

[[sources.wizard.fields]]
kind = "bool"
target = "api.archived"
label = "Copy archived channels too"
default = false
help = "Use it with every channel in the workspace: Slack drops almost everyone from a channel it archives, so with every channel you're in it adds almost nothing. Each archived channel is copied once. One you choose by name is copied either way."

[[sources.wizard.fields]]
kind = "bool"
target = "api.dms"
label = "Download direct messages"
default = false
help = "Your 1:1 and group DMs, alongside the channels above. Off by default — DMs are the most private thing in a workspace, so copying them is opt-in."

[[sources.wizard.fields]]
kind = "string_list"
probe = "conversations"
target = "api.dm_conversations"
requires = "api.dms"
label = "Conversations"
help = "A link to a conversation works too: right-click it in Slack's sidebar and choose Copy link."

[[sources.wizard.fields]]
kind = "int"
target = "api.refresh_window_days"
label = "Edit-catcher window (days)"
help = "Re-queries the trailing N days of channels that already have history, for edits, reactions and deletions. Not a range bound. Empty is 30; 0 turns it off."

[[sources.wizard.fields]]
kind = "int"
target = "api.refresh_every_minutes"
label = "Re-query that window every (minutes)"
help = "How long after the last re-query a sync re-queries a conversation's window again. New messages are fetched on every sync either way. Empty is 60; 0 re-queries every sync."

[[sources.wizard.fields]]
kind = "int"
target = "api.list_every_hours"
label = "Re-read the user list and bookmarks every (hours)"
help = "How long after the last read a sync reads the workspace's user list and bookmarks again. A new author is looked up as their first message lands either way. Empty is 6; 0 re-reads every sync."

[[sources.wizard.fields]]
kind = "string_list"
target = "api.involves_me"
label = "What involves me"
help = "With Copy set to the channels that involve you: any of mention, from_me, and broadcast (@here and @channel). Empty is all three."

[[sources.wizard.fields]]
kind = "text"
target = "api.context_before"
label = "Start before the first one"
help = "An offset such as -1d or -3h: how long before the oldest message that involves you a channel is copied from. Empty is -1d."

[[sources.wizard.fields]]
kind = "text"
target = "api.context_after"
label = "Stop after each one"
help = "An offset such as +1d: copy only this long after each message that involves you. Empty copies up to now."

