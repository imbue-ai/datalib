[[sources]]
type = "notion"
probe = "probe notion"

[sources.wizard]
method = "api"
label = "Notion"
blurb = "Copy pages and comment threads."
keywords = ["notion", "wiki", "docs", "pages"]
kind = "api"
icon = "notion"
defaultName = "notion"
nameHint = "Team Notion"
wizard = true
intro = "Each page becomes a document you can read and search, with its comments and attached files. Database rows come along as pages."
credentialService = "notion"

# latchkey's example stores the token alone, but Notion refuses a
# request without `Notion-Version`, and the version has to be stored
# with the token: one sent beside the stored one joins it and Notion
# refuses the pair (notion/INGEST.md). Keep it equal to the version
# INGEST.md names.
[sources.wizard.credentialPaste]
headers = ["Authorization: Bearer {secret}", "Notion-Version: 2026-03-11"]
help = "Make a personal access token at notion.so/profile/integrations; it starts ntn_. An internal integration works too, but copies only the pages shared with it."

[[sources.wizard.sections]]
heading = "Which pages?"

[[sources.wizard.sections.answers]]
label = "Every page I can see"

[[sources.wizard.sections.answers]]
label = "Only the pages I choose"
help = "Each page or database and everything inside it: sub-pages at any depth and a database's rows. Pages a chosen page links to or @-mentions come too, but not what is inside them."
fields = ["api.roots"]

[[sources.wizard.sections]]
heading = "Comments and files"
fields = ["api.comments", "api.attachments"]
advanced = true

[[sources.wizard.fields]]
kind = "string_list"
target = "api.roots"
label = "Pages"
help = "Paste a page's or a database's link, or its id."

[[sources.wizard.fields]]
kind = "bool"
target = "api.comments"
label = "Copy comments"
default = true

[[sources.wizard.fields]]
kind = "bool"
target = "api.attachments"
label = "Copy attached files"
default = true

[[sources.wizard.fields]]
kind = "int"
target = "api.refresh_window_days"
label = "Re-list edits from the last (days)"
help = "Whole-workspace copy only: each sync lists pages edited this many days before the newest it has seen, so a page shared with you late is still found. Empty is 0."

[[sources.wizard.fields]]
kind = "int"
target = "api.max_pages"
label = "Stop after (pages)"
help = "A guard against a copy that reaches further than meant. Empty is no limit."

