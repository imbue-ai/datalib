[workspace]
resolver = "2"
members = [
    "schema",
    "app_schema",
    "index_lib",
    "unified_index",
    "core",
    "dag",
    "http",
    "obs",
    "time",
    "id",
    "etl",
    "etl/macros",
    "etl/providers/anthropic",
    "etl/providers/beeper",
    "etl/providers/chatgpt",
    "etl/providers/contacts",
    "etl/providers/github",
    "etl/providers/google_takeout",
    "etl/providers/gitlab",
    "etl/providers/email",
    "etl/providers/linkedin",
    "etl/providers/fsindex",
    "etl/providers/lightroom",
    "etl/providers/media",
    "etl/providers/notion",
    "etl/providers/pdf",
    "etl/providers/perseus",
    "etl/providers/signal",
    "etl/providers/slack",
    "etl/providers/sms_backup_restore",
    "etl/providers/yolink",
    "qmd_indexer",
    "signal-backup",
    "whatsapp-backup",
    "etl/providers/whatsapp",
    "etl/chat-common",
    "etl/contact-common",
    "applets",
    # NOTE: datalib_migrate_config, source_common, and the provider
    # *_config crates are bazel-only (no Cargo.toml). This workspace
    # exists for crate_universe's third-party resolution and is not
    # cargo-compilable end to end: those crates are consumed in code via
    # BUILD.bazel deps that have no cargo counterpart. The
    # tauri shell no longer links the backend (it spawns the bazel-built
    # datalib-http binary), so nothing cargo-builds these crates.
]

[workspace.package]
version = "0.30.0"
edition = "2021"
rust-version = "1.83"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The config file format, everywhere: the DAG config and every step's
# `params` subtree.
toml = "1"
# YAML survives in exactly two places, neither of them the config the
# pipeline reads: fsindex's per-directory `.fsindex.yaml` breadcrumbs,
# and `datalib-migrate-config`, which parses the retired config formats
# so the shipping programs don't have to.
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
# sqlx is the SQLite client driving DoltRepo against a single file at
# `<data_root>/<dolt.db_filename>`. The file is a *doltlite* file with
# the full version-control superpowers (`SELECT dolt_commit(...)` etc.);
# `datalib-core::dolt_repo` probes `pragma_function_list` at connect
# time and short-circuits cleanly when (in cargo-only / non-Bazel
# builds) the linked libsqlite3 happens to be stock SQLite.
#
# We use sqlx's `sqlite` feature (NOT `sqlite-unbundled`). Under Bazel,
# the `crate.annotation` on `libsqlite3-sys` in MODULE.bazel overrides
# the bundled amalgamation with the doltlite archive built by
# `//third-party/doltlite:sqlite3` (via `SQLITE3_LIB_DIR` +
# `SQLITE3_STATIC=1`), so what's actually statically linked is doltlite,
# not stock SQLite.
#
# `sqlite-unbundled` was a holdover that caused sqlx-sqlite to emit
# `cargo:rustc-link-lib=dylib=sqlite3` on its own — producing a release
# binary that statically embedded doltlite but ALSO declared a spurious
# DT_NEEDED on `libsqlite3.so`, so it refused to launch on minimal Linux
# hosts (e.g. the Docker base image) that didn't have a system libsqlite3
# installed. The `sqlite` feature has no such side-emission; the binary
# is fully self-contained.
#
# Features:
#   runtime-tokio        — async runtime
#   tls-none             — no TLS stack at all. sqlx 0.9 split the old
#                          combined `runtime-tokio-rustls` feature into a
#                          runtime and a TLS choice, which forced the
#                          question this crate never actually had an
#                          answer for: we drive SQLite over a local file
#                          and never open a socket, so rustls was only
#                          ever dead weight linked into every binary.
#   sqlite               — bundled libsqlite3-sys; under Bazel the
#                          crate annotation swaps the amalgamation for
#                          our doltlite archive
#   macros               — `query!` / `query_as!` (not yet used; cheap)
#   chrono               — map ISO-8601 strings to/from chrono types
#   uuid                 — `feedback_uuid` primary keys
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "sqlite",
    "macros",
    "chrono",
    "uuid",
] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
# Gitignore-style path matcher used by datalib-etl-fsindex's
# walker for per-directory `.fsindex.yaml` ignore rules. Same crate
# ripgrep and watchexec rely on; correct gitignore semantics out of
# the box.
ignore = "0.4"

# PDF → Markdown for the `pdf` provider. MIT, pure Rust in the default
# feature set (the `ocr` feature, which we do NOT enable, is what pulls
# PDFium + ONNX Runtime). Benchmarks best-in-class among local non-model
# parsers on reading order and tables.
pdf-inspector = { version = "1.17", default-features = false }

# RFC-8089 `file://` URL construction for the `pdf` provider's
# `grid_rows.source_url`. Hand-rolling this is where you get `#` in a
# filename (which truncates the URL), spaces, non-ASCII, and Windows
# drive letters subtly wrong.
url = "2"

# Low-level PDF object access for the `pdf` provider's identity columns
# (trailer `/ID`, the XMP metadata stream). pdf-inspector exposes
# neither.
lopdf = { version = "0.44", default-features = false }

# Audio tags + audio properties for the `media` provider: ID3v2, Vorbis
# comments, MP4 `ilst` atoms and RIFF INFO behind one API, plus
# bitrate/sample-rate/channel/duration. Pure Rust, no build.rs. We read
# tags only — `media` never writes to the tree it scans.
#
# It deliberately does NOT cover the payload hash: no tagging library
# exposes "the byte ranges that are not metadata", which is the whole
# point of `media_items.payload_blake3`. That walk is ours
# (`download/payload/`), and it is why this crate is a convenience and
# not the foundation.
lofty = "0.25"

# EXIF/TIFF metadata for the `media` provider's image and video rows.
# The `exif` crate name is `kamadak-exif` on crates.io. Pure Rust, one
# dependency, and it parses the TIFF IFD structure that JPEG APP1, PNG
# `eXIf`, and DNG/TIFF all embed — so one reader covers every stills
# format we index.
kamadak-exif = "0.6"
async-trait = "0.1"
# Prost runtime. Codegen is driven by Bazel's `rust_prost_library`
# (see //tools/prost_toolchain), so we don't depend on `prost-build`
# here — only the runtime. `protoc-gen-prost` is pulled in via the
# toolchain wiring, not as a direct crate dep.
prost = "0.14"
prost-types = "0.14"
protoc-gen-prost = "0.5"
# Crypto + compression for the Signal backup container.
#
# These eight move as ONE generation and cannot be bumped piecemeal:
# `ghash` 0.6 switched from `generic-array::GenericArray` to
# `hybrid-array::Array`, and `whatsapp-backup/src/crypto.rs` feeds the
# same array values to both `ghash` and `aes` in one function. Taking
# `ghash` alone would put two array crates in one file. See #258.
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
subtle = "2.6"
aes = "0.9"
cbc = { version = "0.2", features = ["block-padding"] }
ctr = "0.10"
cipher = { version = "0.5", features = ["block-padding"] }
flate2 = "1.0"
# GHASH (the universal hash inside GCM) and AES-CTR primitives,
# composed by `datalib-whatsapp-backup` into a hand-rolled
# GCM decrypt. We can't use the `aes-gcm` crate here: WhatsApp's
# crypt15 uses a 16-byte IV, and `aes-gcm` 0.10's `AesGcm<_, U16>`
# does not produce the NIST-spec J0 = GHASH(H, IV || 0^s || lenBits)
# that pycryptodome (and WhatsApp Android) actually use — verified
# empirically against a real msgstore.db.crypt15 backup.
ghash = "0.6"
# WhatsApp provider walks the Media/ tree to register attachment
# files in `wa_media_files`. Used by `etl/providers/whatsapp` only.
walkdir = "2"
# MD5 for the trailing integrity checksum the crypt15 *file* format
# stamps after the GCM tag. Not cryptographic; only used by the
# fixture-generation encrypt path.
md-5 = "0.10"
