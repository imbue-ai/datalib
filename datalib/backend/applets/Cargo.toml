[package]
name = "datalib-applet"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "datalib-applet"
path = "src/main.rs"

# The code also consumes datalib-columns, which is bazel-only (no
# Cargo.toml). BUILD.bazel is the dep truth.
[dependencies]
datalib-schema = { path = "../schema" }
datalib-problems = { path = "../problems" }
datalib-core = { path = "../core" }
datalib-fetch = { path = "../fetch" }
datalib-qmd-indexer = { path = "../qmd_indexer" }
datalib-qmd-models = { path = "../qmd_models" }
datalib-unified-index = { path = "../unified_index" }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
mime_guess = "2"
sha2 = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
datalib-time = { path = "../time" }
tempfile = "3"
