# Fastmail's address books over CardDAV, signed in through latchkey's
# `fastmail-dav` service with a read-only app password. An empty `fastmail`
# table mirrors every address book the account holds.
[[groups]]
id = "contacts"
name = "Fastmail Contacts"
type = "contacts"

[[steps]]
id = "contacts/ingest"
command = "datalib-step run ingest contacts"

[steps.params.fastmail]

[[steps]]
id = "contacts/render_markdown"
command = "datalib-step run render_markdown contacts"
inputs = ["contacts/ingest"]
reads = "pinned"
