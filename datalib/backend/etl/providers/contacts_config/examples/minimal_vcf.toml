# A folder of `.vcf` (vCard) files on disk, as most address books export
# them. Each file is one address book. No sign-in.
[[groups]]
id = "contacts"
name = "Contacts export"
type = "contacts"

[[steps]]
id = "contacts/ingest"
command = "datalib-step run ingest contacts"

[steps.params.vcf]
path = "~/Downloads/contacts-export"

[[steps]]
id = "contacts/render_markdown"
command = "datalib-step run render_markdown contacts"
inputs = ["contacts/ingest"]
reads = "pinned"
