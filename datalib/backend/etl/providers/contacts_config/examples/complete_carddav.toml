# Any other CardDAV server, signed in through a latchkey service
# registered for its host, with every option set, and searchable.
[[groups]]
id = "contacts"
name = "CardDAV Contacts"
type = "contacts"

[[steps]]
id = "contacts/ingest"
command = "datalib-step run ingest contacts"

# When to give up on a failing server. The download always backs off and
# retries; these only decide when to stop.
[steps.params.common.download_params]
maximum_time_without_progress_in_minutes = 30  # the default
maximum_sequential_failed_requests = 50        # the default

# A JSONL copy of every row written, under ingest/events/, for debugging.
# Nothing reads it and it grows every run.
[steps.params.common.event_tape]
enabled = false

# Which stored latchkey account to use (`latchkey auth list`). Omit it to
# use the only one.
[steps.params.latchkey_settings]
account = "picard@example.com"

[steps.params.carddav]
# Where discovery starts. The host alone is usually enough: discovery tries
# `/.well-known/carddav` when it does not answer.
server_url = "https://cloud.example.com/remote.php/dav/"
addressbooks = ["Enterprise Crew"]  # names as the server shows them, matched exactly;
                                    # omit for every address book

[[steps]]
id = "contacts/render_markdown"
command = "datalib-step run render_markdown contacts"
inputs = ["contacts/ingest"]
reads = "pinned"

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "contacts/embed"
command = "datalib-step run embed contacts"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]
