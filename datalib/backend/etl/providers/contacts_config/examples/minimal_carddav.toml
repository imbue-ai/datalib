# Any other CardDAV server (iCloud, Nextcloud, Radicale, …), signed in through
# a latchkey service registered for the server's host, with an app password.
[[groups]]
id = "contacts"
name = "CardDAV Contacts"
type = "contacts"

[[steps]]
group = "contacts"
function = "ingest"
command = "datalib-step"

[steps.params.carddav]
server_url = "https://cloud.example.com/remote.php/dav/"

[[steps]]
group = "contacts"
function = "render_markdown"
command = "datalib-step"
inputs = ["contacts/ingest"]
