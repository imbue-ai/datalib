# The folder of backups Adobe Lightroom Classic writes beside its catalog,
# replayed as the catalog's history: each backup becomes one commit, oldest
# first. No sign-in.
[[groups]]
id = "lightroom"
name = "Lightroom"
type = "lightroom"

[[steps]]
id = "lightroom/ingest"
command = "datalib-step run ingest lightroom"

[steps.params.backups]
path = "~/Pictures/Lightroom/Backups"

# Lightroom's render writes no markdown: it puts a grid row per photo
# and video in the grid, and is what the photos applet draws from.
[[steps]]
id = "lightroom/render_markdown"
command = "datalib-step run render_markdown lightroom"
inputs = ["lightroom/ingest"]
reads = "pinned"
