[package]
name = "datalib-etl-media"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_etl_media"
path = "src/lib.rs"

[dependencies]
datalib-etl = { path = "../.." }
datalib-time = { path = "../../../time" }
sqlx = { workspace = true }
anyhow = { workspace = true }
# The payload hash (`download/payload/`). Same digest the file-bytes key
# uses, so both columns are comparable at a glance.
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
serde = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
# Only for QuickTime/BMFF creation times, which are seconds since
# 1904-01-01 and need a real calendar to render as ISO-8601.
chrono = { workspace = true }
# Audio tags and audio properties. See the workspace manifest for why
# this covers metadata but not the payload hash.
lofty = { workspace = true }
# EXIF, for stills and for the capture-side fields video shares with
# them. Crate is `kamadak-exif`; the lib it exposes is `exif`.
kamadak-exif = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
