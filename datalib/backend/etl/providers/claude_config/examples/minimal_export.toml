# An unpacked Claude data export on disk, requested from claude.ai's
# settings. No sign-in: `path` is the folder holding `conversations.json`.
[[groups]]
id = "claude"
name = "Claude export"
type = "claude"

[[steps]]
id = "claude/ingest"
command = "datalib-step run ingest claude"

[steps.params.export]
path = "~/Downloads/claude-export"

[[steps]]
id = "claude/render_markdown"
command = "datalib-step run render_markdown claude"
inputs = ["claude/ingest"]
reads = "pinned"
