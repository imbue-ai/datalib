# Your Baby Connect history, signed in through latchkey (by browser). An
# empty `api` table copies every entry of every child, from the eldest
# child's birthday to today; later syncs read only the days not yet read.
[[groups]]
id = "baby_connect"
name = "Baby Connect"
type = "baby_connect"

[[steps]]
id = "baby_connect/ingest"
command = "datalib-step run ingest baby_connect"

[steps.params.api]

# One document per child: every entry, with its notes, its time
# read in the zone you logged in.
[[steps]]
id = "baby_connect/render_markdown"
command = "datalib-step run render_markdown baby_connect"
inputs = ["baby_connect/ingest"]
reads = "pinned"

[steps.params]
time_zone = "America/Los_Angeles"
