[package]
name = "datalib-etl-apple-messages-render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_etl_apple_messages_render"
path = "src/lib.rs"

[dependencies]
datalib-etl = { path = "../.." }
datalib-etl-chat-common = { path = "../../chat-common" }
datalib-etl-render = { path = "../../render" }
datalib-id = { path = "../../../id" }
datalib-schema = { path = "../../../schema" }
anyhow = { workspace = true }
async-trait = "0.1"
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"

[dev-dependencies]
datalib-etl-apple-messages = { path = "../apple_messages" }
datalib-etl-sqlite-mirror = { path = "../../sqlite_mirror" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
