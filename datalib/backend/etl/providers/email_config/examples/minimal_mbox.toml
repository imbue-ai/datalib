# An `.mbox` file on disk, such as the Mail product of a Google Takeout
# export. No sign-in: `path` is the file, or a folder holding one.
[[groups]]
id = "email"
name = "Gmail Takeout"
type = "email"

[[steps]]
id = "email/ingest"
command = "datalib-step run ingest email"

[steps.params.mbox]
path = "~/Downloads/email-export"

[[steps]]
id = "email/render_markdown"
command = "datalib-step run render_markdown email"
inputs = ["email/ingest"]
reads = "pinned"
