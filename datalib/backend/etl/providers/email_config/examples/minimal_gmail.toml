# Gmail over the Gmail API, signed in through latchkey. An empty `gmail` table
# mirrors the whole mailbox.
[[groups]]
id = "email"
name = "Gmail"
type = "email"

[[steps]]
id = "email/ingest"
command = "datalib-step run ingest email"

[steps.params.gmail]

[[steps]]
id = "email/render_markdown"
command = "datalib-step run render_markdown email"
inputs = ["email/ingest"]
reads = "pinned"
