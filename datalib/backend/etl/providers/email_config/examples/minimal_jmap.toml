# Fastmail mail over JMAP, signed in through latchkey. Another JMAP server
# works the same way: register its host with latchkey and put that host in
# `hostname`.
[[groups]]
id = "email"
name = "Fastmail"
type = "email"

[[steps]]
id = "email/ingest"
command = "datalib-step run ingest email"

[steps.params.jmap]
hostname = "api.fastmail.com"

[[steps]]
id = "email/render_markdown"
command = "datalib-step run render_markdown email"
inputs = ["email/ingest"]
reads = "pinned"
