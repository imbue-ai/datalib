[package]
name = "datalib-etl-whatsapp-render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_etl_whatsapp_render"
path = "src/lib.rs"

[dependencies]
datalib-etl = { path = "../.." }
datalib-etl-render = { path = "../../render" }
datalib-time = { path = "../../../time" }
datalib-whatsapp-backup = { path = "../../../whatsapp-backup" }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tempfile = "3"
walkdir = { workspace = true }

datalib-etl-chat-common = { path = "../../chat-common" }
datalib-schema = { path = "../../../schema" }
datalib-etl-whatsapp = { path = "../whatsapp" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
