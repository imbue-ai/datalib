# A folder of music, photos and video on disk, every file indexed with its
# metadata and content hash. No sign-in; nothing but a path.
[[groups]]
id = "media"
name = "Media"
type = "media"

[[steps]]
group = "media"
function = "ingest"
command = "datalib-step"

[steps.params.fswalk]
path = "~/Music"

# Media renders no documents: query the raw store with `datalib-doltlite`.
# This step writes the storage report every source gets, which is what
# puts Media in the grid.
[[steps]]
group = "media"
function = "render_markdown"
command = "datalib-step"
inputs = ["media/ingest"]
