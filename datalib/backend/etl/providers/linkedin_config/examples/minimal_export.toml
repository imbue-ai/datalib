# LinkedIn's "Get a copy of your data" export, unzipped: the folder of CSVs.
# No sign-in; request the export under Settings & Privacy → Data privacy.
[[groups]]
id = "linkedin"
name = "LinkedIn"
type = "linkedin"

[[steps]]
id = "linkedin/ingest"
command = "datalib-step run ingest linkedin"

[steps.params.export]
path = "~/Downloads/linkedin-export"

[[steps]]
id = "linkedin/render_markdown"
command = "datalib-step run render_markdown linkedin"
inputs = ["linkedin/ingest"]
reads = "pinned"
