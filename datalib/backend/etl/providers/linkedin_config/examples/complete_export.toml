# LinkedIn's "Get a copy of your data" export, unzipped, with every option
# set, and searchable. Render emits the message threads and your
# connections as contacts. Unzip each newer export over the folder.
[[groups]]
id = "linkedin"
name = "LinkedIn"
type = "linkedin"

[[steps]]
group = "linkedin"
function = "ingest"
command = "datalib-step"

[steps.params.export]
path = "~/Downloads/linkedin-export"  # the unzipped export: the folder of CSVs

[[steps]]
group = "linkedin"
function = "render_markdown"
command = "datalib-step"
inputs = ["linkedin/ingest"]

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
group = "linkedin"
function = "embed"
command = "datalib-step"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
