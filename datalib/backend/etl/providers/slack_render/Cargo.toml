[package]
name = "datalib-etl-slack-render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_etl_slack_render"
path = "src/lib.rs"

[dependencies]
datalib-etl = { path = "../.." }
datalib-etl-render = { path = "../../render" }
datalib-id = { path = "../../../id" }
datalib-etl-macros = { path = "../../macros" }
datalib-obs = { path = "../../../obs" }
datalib-time = { path = "../../../time" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["process", "fs", "io-util", "time", "rt-multi-thread", "macros"] }
uuid = { workspace = true, features = ["v5"] }
regex = "1.11"
once_cell = "1.20"
emojis = "0.6"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
sqlx = { workspace = true }
tempfile = "3"

datalib-etl-chat-common = { path = "../../chat-common" }
datalib-schema = { path = "../../../schema" }
datalib-etl-slack = { path = "../slack" }

[dev-dependencies]
insta = { version = "1.41", features = ["json", "redactions"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
