[package]
name = "datalib-etl-github-render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_etl_github_render"
path = "src/lib.rs"

[dependencies]
datalib-etl = { path = "../.." }
datalib-etl-render = { path = "../../render" }
datalib-etl-macros = { path = "../../macros" }
datalib-obs = { path = "../../../obs" }
datalib-time = { path = "../../../time" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["process", "fs", "io-util", "time", "rt-multi-thread", "macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
regex = "1.11"
once_cell = "1.20"
uuid = { workspace = true }
urlencoding = "2"
sqlx = { workspace = true }

datalib-schema = { path = "../../../schema" }
datalib-etl-github = { path = "../github" }

[dev-dependencies]
insta = { version = "1.41", features = ["json", "redactions"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
