# Codex CLI threads, read off the rollouts Codex keeps on this machine. No
# sign-in: an empty `sessions` table reads the standard Codex home,
# ~/.codex (its sessions/ and archived_sessions/ folders).
[[groups]]
id = "codex"
name = "Codex"
type = "codex"

[[steps]]
group = "codex"
function = "ingest"
command = "datalib-step"

[steps.params.sessions]

[[steps]]
group = "codex"
function = "render_markdown"
command = "datalib-step"
inputs = ["codex/ingest"]
