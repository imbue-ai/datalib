# Codex CLI threads read off a copy of another machine's Codex home, with
# every option set, and searchable. No sign-in: the files are read off
# disk.
[[groups]]
id = "codex"
name = "Codex"
type = "codex"

[[steps]]
group = "codex"
function = "ingest"

[steps.params.sessions]
path = "~/Downloads/codex-backup"  # a copy of another machine's Codex home, the folder
                                   # holding sessions/ and archived_sessions/;
                                   # default ~/.codex

[[steps]]
group = "codex"
function = "render_markdown"
inputs = ["codex/ingest"]

# How much of one tool output reaches the page. The raw store keeps all of
# it; an output that echoes a whole file is cut here, with a marker saying
# so. Raising it and re-rendering fills the pages back in.
[steps.params]
max_tool_result_bytes = 16384  # the default

# Free-text search: keyword (BM25), then embeddings for search by meaning.
# Add both to `unified_document_index/qmd_aggregator`'s inputs.
[[steps]]
group = "codex"
function = "keyword_index"
inputs = ["codex/render_markdown"]

[[steps]]
group = "codex"
function = "embed"
inputs = ["codex/keyword_index"]
