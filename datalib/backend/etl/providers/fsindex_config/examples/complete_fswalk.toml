# An index of a local directory tree, with every option set. Nothing to
# sign in to; with `stamp` off the scan only reads the folder `path` names.
[[groups]]
id = "fsindex"
name = "Local files"
type = "fsindex"

[[steps]]
group = "fsindex"
function = "ingest"

[steps.params]
stamp = false  # true writes `.fsindex.toml` UUID breadcrumbs into each directory
               # that opts in with `stamp_me_with_uuid`; default false

[steps.params.fswalk]
path = "~/Documents/starfleet"  # the tree to scan; `~` is your home folder

# Renders no documents, only the storage report every source gets, which
# is what puts the source in the grid. No options.
[[steps]]
group = "fsindex"
function = "render_markdown"
inputs = ["fsindex/ingest"]
