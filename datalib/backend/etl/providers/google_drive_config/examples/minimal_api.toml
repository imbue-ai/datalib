# A backup of a Google account's Docs, Sheets and Slides, signed in through
# four latchkey services as the same account: google-drive, google-docs,
# google-sheets and google-slides.
[[groups]]
id = "google_drive"
name = "Google Drive"
type = "google_drive"

[[steps]]
id = "google_drive/ingest"
command = "datalib-step run ingest google_drive"

[steps.params.api]

# Each Doc as one document, its comment threads folded in; Sheets and
# Slides are kept but not rendered yet.
[[steps]]
id = "google_drive/render_markdown"
command = "datalib-step run render_markdown google_drive"
inputs = ["google_drive/ingest"]
reads = "pinned"
