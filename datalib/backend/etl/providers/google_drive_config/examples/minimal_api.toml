# A backup of a Google account's Docs, Sheets and Slides, signed in through
# four latchkey services as the same account: `latchkey auth browser
# google-drive`, then the same for google-docs, google-sheets and google-slides.
[[groups]]
id = "google_drive"
name = "Google Drive"
type = "google_drive"

[[steps]]
group = "google_drive"
function = "ingest"

[steps.params.api]

# Renders no documents yet, only the storage report every source gets,
# which is what puts the source in the grid.
[[steps]]
group = "google_drive"
function = "render_markdown"
inputs = ["google_drive/ingest"]
