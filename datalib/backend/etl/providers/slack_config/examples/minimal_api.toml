# Slack over its API, signed in through latchkey. An empty `api` table mirrors
# every channel the account is a member of, its whole history; DMs stay off
# unless asked for.
[[groups]]
id = "slack"
name = "Slack"
type = "slack"

[[steps]]
id = "slack/ingest"
command = "datalib-step run ingest slack"

[steps.params.api]

[[steps]]
id = "slack/render_markdown"
command = "datalib-step run render_markdown slack"
inputs = ["slack/ingest"]
reads = "pinned"
