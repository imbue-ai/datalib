# An unpacked ChatGPT data export on disk, requested from chatgpt.com's
# Settings → Data controls → Export data. No sign-in and no rate limit:
# `path` is the folder holding `conversations.json`.
[[groups]]
id = "chatgpt"
name = "ChatGPT export"
type = "chatgpt"

[[steps]]
group = "chatgpt"
function = "ingest"

[steps.params.export]
path = "~/Downloads/chatgpt-export"

[[steps]]
group = "chatgpt"
function = "render_markdown"
inputs = ["chatgpt/ingest"]
