# ChatGPT conversations over chatgpt.com's web API, signed in through
# latchkey's `chatgpt` service, which has to be registered first. An empty
# `api` table mirrors every conversation.
[[groups]]
id = "chatgpt"
name = "ChatGPT"
type = "chatgpt"

[[steps]]
id = "chatgpt/ingest"
command = "datalib-step run ingest chatgpt"

[steps.params.api]

[[steps]]
id = "chatgpt/render_markdown"
command = "datalib-step run render_markdown chatgpt"
inputs = ["chatgpt/ingest"]
reads = "pinned"
