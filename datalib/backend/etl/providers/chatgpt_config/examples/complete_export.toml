# A ChatGPT data export on disk, zipped or not, with every option set, and
# searchable. No sign-in. The export is a complete snapshot: a
# conversation a newer export no longer holds leaves the mirror. To keep
# it current afterwards, add an `api` table beside this one (the chatgpt
# INGEST.md, "An export and the API together"): the API then fetches only
# what moved, and the export no longer prunes.
[[groups]]
id = "chatgpt"
name = "ChatGPT export"
type = "chatgpt"

[[steps]]
id = "chatgpt/ingest"
command = "datalib-step run ingest chatgpt"

[steps.params]
# What becomes of the copy of a conversation a newer export no longer holds:
# "delete_local_copy" (the default) deletes it here too; "keep_local_copy"
# keeps it, so you can delete it upstream for privacy and still have it.
when_deleted_upstream = "keep_local_copy"

[steps.params.export]
path = "~/Downloads/chatgpt-export.zip"  # the .zip, or the folder it was unzipped into

[[steps]]
id = "chatgpt/render_markdown"
command = "datalib-step run render_markdown chatgpt"
inputs = ["chatgpt/ingest"]
reads = "pinned"

# Search by meaning: cuts this source's documents into chunks and embeds
# them. Leave it out and keyword search still finds it.
[[steps]]
id = "chatgpt/embed"
command = "datalib-step run embed chatgpt"
inputs = ["unified_grid_and_search_index/unified_grid_and_search_index"]
reads = "files"
locks = ["embedder"]
