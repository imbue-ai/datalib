# A ChatGPT data export on disk, zipped or not, with every option set, and
# searchable. No sign-in. The export is a complete snapshot: a
# conversation a newer export no longer holds leaves the mirror. To keep
# it current afterwards, add an `api` table beside this one (the chatgpt
# INGEST.md, "An export and the API together"): the API then fetches only
# what moved, and the export no longer prunes.
[[groups]]
id = "chatgpt"
name = "ChatGPT export"
type = "chatgpt"

[[steps]]
group = "chatgpt"
function = "ingest"

[steps.params.export]
path = "~/Downloads/chatgpt-export.zip"  # the .zip, or the folder it was unzipped into

[[steps]]
group = "chatgpt"
function = "render_markdown"
inputs = ["chatgpt/ingest"]

# Free-text search: keyword (BM25), then embeddings for search by meaning.
# Add both to `unified_document_index/qmd_aggregator`'s inputs.
[[steps]]
group = "chatgpt"
function = "keyword_index"
inputs = ["chatgpt/render_markdown"]

[[steps]]
group = "chatgpt"
function = "embed"
inputs = ["chatgpt/keyword_index"]
