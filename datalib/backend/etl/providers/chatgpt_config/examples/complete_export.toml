# An unpacked ChatGPT data export on disk, with every option set, and
# searchable. No sign-in. The export is a complete snapshot: a
# conversation a newer export no longer holds leaves the mirror. To keep
# it current afterwards, swap `export` for `api` (the chatgpt INGEST.md,
# "Seeding from an export"): the API then fetches only what moved.
[[groups]]
id = "chatgpt"
name = "ChatGPT export"
type = "chatgpt"

[[steps]]
group = "chatgpt"
function = "ingest"

[steps.params.export]
path = "~/Downloads/chatgpt-export"  # the folder holding `conversations.json`

[[steps]]
group = "chatgpt"
function = "render_markdown"
inputs = ["chatgpt/ingest"]

# Free-text search: keyword (BM25), then embeddings for search by meaning.
# Add both to `unified_document_index/qmd_aggregator`'s inputs.
[[steps]]
group = "chatgpt"
function = "keyword_index"
inputs = ["chatgpt/render_markdown"]

[[steps]]
group = "chatgpt"
function = "embed"
inputs = ["chatgpt/keyword_index"]
