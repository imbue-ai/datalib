[package]
name = "datalib-etl-pdf"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_etl_pdf"
path = "src/lib.rs"

[dependencies]
datalib-etl = { path = "../.." }
datalib-schema = { path = "../../../schema" }
datalib-index-lib = { path = "../../../index_lib" }
datalib-time = { path = "../../../time" }
datalib-obs = { path = "../../../obs" }
sqlx = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
uuid = { workspace = true }
hex = "0.4"
# PDF → Markdown. Pure Rust, MIT, no native deps in the default
# (non-`ocr`) feature set: column detection, reading order, tables, and
# TextBased/Scanned classification all run in-process. The `ocr` feature
# is deliberately NOT enabled — it pulls PDFium + ONNX Runtime as
# external shared libraries. See DOWNLOAD.md §"Why no OCR yet".
pdf-inspector = { workspace = true }
# Trailer `/ID` and the XMP metadata stream, for the document-lineage
# columns. pdf-inspector does not surface either.
lopdf = { workspace = true }
url = { workspace = true }

[dev-dependencies]
insta = { version = "1.41", features = ["json"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
