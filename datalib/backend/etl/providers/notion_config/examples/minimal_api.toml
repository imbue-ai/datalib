# Notion over its API, signed in through latchkey with one stored credential
# carrying both the token and the version header. An empty `api` table mirrors
# every page the token can see.
[[groups]]
id = "notion"
name = "Notion"
type = "notion"

[[steps]]
id = "notion/ingest"
command = "datalib-step run ingest notion"

[steps.params.api]

[[steps]]
id = "notion/render_markdown"
command = "datalib-step run render_markdown notion"
inputs = ["notion/ingest"]
reads = "pinned"
