# GitHub pull requests and their review threads, over GitHub's API, signed
# in through latchkey. An empty `api` table mirrors every PR you wrote,
# commented on or were mentioned in.
[[groups]]
id = "github"
name = "GitHub"
type = "github"

[[steps]]
id = "github/ingest"
command = "datalib-step run ingest github"

[steps.params.api]

[[steps]]
id = "github/render_markdown"
command = "datalib-step run render_markdown github"
inputs = ["github/ingest"]
reads = "pinned"
