# GitHub pull requests and their review threads, over GitHub's API, signed
# in through latchkey (`latchkey auth browser github`). An empty `api`
# table mirrors every PR you wrote, commented on or were mentioned in.
[[groups]]
id = "github"
name = "GitHub"
type = "github"

[[steps]]
group = "github"
function = "ingest"
command = "datalib-step"

[steps.params.api]

[[steps]]
group = "github"
function = "render_markdown"
command = "datalib-step"
inputs = ["github/ingest"]
