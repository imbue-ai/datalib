[package]
name = "datalib-etl-claude-code"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_etl_claude_code"
path = "src/lib.rs"

[dependencies]
datalib-etl = { path = "../.." }
datalib-etl-macros = { path = "../../macros" }
datalib-time = { path = "../../../time" }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
