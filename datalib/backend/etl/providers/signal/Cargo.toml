[package]
name = "datalib-etl-signal"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_etl_signal"
path = "src/lib.rs"

[dependencies]
datalib-etl = { path = "../.." }
datalib-etl-macros = { path = "../../macros" }
datalib-time = { path = "../../../time" }
datalib-signal-backup = { path = "../../../signal-backup" }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
tracing = "0.1"
chrono = { workspace = true }
sha2 = { workspace = true }
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
uuid = { workspace = true }
datalib-schema = { path = "../../../schema" }
datalib-index-lib = { path = "../../../index_lib" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
