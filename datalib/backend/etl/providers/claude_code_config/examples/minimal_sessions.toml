# Claude Code sessions (terminal, desktop app, IDE extension), read off the
# transcripts Claude Code keeps on this machine. No sign-in: an empty
# `sessions` table reads the standard place, ~/.claude/projects.
[[groups]]
id = "claude_code"
name = "Claude Code"
type = "claude_code"

[[steps]]
group = "claude_code"
function = "ingest"
command = "datalib-step"

[steps.params.sessions]

[[steps]]
group = "claude_code"
function = "render_markdown"
command = "datalib-step"
inputs = ["claude_code/ingest"]
