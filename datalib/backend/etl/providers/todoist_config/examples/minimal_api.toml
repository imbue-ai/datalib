# Your Todoist over its API, signed in through latchkey. An empty `api` table
# copies every project, section, label, open task and comment, and every task
# you have completed since you joined; later syncs read only what changed.
[[groups]]
id = "todoist"
name = "Todoist"
type = "todoist"

[[steps]]
id = "todoist/ingest"
command = "datalib-step run ingest todoist"

[steps.params.api]

# One document per project: its sections, its tasks and their comments.
[[steps]]
id = "todoist/render_markdown"
command = "datalib-step run render_markdown todoist"
inputs = ["todoist/ingest"]
reads = "pinned"
