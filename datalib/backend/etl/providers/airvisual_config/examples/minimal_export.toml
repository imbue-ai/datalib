# An AirVisual Pro's own history files, read off its Samba share
# (`smb://<ip>/airvisual`, mounted in the Finder) or a copy of that folder.
# No sign-in. One `devices` entry per monitor.
[[groups]]
id = "airvisual"
name = "AirVisual"
type = "airvisual"

[[steps]]
id = "airvisual/ingest"
command = "datalib-step run ingest airvisual"

[[steps.params.export.devices]]
path = "/Volumes/airvisual"

[[steps]]
id = "airvisual/render_markdown"
command = "datalib-step run render_markdown airvisual"
inputs = ["airvisual/ingest"]
reads = "pinned"

# The readings as time series, for the charts. Add this step to
# `unified_time_series_index/time_series_index`'s inputs.
[[steps]]
id = "airvisual/render_time_series"
command = "datalib-step run render_time_series airvisual"
inputs = ["airvisual/ingest"]
reads = "pinned"
