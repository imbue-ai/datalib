# One Zoom user's meetings over Zoom's API, signed in through latchkey
# (`latchkey auth browser zoom`, which needs a Zoom account admin), with
# every option set.
[[groups]]
id = "zoom"
name = "Zoom"
type = "zoom"

[[steps]]
group = "zoom"
function = "ingest"

# When to give up on rate limits. The download always backs off and
# retries; these only decide when to stop.
[steps.params.common.download_params]
maximum_time_without_progress_in_minutes = 30  # the default
maximum_sequential_failed_requests = 50        # the default

# Which stored latchkey account to use (`latchkey auth list`). Omit it to
# use the only one.
[steps.params.latchkey_settings]
account = "picard@enterprise.example"

[steps.params.api]
user = "picard@enterprise.example"  # whose meetings, by email or Zoom user id. Omit it
                                    # for the sign-in's own user, or the account's only one
since = "2024-01-01"     # the first day to ask about; default 2013-01-01, everything
refresh_days = 30        # the newest days every sync lists again; default 30
participants = true      # who attended, and unrecorded meetings from Zoom's reports
                         # (the last six months); default true
summaries = true         # the AI Companion's meeting summaries; default true

# Each meeting as one document: when, who came and the AI summary. No options.
[[steps]]
group = "zoom"
function = "render_markdown"
inputs = ["zoom/ingest"]

# Free-text search: keyword (BM25), then embeddings for search by meaning.
# Add both to `unified_document_index/qmd_aggregator`'s inputs.
[[steps]]
group = "zoom"
function = "keyword_index"
inputs = ["zoom/render_markdown"]

[[steps]]
group = "zoom"
function = "embed"
inputs = ["zoom/keyword_index"]
