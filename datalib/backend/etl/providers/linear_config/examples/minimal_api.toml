# A Linear workspace over its GraphQL API, signed in through latchkey. An
# empty `api` table copies the whole workspace, newest first; later syncs read
# only what changed.
[[groups]]
id = "linear"
name = "Linear"
type = "linear"

[[steps]]
id = "linear/ingest"
command = "datalib-step run ingest linear"

[steps.params.api]

# Nothing renders as documents; this step writes the storage report that
# puts the source in the grid and counts its issues.
[[steps]]
id = "linear/render_markdown"
command = "datalib-step run render_markdown linear"
inputs = ["linear/ingest"]
reads = "pinned"
