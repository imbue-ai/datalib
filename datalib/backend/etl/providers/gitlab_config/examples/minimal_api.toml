# GitLab merge requests and their discussions, over GitLab's API, signed
# in through latchkey with a personal access token you create. An empty `api`
# table mirrors every MR you opened, are assigned or are reviewing.
[[groups]]
id = "gitlab"
name = "GitLab"
type = "gitlab"

[[steps]]
id = "gitlab/ingest"
command = "datalib-step run ingest gitlab"

[steps.params.api]

[[steps]]
id = "gitlab/render_markdown"
command = "datalib-step run render_markdown gitlab"
inputs = ["gitlab/ingest"]
reads = "pinned"
