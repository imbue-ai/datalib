# Greek and Latin texts from the Perseus Digital Library, fetched from
# PerseusDL's public GitHub repository. No credentials. An empty `github`
# table pulls the default Thucydides editions.
[[groups]]
id = "perseus"
name = "Perseus"
type = "perseus"

[[steps]]
id = "perseus/ingest"
command = "datalib-step run ingest perseus"

[steps.params.github]

[[steps]]
id = "perseus/render_markdown"
command = "datalib-step run render_markdown perseus"
inputs = ["perseus/ingest"]
reads = "files"
