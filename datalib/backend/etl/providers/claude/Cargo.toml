[package]
name = "datalib-etl-claude"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_etl_claude"
path = "src/lib.rs"

[[bin]]
name = "claude-download"
path = "src/bin/claude_download.rs"

[dependencies]
datalib-etl = { path = "../.." }
datalib-etl-chat-common = { path = "../../chat-common" }
datalib-etl-macros = { path = "../../macros" }
datalib-obs = { path = "../../../obs" }
datalib-time = { path = "../../../time" }
datalib-schema = { path = "../../../schema" }
datalib-id = { path = "../../../id" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["process", "fs", "io-util", "time", "rt-multi-thread", "macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
regex = "1.11"
once_cell = "1.20"
uuid = { workspace = true }
tempfile = "3"

[dev-dependencies]
insta = { version = "1.41", features = ["json", "redactions"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
