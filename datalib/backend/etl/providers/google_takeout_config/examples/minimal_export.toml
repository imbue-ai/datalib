# A Google Takeout export on disk (takeout.google.com): the unpacked
# `Takeout/` folder, or a folder holding the export's `.zip`/`.tgz` parts.
# Every feed is off until you turn it on; this one reads Google Chat.
[[groups]]
id = "google_takeout"
name = "Google Takeout"
type = "google_takeout"

[[steps]]
id = "google_takeout/ingest"
command = "datalib-step run ingest google_takeout"

[steps.params.export]
path = "~/Downloads/takeout-export"
google_chat = true

[[steps]]
id = "google_takeout/render_markdown"
command = "datalib-step run render_markdown google_takeout"
inputs = ["google_takeout/ingest"]
reads = "pinned"
