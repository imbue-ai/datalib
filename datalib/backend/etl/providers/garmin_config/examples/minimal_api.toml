# Garmin Connect over the API the Connect phone app uses, signed in through
# latchkey's Garmin plugin (the Add a source dialog installs it). An empty
# `api` table mirrors every per-day metric, weigh-ins and activities from a
# year back.
[[groups]]
id = "garmin"
name = "Garmin Connect"
type = "garmin"

[[steps]]
id = "garmin/ingest"
command = "datalib-step run ingest garmin"

[steps.params.api]

[[steps]]
id = "garmin/render_markdown"
command = "datalib-step run render_markdown garmin"
inputs = ["garmin/ingest"]
reads = "pinned"

# Its numbers as time series, for charts and the time-series index: add
# `garmin/render_time_series` to `unified_time_series_index/time_series_index`'s inputs.
[[steps]]
id = "garmin/render_time_series"
command = "datalib-step run render_time_series garmin"
inputs = ["garmin/ingest"]
reads = "pinned"
