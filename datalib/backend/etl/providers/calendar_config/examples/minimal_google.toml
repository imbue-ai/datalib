# Google Calendar through Google's API, signed in through latchkey
# (`latchkey auth browser google-calendar`). An empty `google` table
# mirrors every calendar on the account's list, all of its history.
[[groups]]
id = "calendar"
name = "Google Calendar"
type = "calendar"

[[steps]]
group = "calendar"
function = "ingest"
command = "datalib-step"

[steps.params.google]

[[steps]]
group = "calendar"
function = "render_markdown"
command = "datalib-step"
inputs = ["calendar/ingest"]

# Every occurrence of every event from 30 days back to 400 ahead, one row
# each, the way Google's `singleEvents=true` lists them.
[[steps]]
group = "calendar"
function = "render_occurrences"
command = "datalib-step"
inputs = ["calendar/ingest"]
