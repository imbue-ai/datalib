# Any other CalDAV server, signed in through a latchkey service
# registered for its host, with every option set, and searchable.
[[groups]]
id = "calendar"
name = "CalDAV Calendar"
type = "calendar"

[[steps]]
group = "calendar"
function = "ingest"
command = "datalib-step"

# When to give up on a failing server. The download always backs off and
# retries; these only decide when to stop.
[steps.params.common.download_params]
maximum_time_without_progress_in_minutes = 30  # the default
maximum_sequential_failed_requests = 50        # the default

# A JSONL copy of every row written, under ingest/events/, for debugging.
# Nothing reads it and it grows every run.
[steps.params.common.event_tape]
enabled = false

# Which stored latchkey account to use (`latchkey auth list`). Omit it to
# use the only one.
[steps.params.latchkey_settings]
account = "picard@example.com"

[steps.params.caldav]
# Where discovery starts. The host alone is usually enough: discovery tries
# `/.well-known/caldav` when it does not answer.
server_url = "https://cloud.example.com/remote.php/dav/"
calendars = ["Bridge Duty", "Away Missions"]  # names as the service shows them, or ids;
                                               # omit for every calendar. One added later
                                               # downloads whole on the next run
since = "2024-01-01"  # first day mirrored: a day, or days from the sync's own ("-2d");
                      # omit for all of history
until = "2026-12-31"  # last day mirrored, included; omit for no end. With either set,
                      # the calendar is listed whole every run rather than resumed

[[steps]]
group = "calendar"
function = "render_markdown"
command = "datalib-step"
inputs = ["calendar/ingest"]

# Free-text search: keyword (BM25), then embeddings for search by meaning.
# Add both to `unified_document_index/qmd_aggregator`'s inputs.
[[steps]]
group = "calendar"
function = "keyword_index"
command = "datalib-step"
inputs = ["calendar/render_markdown"]

[[steps]]
group = "calendar"
function = "embed"
command = "datalib-step"
inputs = ["calendar/keyword_index"]

# Every occurrence of every event in a window of days around now, one row
# each, the way Google's `singleEvents=true` lists them, in
# render_occurrences/occurrences.doltlite_db. The window moves when the
# step runs, which is when ingest has stored something new.
[[steps]]
group = "calendar"
function = "render_occurrences"
command = "datalib-step"
inputs = ["calendar/ingest"]

[steps.params]
days_back = 30    # the default
days_ahead = 400  # the default
