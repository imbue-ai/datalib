# The meetings booked with you on Calendly, through Calendly's API,
# signed in through latchkey's `calendly` service with a personal access
# token. An empty `calendly` table mirrors every meeting, with its invitees and
# their answers to the booking questions.
[[groups]]
id = "calendar"
name = "Calendly"
type = "calendar"

[[steps]]
id = "calendar/ingest"
command = "datalib-step run ingest calendar"

[steps.params.calendly]

[[steps]]
id = "calendar/render_markdown"
command = "datalib-step run render_markdown calendar"
inputs = ["calendar/ingest"]
reads = "pinned"

# Every meeting from 30 days back to 400 ahead, one row each, beside the
# other calendars' occurrences.
[[steps]]
id = "calendar/render_occurrences"
command = "datalib-step run render_occurrences calendar"
inputs = ["calendar/ingest"]
reads = "pinned"
