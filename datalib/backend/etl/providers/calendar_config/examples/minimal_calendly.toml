# The meetings booked with you on Calendly, through Calendly's API,
# signed in through latchkey's `calendly` service with a personal access
# token (`latchkey auth set calendly -H "Authorization: Bearer <token>"`).
# An empty `calendly` table mirrors every meeting, with its invitees and
# their answers to the booking questions.
[[groups]]
id = "calendar"
name = "Calendly"
type = "calendar"

[[steps]]
group = "calendar"
function = "ingest"
command = "datalib-step"

[steps.params.calendly]

[[steps]]
group = "calendar"
function = "render_markdown"
command = "datalib-step"
inputs = ["calendar/ingest"]

# Every meeting from 30 days back to 400 ahead, one row each, beside the
# other calendars' occurrences.
[[steps]]
group = "calendar"
function = "render_occurrences"
command = "datalib-step"
inputs = ["calendar/ingest"]
