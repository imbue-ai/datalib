# A folder of `.ics` files on disk (Google Takeout's `Calendar/`, an
# Apple Calendar export), with every option set, and searchable. No sign-in.
[[groups]]
id = "calendar"
name = "Calendar export"
type = "calendar"

[[steps]]
id = "calendar/ingest"
command = "datalib-step run ingest calendar"

# A JSONL copy of every row written, under ingest/events/, for debugging.
# Nothing reads it and it grows every run.
[steps.params.common.event_tape]
enabled = false

[steps.params.ics]
path = "~/Downloads/calendar-export"  # the folder; each `.ics` file in it is one calendar

[[steps]]
id = "calendar/render_markdown"
command = "datalib-step run render_markdown calendar"
inputs = ["calendar/ingest"]
reads = "pinned"

# Free-text search: keyword (BM25), then embeddings for search by meaning.
# Add both to `unified_document_index/qmd_aggregator`'s inputs.
[[steps]]
id = "calendar/keyword_index"
command = "datalib-step run keyword_index calendar"
inputs = ["calendar/render_markdown"]
reads = "files"
locks = ["qmd_keyword"]

[[steps]]
id = "calendar/embed"
command = "datalib-step run embed calendar"
inputs = ["calendar/keyword_index"]
reads = "files"
locks = ["qmd_embed"]

# Every occurrence of every event in a window of days around now, one row
# each, the way Google's `singleEvents=true` lists them, in
# render_occurrences/occurrences.doltlite_db. The window moves when the
# step runs, which is when ingest has stored something new.
[[steps]]
id = "calendar/render_occurrences"
command = "datalib-step run render_occurrences calendar"
inputs = ["calendar/ingest"]
reads = "pinned"

[steps.params]
days_back = 30    # the default
days_ahead = 400  # the default
