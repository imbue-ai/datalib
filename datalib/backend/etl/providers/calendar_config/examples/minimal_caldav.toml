# Any other CalDAV server (iCloud, Nextcloud, Radicale, …), signed in through
# a latchkey service registered for the server's host, with an app password.
[[groups]]
id = "calendar"
name = "CalDAV Calendar"
type = "calendar"

[[steps]]
group = "calendar"
function = "ingest"
command = "datalib-step"

[steps.params.caldav]
server_url = "https://cloud.example.com/remote.php/dav/"

[[steps]]
group = "calendar"
function = "render_markdown"
command = "datalib-step"
inputs = ["calendar/ingest"]

# Every occurrence of every event from 30 days back to 400 ahead, one row
# each, the way Google's `singleEvents=true` lists them.
[[steps]]
group = "calendar"
function = "render_occurrences"
command = "datalib-step"
inputs = ["calendar/ingest"]
