# Fastmail's calendars over CalDAV, signed in through latchkey's
# `fastmail-dav` service with a read-only app password
# (`latchkey auth set fastmail-dav -u "you@example.com:<app password>"`).
# An empty `fastmail` table mirrors every calendar the account can see.
[[groups]]
id = "calendar"
name = "Fastmail Calendar"
type = "calendar"

[[steps]]
group = "calendar"
function = "ingest"

[steps.params.fastmail]

[[steps]]
group = "calendar"
function = "render_markdown"
inputs = ["calendar/ingest"]
