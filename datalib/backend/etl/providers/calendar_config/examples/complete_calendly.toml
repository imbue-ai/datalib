# The meetings booked with you on Calendly, through Calendly's API,
# signed in through latchkey's `calendly` service with a personal access
# token (`latchkey auth set calendly -H "Authorization: Bearer <token>"`),
# with every option set, and searchable.
[[groups]]
id = "calendar"
name = "Calendly"
type = "calendar"

[[steps]]
group = "calendar"
function = "ingest"
command = "datalib-step"

# When to give up on a failing server. The download always backs off and
# retries; these only decide when to stop.
[steps.params.common.download_params]
maximum_time_without_progress_in_minutes = 30  # the default
maximum_sequential_failed_requests = 50        # the default

# A JSONL copy of every row written, under ingest/events/, for debugging.
# Nothing reads it and it grows every run.
[steps.params.common.event_tape]
enabled = false

# Which stored latchkey account to use (`latchkey auth list`). Omit it to
# use the only one.
[steps.params.latchkey_settings]
account = "picard@example.com"

[steps.params.calendly]
since = "2024-01-01"  # first day mirrored: a day, or days from the sync's own ("-30d"
                      # moves with it). Meetings that start on or after it; omit for
                      # all of history
until = "+21d"        # last day mirrored, included, the same way; omit for no end. A
                      # meeting that leaves the range is dropped from the copy

[[steps]]
group = "calendar"
function = "render_markdown"
command = "datalib-step"
inputs = ["calendar/ingest"]

# Free-text search: keyword (BM25), then embeddings for search by meaning.
# Add both to `unified_document_index/qmd_aggregator`'s inputs.
[[steps]]
group = "calendar"
function = "keyword_index"
command = "datalib-step"
inputs = ["calendar/render_markdown"]

[[steps]]
group = "calendar"
function = "embed"
command = "datalib-step"
inputs = ["calendar/keyword_index"]

# Every meeting in a window of days around now, one row each, in
# render_occurrences/occurrences.doltlite_db, the way the other calendar
# methods list their occurrences. The window moves when the step runs,
# which is when ingest has stored something new.
[[steps]]
group = "calendar"
function = "render_occurrences"
command = "datalib-step"
inputs = ["calendar/ingest"]

[steps.params]
days_back = 30    # the default
days_ahead = 400  # the default
