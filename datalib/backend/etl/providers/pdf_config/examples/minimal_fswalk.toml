# Every PDF under a folder on this machine, converted to markdown. No
# account and no credentials: `fswalk.path` is the folder to scan.
[[groups]]
id = "pdf"
name = "PDFs"
type = "pdf"

[[steps]]
id = "pdf/ingest"
command = "datalib-step run ingest pdf"

[steps.params.fswalk]
path = "~/Documents/papers"

[[steps]]
id = "pdf/render_markdown"
command = "datalib-step run render_markdown pdf"
inputs = ["pdf/ingest"]
reads = "pinned"
