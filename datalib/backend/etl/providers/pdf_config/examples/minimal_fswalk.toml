# Every PDF under a folder on this machine, converted to markdown. No
# account and no credentials: `fswalk.path` is the folder to scan.
[[groups]]
id = "pdf"
name = "PDFs"
type = "pdf"

[[steps]]
group = "pdf"
function = "ingest"

[steps.params.fswalk]
path = "~/Documents/papers"

[[steps]]
group = "pdf"
function = "render_markdown"
inputs = ["pdf/ingest"]
