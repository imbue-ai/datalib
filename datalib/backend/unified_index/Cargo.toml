[package]
name = "datalib-unified-index"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "datalib_unified_index"
path = "src/lib.rs"

# The code also consumes datalib-columns, which is bazel-only (no
# Cargo.toml) — this manifest feeds crate_universe's third-party
# resolution and does not cargo-compile. BUILD.bazel is the dep truth.
[dependencies]
app-schema = { path = "../app_schema" }
datalib-core = { path = "../core" }
datalib-runtime = { path = "../runtime" }
datalib-obs = { path = "../obs" }
datalib-schema = { path = "../schema" }
datalib-time = { path = "../time" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
datalib-table = { path = "../table" }
tempfile = "3"
